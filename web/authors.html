<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Authors — PSVitaAlive Store</title>

    <meta
        name="description"
        content="Discover the developers and creators behind PSVitaAlive Store."
    >

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/authors.css"
    >

</head>


<body>

    <header class="site-header">

        <div class="container header-inner">

            <a
                href="index.html"
                class="site-logo"
            >

                <img
                    src="assets/logo/PSVitaAlive_Store_logo_text.png"
                    alt="PSVitaAlive Store"
                >

            </a>


            <nav
                class="main-nav"
                aria-label="Main navigation"
            >

                <a href="index.html">
                    Home
                </a>

                <a href="category.html">
                    Categories
                </a>

                <a
                    href="authors.html"
                    class="active"
                >
                    Authors
                </a>

            </nav>


            <div class="header-search">

                <input
                    id="author-search"
                    type="search"
                    placeholder="Search authors..."
                    aria-label="Search authors"
                >

            </div>

        </div>

    </header>


    <main class="authors-page">

        <section class="authors-hero">

            <div class="container">

                <span class="authors-label">
                    COMMUNITY
                </span>

                <h1>
                    Authors
                </h1>

                <p>
                    Discover the developers and creators
                    behind PSVitaAlive Homebrew.
                </p>

            </div>

        </section>


        <section class="authors-section">

            <div class="container">

                <div class="authors-section-header">

                    <div>

                        <span
                            id="authors-count"
                            class="authors-count"
                        ></span>

                    </div>

                </div>


                <div
                    id="authors-grid"
                    class="authors-grid"
                ></div>


                <div
                    id="authors-empty"
                    class="authors-empty"
                    hidden
                >

                    <h2>
                        No authors found
                    </h2>

                    <p>
                        Try another search term.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                PSVitaAlive Store — Free and open
                PlayStation Vita homebrew catalog.
            </p>

        </div>

    </footer>


    <script src="js/data.js"></script>

    <script src="js/authors-page.js"></script>

</body>

</html>
