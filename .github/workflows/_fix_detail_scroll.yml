name: Temporary detail scroll speed fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch detail scroll speed
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          s = p.read_text()
          old = 'void FullCatalogScreen::moveDetailScroll(int d){state_.detailScroll+=d<0?-24:24;clampDetailScroll();}'
          new = 'void FullCatalogScreen::moveDetailScroll(int d){state_.detailScroll+=d<0?-48:48;clampDetailScroll();}'
          if old not in s:
              raise SystemExit('detail scroll function pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          git commit -m "fix: speed up app detail scroll [skip ci]"
          rm -f .github/workflows/_fix_detail_scroll.yml
          git add .github/workflows/_fix_detail_scroll.yml
          git commit -m "chore: remove temporary detail scroll workflow [skip ci]"
          git push origin HEAD:main
