name: Internet Archive Diagnostics

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target to test"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - d2vita
          - z2
          - ink
          - ufe
          - pkgj
  # Bootstrap trigger used only for the first diagnostic run.
  # It will be removed after the results are collected so the final workflow is manual-only.
  push:
    paths:
      - ".github/workflows/internet-archive-diagnostics.yml"

permissions:
  contents: read

jobs:
  archive-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Probe Internet Archive downloads
        shell: bash
        env:
          INPUT_TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          set -u

          mkdir -p diagnostics
          SUMMARY="$GITHUB_STEP_SUMMARY"
          printf '# Internet Archive diagnostics\n\n' >> "$SUMMARY"
          printf 'Runner UTC: `%s`  \n' "$(date -u +'%Y-%m-%d %H:%M:%S')" >> "$SUMMARY"
          printf 'Target: `%s`\n\n' "$INPUT_TARGET" >> "$SUMMARY"
          printf '| App | curl | HTTP | Redirects | Effective host | Remote IP | TTFB (s) | Total (s) | Speed | Bytes |\n' >> "$SUMMARY"
          printf '|---|---:|---:|---:|---|---|---:|---:|---:|---:|\n' >> "$SUMMARY"

          run_probe() {
            local key="$1"
            local app="$2"
            local identifier="$3"
            local filename="$4"

            if [[ "$INPUT_TARGET" != "all" && "$INPUT_TARGET" != "$key" ]]; then
              return 0
            fi

            local encoded_file
            encoded_file="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$filename")"
            local url="https://archive.org/download/${identifier}/${encoded_file}"
            local meta="diagnostics/${key}-metadata.json"
            local headers="diagnostics/${key}-headers.txt"
            local chunk="diagnostics/${key}-chunk.bin"
            local stats="diagnostics/${key}-stats.txt"

            echo "===== $app ====="
            echo "URL: $url"

            set +e
            curl -fsSL --connect-timeout 15 --max-time 45 \
              "https://archive.org/metadata/${identifier}" -o "$meta"
            local meta_rc=$?
            set -e

            if [[ $meta_rc -eq 0 ]] && jq -e . "$meta" >/dev/null 2>&1; then
              echo "Archive metadata:"
              jq '{identifier, server, d1, d2}' "$meta"
            else
              echo "Metadata request failed: curl=$meta_rc"
              printf '{"identifier":"%s","metadata_curl":%d}\n' "$identifier" "$meta_rc" > "$meta"
            fi

            set +e
            curl -L --connect-timeout 15 --max-time 75 --retry 1 --retry-delay 2 \
              --range 0-1048575 \
              -sS -D "$headers" -o "$chunk" \
              -w '%{http_code}\t%{url_effective}\t%{remote_ip}\t%{num_redirects}\t%{time_connect}\t%{time_starttransfer}\t%{time_total}\t%{speed_download}\t%{size_download}\n' \
              "$url" > "$stats"
            local rc=$?
            set -e

            local http effective ip redirects tconnect ttfb total speed bytes
            IFS=$'\t' read -r http effective ip redirects tconnect ttfb total speed bytes < "$stats" || true
            http="${http:-0}"
            effective="${effective:-n/a}"
            ip="${ip:-n/a}"
            redirects="${redirects:-0}"
            ttfb="${ttfb:-0}"
            total="${total:-0}"
            speed="${speed:-0}"
            bytes="${bytes:-0}"

            local host
            host="$(python3 - "$effective" <<'PY'
import sys
from urllib.parse import urlparse
print(urlparse(sys.argv[1]).hostname or 'n/a')
PY
)"

            printf '%s\n' "curl exit=$rc HTTP=$http effective=$effective remote_ip=$ip redirects=$redirects ttfb=$ttfb total=$total speed=$speed bytes=$bytes"
            echo "Response chain:"
            grep -iE '^(HTTP/|location:|content-range:|content-length:|accept-ranges:|server:)' "$headers" || true

            printf '| %s | %s | %s | %s | `%s` | `%s` | %s | %s | %s B/s | %s |\n' \
              "$app" "$rc" "$http" "$redirects" "$host" "$ip" "$ttfb" "$total" "$speed" "$bytes" >> "$SUMMARY"

            rm -f "$chunk"
          }

          set -e
          run_probe d2vita "D2Vita 0.1.9" "D2Vita" "d2vita v0.1.9.vpk"
          run_probe z2 "Z2" "psvitaalive-z2" "z2.vpk"
          run_probe ink "INK" "psvitaalive-ink" "ink.vpk"
          run_probe ufe "UFE" "psvitaalive-ufe" "ufe.vpk"
          run_probe pkgj "PKGj" "psvitaalive-pkgj" "pkgj.vpk"

          printf '\n## Notes\n\n' >> "$SUMMARY"
          printf -- '- Each file probe follows redirects and requests only the first 1 MiB using HTTP Range.\n' >> "$SUMMARY"
          printf -- '- Metadata captures Internet Archive `server`, `d1`, and `d2` storage candidates.\n' >> "$SUMMARY"
          printf -- '- A successful HTTP `206` is ideal. Some edges may return `200` while still serving data.\n' >> "$SUMMARY"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internet-archive-diagnostics
          path: diagnostics/
          retention-days: 7
