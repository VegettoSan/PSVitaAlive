name: Internet Archive Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Target to test"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - d2vita
          - z2
          - ink
          - ufe
          - pkgj

permissions:
  contents: read

jobs:
  archive-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Probe Internet Archive downloads and storage nodes
        shell: bash
        env:
          INPUT_TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          set -u
          mkdir -p diagnostics
          REPORT="diagnostics/report.md"

          {
            echo '# Internet Archive diagnostics'
            echo
            echo "Runner UTC: \`$(date -u +'%Y-%m-%d %H:%M:%S')\`  "
            echo "Target: \`$INPUT_TARGET\`"
            echo
            echo '| App / route | curl | HTTP | Redirects | Effective host | Remote IP | TTFB s | Total s | Speed B/s | Bytes |'
            echo '|---|---:|---:|---:|---|---|---:|---:|---:|---:|'
          } > "$REPORT"

          probe_url() {
            local label="$1" url="$2" slug="$3"
            local headers="diagnostics/${slug}-headers.txt"
            local chunk="diagnostics/${slug}-chunk.bin"
            local stats="diagnostics/${slug}-stats.txt"

            set +e
            curl -L --connect-timeout 15 --max-time 75 --retry 1 --retry-delay 2 \
              --range 0-1048575 -sS -D "$headers" -o "$chunk" \
              -w '%{http_code}\t%{url_effective}\t%{remote_ip}\t%{num_redirects}\t%{time_connect}\t%{time_starttransfer}\t%{time_total}\t%{speed_download}\t%{size_download}\n' \
              "$url" > "$stats"
            local rc=$?
            set -e

            local http effective ip redirects tconnect ttfb total speed bytes
            IFS=$'\t' read -r http effective ip redirects tconnect ttfb total speed bytes < "$stats" || true
            http="${http:-0}"; effective="${effective:-n/a}"; ip="${ip:-n/a}"; redirects="${redirects:-0}"
            ttfb="${ttfb:-0}"; total="${total:-0}"; speed="${speed:-0}"; bytes="${bytes:-0}"

            local host
            host="$(python3 - "$effective" <<'PY'
import sys
from urllib.parse import urlparse
print(urlparse(sys.argv[1]).hostname or 'n/a')
PY
)"

            printf '| %s | %s | %s | %s | `%s` | `%s` | %s | %s | %s | %s |\n' \
              "$label" "$rc" "$http" "$redirects" "$host" "$ip" "$ttfb" "$total" "$speed" "$bytes" >> "$REPORT"
            rm -f "$chunk"
          }

          run_item() {
            local key="$1" app="$2" identifier="$3" filename="$4"
            [[ "$INPUT_TARGET" == "all" || "$INPUT_TARGET" == "$key" ]] || return 0

            local encoded meta dir
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$filename")"
            meta="diagnostics/${key}-metadata.json"

            set +e
            curl -fsSL --connect-timeout 15 --max-time 45 "https://archive.org/metadata/${identifier}" -o "$meta"
            local meta_rc=$?
            set -e

            probe_url "$app via archive.org" "https://archive.org/download/${identifier}/${encoded}" "${key}-archive"

            if [[ $meta_rc -eq 0 ]] && jq -e . "$meta" >/dev/null 2>&1; then
              dir="$(jq -r '.dir // empty' "$meta")"
              {
                echo
                echo "### $app metadata"
                echo
                echo "- identifier: \`$identifier\`"
                echo "- dir: \`${dir:-n/a}\`"
                echo "- server: \`$(jq -r '.server // "n/a"' "$meta")\`"
                echo "- d1: \`$(jq -r '.d1 // "n/a"' "$meta")\`"
                echo "- d2: \`$(jq -r '.d2 // "n/a"' "$meta")\`"
              } >> "$REPORT"

              if [[ -n "$dir" ]]; then
                mapfile -t hosts < <(jq -r '[.server,.d1,.d2] | map(select(. != null and . != "")) | unique[]' "$meta")
                local i=0
                for host in "${hosts[@]}"; do
                  i=$((i+1))
                  probe_url "$app direct $host" "https://${host}${dir}/${encoded}" "${key}-direct-${i}"
                done
              fi
            else
              {
                echo
                echo "### $app metadata"
                echo
                echo "Metadata request failed with curl exit \`$meta_rc\`."
              } >> "$REPORT"
            fi
          }

          set -e
          run_item d2vita 'D2Vita 0.1.9' 'D2Vita' 'd2vita v0.1.9.vpk'
          run_item z2 'Z2' 'psvitaalive-z2' 'z2.vpk'
          run_item ink 'INK' 'psvitaalive-ink' 'ink.vpk'
          run_item ufe 'UFE' 'psvitaalive-ufe' 'ufe.vpk'
          run_item pkgj 'PKGj' 'psvitaalive-pkgj' 'pkgj.vpk'

          {
            echo
            echo '## Interpretation'
            echo
            echo '- `curl=0` means the transfer completed successfully.'
            echo '- HTTP `206` is expected for the 1 MiB Range probe; HTTP `200` can mean the edge ignored Range.'
            echo '- `archive.org` rows test normal redirects; `direct` rows test metadata storage candidates.'
          } >> "$REPORT"

          cat "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internet-archive-diagnostics
          path: diagnostics/
          retention-days: 7
