name: temporary-vita-install-probe-fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_vita_install_probe_fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch local install probing
        shell: python
        run: |
          from pathlib import Path
          p=Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          t=p.read_text(encoding='utf-8')
          marker='struct InstallProbeEntry {'
          if marker not in t:
              raise SystemExit('bounded install probe patch missing from main')
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f '.github/workflows/_tmp_vita_install_probe_fix.yml'
          git add '.github/workflows/_tmp_vita_install_probe_fix.yml'
          git commit -m 'chore: remove temporary install probe patch workflow'
          git push origin HEAD:main
