name: temporary-vita-install-probe-fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_vita_install_probe_fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded probe patch
        run: |
          grep -q 'kMaxProbesPerWindow = 2' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          grep -q 'kPositiveTtlMs = 8000' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          grep -q 'kNegativeTtlMs = 4000' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f '.github/workflows/_tmp_vita_install_probe_fix.yml'
          git add '.github/workflows/_tmp_vita_install_probe_fix.yml'
          git commit -m 'chore: remove temporary install probe workflow'
          git push origin HEAD:main
