name: Apply UI polish v2
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run polish v2
        run: |
          set -euo pipefail
          python3 scripts/apply_ui_polish2.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" \
            "Client PSVitaAlive/source/main.cpp" \
            "Client PSVitaAlive/source/catalog/catalog_manager.cpp" || true
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ui: clip overflow, larger text, link marquee, loading messages, Recommended text-only"
            git push origin HEAD:main
          fi
