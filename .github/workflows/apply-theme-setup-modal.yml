name: Apply theme setup modal
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_theme_setup_modal.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" "Client PSVitaAlive/source/main.cpp"
          if git diff --staged --quiet; then echo "No changes"; exit 1; fi
          git commit -m "ui: first-run color theme picker before News"
          git push origin HEAD:main
