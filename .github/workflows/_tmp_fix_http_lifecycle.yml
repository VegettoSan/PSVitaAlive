name: temporary http lifecycle fix
on:
  push:
    branches: [tmp/fix-http-lifecycle]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch HttpClient global lifecycle
        shell: python
        run: |
          from pathlib import Path
          p = Path('Client PSVitaAlive/source/network/http_client.cpp')
          s = p.read_text(encoding='utf-8')
          old_inc = '#include <cstdio>\n#include <cstring>\n#include <strings.h>\n#include <utility>\n'
          new_inc = '#include <cstdio>\n#include <cstring>\n#include <strings.h>\n#include <utility>\n#include <mutex>\n'
          if old_inc not in s: raise SystemExit('include block not found')
          s = s.replace(old_inc, new_inc, 1)
          old_ns = 'namespace {\nconstexpr size_t DOWNLOAD_BUFFER_SIZE = 512 * 1024;'
          new_ns = 'namespace {\nstd::mutex gCurlLifecycleMutex;\nunsigned gCurlUsers = 0;\n\nconstexpr size_t DOWNLOAD_BUFFER_SIZE = 512 * 1024;'
          if old_ns not in s: raise SystemExit('namespace block not found')
          s = s.replace(old_ns, new_ns, 1)
          old_init = '''HttpResult HttpClient::init() {
    if (initialized_) return HttpResult::Ok;
    lastError_.clear();
    lastStatus_ = 0;
    lastRangeAccepted_ = false;
    const CURLcode result = curl_global_init(CURL_GLOBAL_DEFAULT);
    if (result != CURLE_OK) {
        setError(curl_easy_strerror(result));
        return HttpResult::NetworkError;
    }
    initialized_ = true;
    sceClibPrintf("[HttpClient] libcurl initialized\\n");
    httpDiagnostic("libcurl initialized");
    return HttpResult::Ok;
}

void HttpClient::shutdown() {
    if (!initialized_) return;
    curl_global_cleanup();
    initialized_ = false;
    sceClibPrintf("[HttpClient] libcurl shutdown\\n");
    httpDiagnostic("libcurl shutdown");
}
'''
          new_init = '''HttpResult HttpClient::init() {
    if (initialized_) return HttpResult::Ok;
    lastError_.clear();
    lastStatus_ = 0;
    lastRangeAccepted_ = false;

    std::lock_guard<std::mutex> lock(gCurlLifecycleMutex);
    if (gCurlUsers == 0) {
        const CURLcode result = curl_global_init(CURL_GLOBAL_DEFAULT);
        if (result != CURLE_OK) {
            setError(curl_easy_strerror(result));
            return HttpResult::NetworkError;
        }
        httpDiagnostic("libcurl global init");
    }
    ++gCurlUsers;
    initialized_ = true;

    char msg[96];
    sceClibSnprintf(msg, sizeof(msg), "libcurl initialized (users=%u)", gCurlUsers);
    sceClibPrintf("[HttpClient] %s\\n", msg);
    httpDiagnostic(msg);
    return HttpResult::Ok;
}

void HttpClient::shutdown() {
    if (!initialized_) return;

    std::lock_guard<std::mutex> lock(gCurlLifecycleMutex);
    if (!initialized_) return;
    initialized_ = false;
    if (gCurlUsers > 0) --gCurlUsers;

    if (gCurlUsers == 0) {
        curl_global_cleanup();
        httpDiagnostic("libcurl global cleanup");
    }

    char msg[96];
    sceClibSnprintf(msg, sizeof(msg), "libcurl shutdown (users=%u)", gCurlUsers);
    sceClibPrintf("[HttpClient] %s\\n", msg);
    httpDiagnostic(msg);
}
'''
          if old_init not in s: raise SystemExit('lifecycle block not found')
          s = s.replace(old_init, new_init, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/_tmp_fix_http_lifecycle.yml').unlink()
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/network/http_client.cpp' '.github/workflows/_tmp_fix_http_lifecycle.yml'
          git commit -m 'client: make libcurl lifecycle process-wide and reference-counted'
          git push origin HEAD:tmp/fix-http-lifecycle
