name: Fix download UI compile errors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'VegettoSan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic source fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('Client PSVitaAlive/source/main.cpp')
          s = p.read_text(encoding='utf-8')

          old1 = '''        char count[180]={};sceClibSnprintf(count,sizeof(count),"Files: %llu / %u",(unsigned long long)completed,(unsigned)jobs.size());vita2d_pgf_draw_text(font,x+28,y+194,ACCENT,.62f,count);\n        char known[220]={};sceClibSnprintf(known,sizeof(known),"Known size: %s",formatBytes(p.knownTotalBytes).c_str());vita2d_pgf_draw_text(font,x+28,y+218,TEXT,.56f,known);\n        uint64_t eta=0;if(completed>0&&jobs.size()>completed&&now>started){uint64_t elapsed=now-started;eta=(elapsed/1000000ULL)*(jobs.size()-completed)/completed;if(eta==0)eta=1;}char et[96]={};if(eta<60)sceClibSnprintf(et,sizeof(et),"ETA ~%llus",(unsigned long long)eta);else sceClibSnprintf(et,sizeof(et),"ETA ~%llum",(unsigned long long)(eta/60));vita2d_pgf_draw_text(font,x+28,y+242,DIM,.54f,et);\n'''
          new1 = '''        char known[220]={};sceClibSnprintf(known,sizeof(known),"Known size: %s",formatBytes(p.knownTotalBytes).c_str());vita2d_pgf_draw_text(font,x+28,y+218,TEXT,.56f,known);\n'''
          if old1 not in s:
              raise SystemExit('Expected duplicate image progress block not found')
          s = s.replace(old1, new1, 1)

          old2 = '''    screen.setInstallCallbacks([&installer](const psvitaalive::ui::CatalogItem&item){psvitaalive::diagnostics::log("[UI] INSTALL REQUEST name="+item.name+" title_id="+item.titleId+" url="+item.downloadUrl);\n    screen.setInstallCancelCallback([&installer](){ installer.cancel(); });if(item.downloadUrl.empty()||item.downloadFileName.empty())return false;std::string zipDestination;if(isZipName(item.downloadFileName)){zipDestination="ux0:data/";if(!promptZipDestination(zipDestination)){psvitaalive::diagnostics::log("[UI] ZIP destination cancelled");return false;}}return installer.requestInstall(item.downloadUrl,item.downloadFileName,zipDestination);},[&installer](){return installStatusText(installer.status());});\n'''
          new2 = '''    screen.setInstallCancelCallback([&installer](){ installer.cancel(); });\n    screen.setInstallCallbacks([&installer](const psvitaalive::ui::CatalogItem&item){psvitaalive::diagnostics::log("[UI] INSTALL REQUEST name="+item.name+" title_id="+item.titleId+" url="+item.downloadUrl);\n    if(item.downloadUrl.empty()||item.downloadFileName.empty())return false;std::string zipDestination;if(isZipName(item.downloadFileName)){zipDestination="ux0:data/";if(!promptZipDestination(zipDestination)){psvitaalive::diagnostics::log("[UI] ZIP destination cancelled");return false;}}return installer.requestInstall(item.downloadUrl,item.downloadFileName,zipDestination);},[&installer](){return installStatusText(installer.status());});\n'''
          if old2 not in s:
              raise SystemExit('Expected install callback block not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git diff -- "Client PSVitaAlive/source/main.cpp"
          rm -f .github/workflows/fix_download_ui_compile_errors.yml
          git add "Client PSVitaAlive/source/main.cpp" .github/workflows/fix_download_ui_compile_errors.yml
          git commit -m "Fix download UI compile errors"
          git push origin HEAD:main
