name: Apply card name clip + data request webhook
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          set -euo pipefail
          python3 -c '
          import base64, pathlib
          b = """B64_PLACEHOLDER"""
          pathlib.Path("fix_card_webhook.py").write_bytes(base64.b64decode(b))
          '
          python3 fix_card_webhook.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add "Client PSVitaAlive/source/ui/full_catalog_screen.cpp"
          git status
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "ui: clip long card titles with ellipsis; data-request webhook channel"
            git push origin HEAD:main
          fi
