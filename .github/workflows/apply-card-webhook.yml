name: Apply card name clip + data request webhook
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          set -euo pipefail
          if [ -f scripts/fix_card_webhook.py ]; then python3 scripts/fix_card_webhook.py || true; fi
          python3 scripts/fix_rightpad.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add "Client PSVitaAlive/source/ui/full_catalog_screen.cpp"
          git status
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "ui: more space for card titles (rightPad 64)"
            git push origin HEAD:main
          fi
