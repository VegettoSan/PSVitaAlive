name: Validate incremental Game Files and clear uninstall results
on:
  push:
    branches:
      - work/installed-data-progressive-ui-20261106
    paths:
      - .github/workflows/installed-data-progressive-staging.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vita:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch large UI and check changes
        run: |
          python3 scripts/patch_installed_data_progressive_ui.py
          git diff --check
          grep -q 'finishInstalledDataResult' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          grep -q 'ID_OP_ROOT_PROGRESS' 'Client PSVitaAlive/source/ui/installed_data_screen.inc'
      - name: Test installed data safety and progress counters
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_installed_data_policy.cpp -o /tmp/psva-data-policy
          /tmp/psva-data-policy
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_installed_directory_cache.cpp \
            "Client PSVitaAlive/source/storage/installed_directory_codec.cpp" \
            -o /tmp/psva-cache-tests
          /tmp/psva-cache-tests
      - name: Check localized UI keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          langs=("en","es","fr","de","it","pt-BR","pt-PT","ru")
          keys=("ID_ONLY_APP_LABEL","ID_ONLY_FILES_LABEL","ID_APP_AND_FILES_LABEL",
                "ID_AUTO_MEASURING","ID_DELETE_APP","ID_DELETE_FILES",
                "ID_DELETE_ALL","ID_DELETE_APP_NOTE","ID_DELETE_FILES_NOTE",
                "ID_DELETE_ALL_NOTE","ID_REFRESH_SIZES_HINT","ID_SCAN_FINISHING",
                "ID_OP_DATA_STAGE","ID_OP_VERIFY_STAGE","ID_OP_APP_STAGE",
                "ID_OP_FILES_EXPLAIN","ID_OP_APP_EXPLAIN","ID_OP_ROOT_PROGRESS",
                "ID_OP_FILES_REMOVED","ID_OP_DIRS_REMOVED","ID_OP_INDETERMINATE",
                "ID_OP_DO_NOT_CLOSE","ID_RESULT_SUCCESS","ID_RESULT_PARTIAL",
                "ID_RESULT_FAILURE","ID_RESULT_APP_REMOVED","ID_RESULT_APP_FAILED",
                "ID_RESULT_FILES_REMOVED","ID_RESULT_FILES_NOT_STARTED",
                "ID_RESULT_FILES_FAILED","ID_RESULT_RECHECK","ID_RESULT_CONTINUE")
          for lang in langs:
              path=Path(f"Client PSVitaAlive/assets/lang/{lang}.lang")
              lines=path.read_text(encoding="utf-8").splitlines()
              defined=[x.split("=",1)[0] for x in lines if "=" in x]
              assert len(defined)==len(set(defined)),(lang,"duplicate keys")
              assert set(keys).issubset(defined),(lang, sorted(set(keys)-set(defined)))
          print("All eight languages contain the 32 new UI keys")
          PY
      - name: Compile VitaSDK VPK
        run: |
          docker pull vitasdk/vitasdk:2026.08
          docker run --rm -v "$PWD:/workspace" \
            -w "/workspace/Client PSVitaAlive" vitasdk/vitasdk:2026.08 \
            bash -lc 'set -euo pipefail; cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release; cmake --build build-ci --parallel 2; test -s build-ci/PSVitaAlive.vpk'
      - name: Upload VPK for smoke test
        uses: actions/upload-artifact@v4
        with:
          name: PSVitaAlive-installed-data-progressive-staging
          path: Client PSVitaAlive/build-ci/PSVitaAlive.vpk
          if-no-files-found: error
      - name: Commit validated UI and remove temporary scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/patch_installed_data_progressive_ui.py
          rm .github/workflows/installed-data-progressive-staging.yml
          git add -A
          git commit -m "Integrate validated progressive installed data UI"
          git push origin HEAD:work/installed-data-progressive-ui-20261106
