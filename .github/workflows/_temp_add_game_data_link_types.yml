name: Temp VitaAlive link type fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal client fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          text = p.read_text(encoding='utf-8')
          old = 'bool isDownloadLink(const CatalogLink&l){return lowerAscii(l.type)=="download"||lowerAscii(l.type)=="downloads"||lowerAscii(l.type)=="mirror"||lowerAscii(l.type)=="dlc";}'
          new = 'bool isDownloadLink(const CatalogLink&l){std::string t=lowerAscii(l.type);return t=="download"||t=="downloads"||t=="mirror"||t=="dlc"||t=="game files"||t=="game file"||t=="gamefiles"||t=="data files"||t=="data file"||t=="datafiles";}'
          if text.count(old) != 1:
              raise SystemExit('Expected link filter not found exactly once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate diff
        run: |
          git diff --check
          git diff -- 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'

      - name: Commit directly to main and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          git rm '.github/workflows/_temp_add_game_data_link_types.yml'
          git commit -m 'fix: show Game Files and Data Files links in Vita client'
          git push origin HEAD:main
