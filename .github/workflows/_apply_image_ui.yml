name: Apply requested image UI optimizations
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          s=p.read_text()
          s=s.replace('MAX_APP_TEXTURES=9,MAX_SCREENSHOT_TEXTURES=3','MAX_APP_TEXTURES=9,MAX_SCREENSHOT_TEXTURES=5')
          s=s.replace('DIRECTION_REPEAT_INTERVAL_US=500000','DIRECTION_REPEAT_INTERVAL_US=333333')
          m=re.search(r'void\s+FullCatalogScreen::prepareVisibleTextures\s*\([^)]*\)\s*\{',s)
          d=re.search(r'void\s+FullCatalogScreen::drawImage\s*\([^)]*\)\s*\{',s)
          n=re.search(r'void\s+FullCatalogScreen::drawCatalogCard\s*\([^)]*\)\s*\{',s)
          if not (m and d and n and m.start()<d.start()<n.start()):
              raise SystemExit('Could not locate texture functions in full_catalog_screen.cpp')
          prepare='''void FullCatalogScreen::prepareVisibleTextures(){
              if(!imageCache_||catalogLoading_||installProgressActive_)return;
              if(state_.mode==UiMode::FULL_CATALOG||state_.mode==UiMode::OPENING_DETAIL){
                  const int first=std::max(0,state_.catalogScrollRow*3);
                  const int last=std::min((int)items_.size(),first+9);
                  for(int i=first;i<last;++i)if(!items_[i].icon.empty())prepareImageTexture(items_[i].icon,"app");
                  return;
              }
              if(state_.mode==UiMode::SPLIT_DETAIL||state_.mode==UiMode::CLOSING_DETAIL){
                  const int first=std::max(0,state_.catalogScrollRow);
                  const int last=std::min((int)items_.size(),first+visibleRowsSplit()+1);
                  for(int i=first;i<last;++i)if(!items_[i].icon.empty())prepareImageTexture(items_[i].icon,"app");
              }
          }
          '''
          s=s[:m.start()]+prepare+s[d.start():]
          d=re.search(r'void\s+FullCatalogScreen::drawImage\s*\([^)]*\)\s*\{',s)
          n=re.search(r'void\s+FullCatalogScreen::drawCatalogCard\s*\([^)]*\)\s*\{',s)
          draw='''void FullCatalogScreen::drawImage(const std::string&url,const std::string&ns,int x,int y,int w,int h){
              vita2d_draw_rectangle(x,y,w,h,SURFACE2);
              if(!imageCache_||url.empty())return;
              if(ns=="shot"){
                  const int clipTop=HEADER_H+TABS_H+DETAIL_HEADER_H;
                  const int clipBottom=SCREEN_H-FOOTER_H;
                  if(y+h<=clipTop||y>=clipBottom)return;
              }
              std::string path=imageCache_->request(url,ns);
              if(imageCache_->isFailed(path)||!imageCache_->isReady(path))return;
              auto it=textures_.find(path);
              if(it==textures_.end())return;
              touchTexture(path);
              vita2d_texture*t=it->second;
              float tw=(float)vita2d_texture_get_width(t),th=(float)vita2d_texture_get_height(t);
              if(tw<=0||th<=0)return;
              float sc=std::min((float)w/tw,(float)h/th),dw=tw*sc,dh=th*sc;
              vita2d_draw_texture_scale(t,x+(w-dw)/2.0f,y+(h-dh)/2.0f,sc,sc);
          }
          '''
          s=s[:d.start()]+draw+s[n.start():]
          p.write_text(s)
          PY
      - name: Commit patched client
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Implement requested image UI optimizations'
          git push
