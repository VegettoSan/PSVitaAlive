name: Apply screen-on + install hints
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 scripts/apply_screen_on_hints.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/source/installer/install_controller.cpp" \
            "Client PSVitaAlive/source/ui/full_catalog_screen.cpp"
          git status
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "ui: keep screen on during install + clearer user hints"
            git push origin HEAD:main
          fi
