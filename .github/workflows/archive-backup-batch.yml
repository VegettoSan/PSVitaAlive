name: Archive.org owned VPK backups (BATCH)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-backup-batch.yml
      - scripts/archive_item_creation.py
      - scripts/archive_backup_batch.py
      - scripts/archive_backup_batch_preview.py
      - tests/test_archive_backup_batch.py
      - scripts/archive_new_items_batch.py
      - tests/test_archive_new_items_batch.py
      - tests/test_archive_item_creation.py
      - scripts/archive_media_backup.py
      - tests/test_archive_media_backup.py
  # Follow Orbit's normal release-monitor dispatch, but do not write at
  # the same moment as the catalog synchronization: shared lock serializes.
  workflow_run:
    workflows: ['Sync Verified Homebrew Releases']
    types: [completed]
  schedule:
    # Orbit scans at 17 */3; backup scan at minute 47 is the safe fallback.
    - cron: '47 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # No actions:write token: validate.yml handles this batch via workflow_run.

# Same publisher lock as validate.yml and sync_homebrew_releases.yml.
concurrency:
  group: vitahub-catalog-publisher
  cancel-in-progress: false

jobs:
  preserve-approved-vpks:
    if: >-
      github.repository == 'VegettoSan/PSVitaAlive' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'repository_dispatch' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == 'VegettoSan/PSVitaAlive') ||
        (github.event_name == 'workflow_dispatch' &&
         github.actor == 'VegettoSan')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout canonical sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Archive.org client
        run: python -m pip install 'internetarchive==5.13.0' 'requests==2.32.5' 'Pillow==12.1.1'
      - name: Run offline safety tests before any transfer
        run: |
          python -m unittest discover -s tests -p 'test_archive_media_backup.py' -v
          python -m unittest discover -s tests -p 'test_archive_item_creation.py' -v
          python -m unittest discover -s tests -p 'test_archive_new_items_batch.py' -v
          python -m unittest discover -s tests -p 'test_archive_backup_batch.py' -v
          python -m unittest discover -s tests -p 'test_archive_owner_preflight.py' -v
          python -m unittest discover -s tests -p 'test_archive_upload_one_pilot.py' -v
      - name: Configure bot commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Process approved owned-item VPK batch
        if: github.event_name != 'push'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_EXPECTED_UPLOADER: ${{ secrets.IA_EXPECTED_UPLOADER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-batch-report
          python -m scripts.archive_backup_batch --execute \
            --max-files 12 --max-file-mib 200 \
            --max-batch-mib 800 --max-minutes 38 \
            --report archive-batch-report/run.json
      - name: Pilot new Archive.org item (VitaForge only)
        timeout-minutes: 15
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_EXPECTED_UPLOADER: ${{ secrets.IA_EXPECTED_UPLOADER }}
        run: python -m scripts.archive_item_creation --execute
      - name: Initial preservation batch (pilots then automatic queue)
        timeout-minutes: 38
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_EXPECTED_UPLOADER: ${{ secrets.IA_EXPECTED_UPLOADER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.archive_new_items_batch --execute --automatic
      - name: Preserve changed media in existing owned items
        timeout-minutes: 8
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_EXPECTED_UPLOADER: ${{ secrets.IA_EXPECTED_UPLOADER }}
        run: python -m scripts.archive_media_backup --execute --max-images 3
      - name: Store diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-backup-batch-report
          path: archive-batch-report/
          if-no-files-found: ignore
          retention-days: 14
