name: Apply screenshot memory fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Apply screenshot lifecycle changes
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Client PSVitaAlive/source/ui/image_cache.cpp')
          s=p.read_text()
          s2=s.replace('ns=="app"?256u:2048u', 'ns=="app"?256u:512u')
          s2=s2.replace('job.path.find("/app_")!=std::string::npos?256u:2048u', 'job.path.find("/app_")!=std::string::npos?256u:512u')
          if s2 == s: raise SystemExit('image normalization pattern not found')
          p.write_text(s2)
          h=Path('Client PSVitaAlive/include/ui/full_catalog_screen.hpp')
          hs=h.read_text()
          marker='    void releaseTextures();\n'
          if 'void releaseScreenshotTextures();' not in hs:
              if marker not in hs: raise SystemExit('header marker not found')
              h.write_text(hs.replace(marker, marker+'    void releaseScreenshotTextures();\n',1))
          p=Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          s=p.read_text()
          def body(text, sig):
              start=text.find(sig)
              if start<0: raise SystemExit('function not found: '+sig)
              brace=text.find('{',start); depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return start,brace,i+1
              raise SystemExit('function end not found: '+sig)
          if 'void FullCatalogScreen::releaseScreenshotTextures()' not in s:
              start,brace,end=body(s,'void FullCatalogScreen::releaseTextures()')
              fn='void FullCatalogScreen::releaseScreenshotTextures(){bool any=false;for(const auto&kv:textures_)if(kv.first.find("/shot_")!=std::string::npos){any=true;break;}if(any)vita2d_wait_rendering_done();for(auto i=textures_.begin();i!=textures_.end();){if(i->first.find("/shot_")!=std::string::npos){if(i->second)vita2d_free_texture(i->second);i=textures_.erase(i);}else ++i;}textureOrder_.erase(std::remove_if(textureOrder_.begin(),textureOrder_.end(),[](const std::string&p){return p.find("/shot_")!=std::string::npos;}),textureOrder_.end());}'
              s=s[:end]+fn+s[end:]
          old='void FullCatalogScreen::evictTextureIfNeeded(const std::string&ns){size_t lim=ns=="shot"?MAX_SCREENSHOT_TEXTURES:MAX_APP_TEXTURES,c=0;for(const auto&p:textureOrder_)if(p.find("/"+ns+"_")!=std::string::npos)++c;if(c<lim)return;for(auto i=textureOrder_.begin();i!=textureOrder_.end();++i)if(i->find("/"+ns+"_")!=std::string::npos){auto t=textures_.find(*i);if(t!=textures_.end()){if(t->second){vita2d_wait_rendering_done();vita2d_free_texture(t->second);textures_.erase(t);}}textureOrder_.erase(i);return;}}'
          if old not in s: raise SystemExit('eviction pattern not found')
          new='void FullCatalogScreen::evictTextureIfNeeded(const std::string&ns){if(ns=="shot")return;size_t lim=MAX_APP_TEXTURES,c=0;for(const auto&p:textureOrder_)if(p.find("/app_")!=std::string::npos)++c;if(c<lim)return;for(auto i=textureOrder_.begin();i!=textureOrder_.end();++i)if(i->find("/app_")!=std::string::npos){auto t=textures_.find(*i);if(t!=textures_.end()){if(t->second){vita2d_wait_rendering_done();vita2d_free_texture(t->second);textures_.erase(t);}}textureOrder_.erase(i);return;}}'
          s=s.replace(old,new,1)
          start,brace,end=body(s,'void FullCatalogScreen::startClosingDetail()')
          b=s[brace:end]
          if 'releaseScreenshotTextures();' not in b:
              b=b[:1]+'releaseScreenshotTextures();'+b[1:]
              s=s[:brace]+b+s[end:]
          start,brace,end=body(s,'void FullCatalogScreen::moveCatalogFocus(int d)')
          b=s[brace:end]
          if 'releaseScreenshotTextures();' not in b:
              needle='{if(items_.empty())return;'
              if needle not in b: raise SystemExit('move focus pattern not found')
              b=b.replace(needle,'{if(items_.empty())return;if(state_.mode!=UiMode::FULL_CATALOG)releaseScreenshotTextures();',1)
              s=s[:brace]+b+s[end:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/image_cache.cpp' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp' 'Client PSVitaAlive/include/ui/full_catalog_screen.hpp'
          git commit -m 'Stabilize detail screenshot texture lifetime'
          git push origin main
      - name: Remove temporary workflow
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/__fix_screenshot_lifetime.yml
          git add -u .github/workflows/__fix_screenshot_lifetime.yml
          git commit -m 'Remove temporary screenshot workflow'
          git push origin main
