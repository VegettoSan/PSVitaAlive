name: Validate and Generate VitaHub Catalog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-json:
    name: Validate and Generate VitaHub Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply temporary client UI patch
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "fix: custom startup prompt and safe texture release" ]; then exit 0; fi
          if [ ! -f scripts/patch_client_ui.py ]; then exit 0; fi
          python scripts/patch_client_ui.py
          git add 'Client PSVitaAlive/source/main.cpp' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
          if git diff --cached --quiet; then
            echo "No client UI changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: custom startup prompt and safe texture release"
          git push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate historical IDs
        run: python scripts/validate_registry.py

      - name: Validate VitaHub catalog
        run: python scripts/validate_catalog.py

      - name: Generate VitaHub catalogs
        run: python scripts/generate_catalog.py

      - name: Verify generated catalogs
        run: |
          test -f catalog.json
          test -f authors.json
          test -f categories.json

          python -m json.tool catalog.json > /dev/null
          python -m json.tool authors.json > /dev/null
          python -m json.tool categories.json > /dev/null

          echo "Generated catalogs:"
          ls -lh catalog.json authors.json categories.json

      - name: Commit generated catalogs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add catalog.json authors.json categories.json

          if git diff --cached --quiet; then
            echo "No catalog changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update generated VitaHub catalogs"

          git push