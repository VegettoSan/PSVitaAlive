name: Validate and Generate VitaHub Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize catalog generation/publication. This prevents concurrent runs from
# creating the same new app/author file and then colliding during rebase.
concurrency:
  group: vitahub-catalog-publisher
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Decide catalog mode
        id: mode
        shell: bash
        run: |
          if [ -f sources/rebuild_once.json ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "VITAHUB_REBUILD_FROM_EXTERNAL=true" >> "$GITHUB_ENV"
            echo "External rebuild requested."
            rm -f sources/rebuild_once.json
          elif python scripts/validate_catalog_ci.py; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "VITAHUB_REBUILD_FROM_EXTERNAL=false" >> "$GITHUB_ENV"
            echo "Existing source catalog is valid; using incremental mode."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "VITAHUB_REBUILD_FROM_EXTERNAL=true" >> "$GITHUB_ENV"
            echo "Existing source catalog is invalid; falling back to external rebuild."
          fi

      - name: Run external aggregation smoke test
        run: python scripts/external_smoke_test.py

      - name: Generate merged VitaHub catalogs and canonical source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITAHUB_REBUILD_FROM_EXTERNAL: ${{ steps.mode.outputs.rebuild }}
        run: python scripts/generate_catalog.py

      - name: Normalize persisted canonical source files
        run: python scripts/normalize_persisted_sources.py

      - name: Remove orphan authors from generated registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          referenced = set()
          for path in sorted((root / 'apps').glob('*.json')):
              try:
                  app = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              ids = app.get('author_ids', [])
              if isinstance(ids, list):
                  referenced.update(x for x in ids if isinstance(x, str) and x.strip())

          authors = []
          for path in sorted((root / 'authors').glob('*.json')):
              try:
                  author = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if author.get('id') in referenced:
                  authors.append(author)

          found = {a.get('id') for a in authors}
          missing = sorted(referenced - found)
          if missing:
              raise SystemExit('Referenced authors missing from authors/: ' + ', '.join(missing))

          authors.sort(key=lambda a: str(a.get('name', a.get('id', ''))).lower())
          (root / 'authors.json').write_text(
              json.dumps(authors, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          total_profiles = len(list((root / 'authors').glob('*.json')))
          print(f'Referenced authors: {len(referenced)}')
          print(f'Authors published: {len(authors)}')
          print(f'Orphan profiles excluded from authors.json: {max(0, total_profiles - len(authors))}')
          PY

      - name: Validate VitaHub source catalog
        run: python scripts/validate_catalog_ci.py

      - name: Verify generated catalogs
        run: |
          test -s catalog.json
          test -s authors.json
          test -s categories.json
          python -m json.tool catalog.json > /dev/null
          python -m json.tool authors.json > /dev/null
          python -m json.tool categories.json > /dev/null

      - name: Commit canonical source files and generated catalogs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- apps authors categories catalog.json authors.json categories.json sources
          if [ -d reports ]; then
            git add -A -- reports
          fi

          if git diff --cached --quiet; then
            echo "No canonical source or generated catalog changes detected."
            exit 0
          fi

          git commit -m "Rebuild VitaHub canonical catalog sources"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then
                echo "Catalog publication succeeded on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::git push rejected after 5 attempts"
              git status --short
              exit 1
            fi

            echo "Remote main advanced; retrying publish (attempt $attempt)."
            sleep 5
          done
