name: Validate and Generate VitaHub Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize catalog generation/publication. This prevents concurrent runs from
# creating the same new app/author file and then colliding during rebase.
concurrency:
  group: vitahub-catalog-publisher
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Decide catalog mode
        id: mode
        shell: bash
        run: |
          if [ -f sources/rebuild_once.json ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "VITAHUB_REBUILD_FROM_EXTERNAL=true" >> "$GITHUB_ENV"
            echo "External rebuild requested."
            rm -f sources/rebuild_once.json
          elif VITAHUB_SKIP_REMOTE_CHECKS=true python scripts/validate_catalog_ci.py; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "VITAHUB_REBUILD_FROM_EXTERNAL=false" >> "$GITHUB_ENV"
            echo "Existing source catalog is structurally valid; using incremental mode."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "VITAHUB_REBUILD_FROM_EXTERNAL=true" >> "$GITHUB_ENV"
            echo "Existing source catalog is structurally invalid; falling back to external rebuild."
          fi

      - name: Run external aggregation smoke test
        run: python scripts/external_smoke_test.py

      - name: Generate merged VitaHub catalogs and canonical source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITAHUB_REBUILD_FROM_EXTERNAL: ${{ steps.mode.outputs.rebuild }}
        run: python scripts/generate_catalog.py

      - name: Normalize persisted canonical source files
        run: python scripts/normalize_persisted_sources.py

      - name: Split compound external authors into individual profiles
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from scripts.external.identity import canonical_author_id

          root = Path('.')
          authors_dir = root / 'authors'
          apps_dir = root / 'apps'
          fallback = 'https://raw.githubusercontent.com/VegettoSan/PSVitaAlive/main/authors/icon/autoricon.png'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def split_names(value):
              if not isinstance(value, str):
                  return []
              text = re.sub(r'\s+', ' ', value.replace('\u00a0', ' ')).strip()
              if not text:
                  return []
              # VitaDB-family feeds commonly use &, comma, + or "and" as
              # separators when several developers are stored in one field.
              text = re.sub(r'\s*&\s*', ',', text)
              text = re.sub(r'\s+\band\b\s+', ',', text, flags=re.I)
              text = re.sub(r'\s*\+\s*', ',', text)
              parts = [p.strip(' \t,;|') for p in text.split(',')]
              result, seen = [], set()
              for part in parts:
                  if not part:
                      continue
                  aid = canonical_author_id(part)
                  if aid and aid not in seen:
                      seen.add(aid)
                      result.append((aid, part))
              return result

          authors = {}
          for path in sorted(authors_dir.glob('*.json')):
              try:
                  author = load(path)
              except Exception:
                  continue
              if author.get('id'):
                  authors[author['id']] = author

          changed_apps = 0
          created_authors = 0
          split_groups = 0

          for path in sorted(apps_dir.glob('*.json')):
              try:
                  app = load(path)
              except Exception:
                  continue

              raw_ids = app.get('author_ids')
              if not isinstance(raw_ids, list):
                  raw_ids = [app.get('author_id')] if app.get('author_id') else []

              new_ids = []
              for raw_id in raw_ids:
                  if not isinstance(raw_id, str) or not raw_id.strip():
                      continue
                  raw_id = raw_id.strip()
                  profile = authors.get(raw_id)
                  display_name = profile.get('name', raw_id) if profile else raw_id
                  names = split_names(display_name)

                  if len(names) <= 1:
                      aid = names[0][0] if names else raw_id
                      if aid not in new_ids:
                          new_ids.append(aid)
                      continue

                  split_groups += 1
                  for aid, name in names:
                      if aid not in authors:
                          authors[aid] = {
                              'id': aid,
                              'name': name,
                              'avatar': '',
                              'bio': '',
                              'links': [],
                              'icon': fallback,
                          }
                          created_authors += 1
                      if aid not in new_ids:
                          new_ids.append(aid)

              if new_ids and (app.get('author_ids') != new_ids or 'author_id' in app):
                  app['author_ids'] = new_ids
                  app.pop('author_id', None)
                  save(path, app)
                  changed_apps += 1

          for aid, author in sorted(authors.items()):
              path = authors_dir / f'{aid}.json'
              if not path.exists():
                  save(path, author)

          # Rebuild generated registries from the now-canonical individual app
          # and author files. catalog.json remains generated, never hand-edited.
          apps = []
          for path in sorted(apps_dir.glob('*.json')):
              try:
                  apps.append(load(path))
              except Exception:
                  continue
          apps.sort(key=lambda a: (str(a.get('version_date') or ''), str(a.get('updated_at') or '')), reverse=True)

          referenced = {aid for app in apps for aid in app.get('author_ids', []) if isinstance(aid, str)}
          published = [authors[aid] for aid in sorted(referenced) if aid in authors]
          published.sort(key=lambda a: str(a.get('name', a.get('id', ''))).lower())

          save(root / 'catalog.json', apps)
          save(root / 'authors.json', published)

          print(f'Compound author groups split: {split_groups}')
          print(f'Application JSON files changed: {changed_apps}')
          print(f'Individual author profiles created: {created_authors}')
          print(f'Authors published after split: {len(published)}')
          PY

      - name: Ensure missing author profiles and remove orphans from registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          authors_dir = root / 'authors'
          fallback = 'https://raw.githubusercontent.com/VegettoSan/PSVitaAlive/main/authors/icon/autoricon.png'

          referenced = set()
          for path in sorted((root / 'apps').glob('*.json')):
              try:
                  app = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              ids = app.get('author_ids', [])
              if isinstance(ids, list):
                  referenced.update(x for x in ids if isinstance(x, str) and x.strip())

          authors_by_id = {}
          for path in sorted(authors_dir.glob('*.json')):
              try:
                  author = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              aid = author.get('id')
              if aid:
                  authors_by_id[aid] = author

          missing = sorted(referenced - set(authors_by_id))
          created = 0
          for aid in missing:
              # Derive a readable display name from the slug when possible.
              display = aid.replace('-', ' ').replace('_', ' ').strip() or aid
              profile = {
                  'id': aid,
                  'name': display,
                  'avatar': fallback,
                  'bio': '',
                  'links': [],
                  'icon': fallback,
              }
              path = authors_dir / f'{aid}.json'
              path.write_text(
                  json.dumps(profile, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              authors_by_id[aid] = profile
              created += 1

          authors = [authors_by_id[aid] for aid in sorted(referenced) if aid in authors_by_id]
          authors.sort(key=lambda a: str(a.get('name', a.get('id', ''))).lower())
          (root / 'authors.json').write_text(
              json.dumps(authors, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          total_profiles = len(list(authors_dir.glob('*.json')))
          print(f'Referenced authors: {len(referenced)}')
          print(f'Missing author profiles ensured (auto-created): {created}')
          if created:
            print('Auto-created missing author profiles: ' + ', '.join(missing))
          print(f'Authors published: {len(authors)}')
          print(f'Orphan profiles excluded from authors.json: {max(0, total_profiles - len(authors))}')
          PY

      - name: Validate VitaHub source catalog
        run: python scripts/validate_catalog_ci.py

      - name: Verify generated catalogs
        run: |
          test -s catalog.json
          test -s authors.json
          test -s categories.json
          python -m json.tool catalog.json > /dev/null
          python -m json.tool authors.json > /dev/null
          python -m json.tool categories.json > /dev/null

      - name: Commit canonical source files and generated catalogs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- apps authors categories catalog.json authors.json categories.json sources
          if [ -d reports ]; then
            git add -A -- reports
          fi

          if git diff --cached --quiet; then
            echo "No canonical source or generated catalog changes detected."
            exit 0
          fi

          git commit -m "Rebuild VitaHub canonical catalog sources"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then
                echo "Catalog publication succeeded on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::git push rejected after 5 attempts"
              git status --short
              exit 1
            fi

            echo "Remote main advanced; retrying publish (attempt $attempt)."
            sleep 5
          done
