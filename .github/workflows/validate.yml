name: Validate and Generate VitaHub Catalog

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "authors/**"
      - "categories/**"
      - "catalog_overrides/**"
      - "external_authors/**"
      - "sources/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-generation
  cancel-in-progress: false

jobs:
  validate-json:
    name: Validate and Generate VitaHub Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate historical IDs
        run: python scripts/validate_registry.py

      - name: Prepare one-time clean external rebuild
        id: rebuild
        shell: bash
        run: |
          if [ -f sources/rebuild_once.json ]; then
            echo "VITAHUB_REBUILD_FROM_EXTERNAL=true" >> "$GITHUB_ENV"
            echo "Clean external rebuild requested. Existing apps/*.json will not be used as merge input."
            rm -f sources/rebuild_once.json
          else
            echo "VITAHUB_REBUILD_FROM_EXTERNAL=false" >> "$GITHUB_ENV"
            echo "Normal incremental catalog generation."
          fi

      - name: Validate VitaHub source catalog before incremental generation
        if: env.VITAHUB_REBUILD_FROM_EXTERNAL != 'true'
        run: python scripts/validate_catalog_ci.py

      - name: Run external aggregation smoke test
        run: python scripts/external_smoke_test.py

      - name: Generate merged VitaHub catalogs and canonical source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_catalog.py

      - name: Validate rebuilt VitaHub source catalog
        run: python scripts/validate_catalog_ci.py

      - name: Verify generated catalogs
        run: |
          test -f catalog.json
          test -f authors.json
          test -f categories.json
          python -m json.tool catalog.json > /dev/null
          python -m json.tool authors.json > /dev/null
          python -m json.tool categories.json > /dev/null

          echo "Generated catalogs:"
          ls -lh catalog.json authors.json categories.json

          echo "Canonical source counts:"
          find apps -maxdepth 1 -name '*.json' | wc -l
          find authors -maxdepth 1 -name '*.json' | wc -l

      - name: Commit canonical source files and generated catalogs
        if: github.event_name != 'pull_request'
        run: |
          git add apps/*.json authors/*.json catalog.json authors.json categories.json
          if [ -f reports/external_conflicts.json ]; then
            git add reports/external_conflicts.json
          fi

          if git diff --cached --quiet; then
            echo "No canonical source or generated catalog changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Rebuild VitaHub canonical catalog sources"

          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::git push rejected after 5 attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort
              git reset --soft origin/main
              git diff --cached --quiet || git commit -m "Rebuild VitaHub canonical catalog sources"
            }
          done
