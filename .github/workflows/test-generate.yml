name: Test Generate VitaHub Catalog

on:
  workflow_dispatch:

jobs:
  generate-test:
    name: Test VitaHub catalog generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate catalogs
        run: python scripts/generate_catalog.py

      - name: Verify generated catalogs
        run: |
          test -f catalog.json
          test -f authors.json
          test -f categories.json

          echo "Generated catalogs:"
          ls -lh catalog.json authors.json categories.json

      - name: Validate generated JSON
        run: |
          python -m json.tool catalog.json > /dev/null
          python -m json.tool authors.json > /dev/null
          python -m json.tool categories.json > /dev/null

          echo "All generated catalogs contain valid JSON."