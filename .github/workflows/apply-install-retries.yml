name: Apply install extract retries
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 scripts/apply_install_retries.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add "Client PSVitaAlive/source/installer/install_controller.cpp"
          git status
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "installer: retry ZIP/VPK extract-install up to 5 times with UI + logs"
            git push origin HEAD:main
          fi
