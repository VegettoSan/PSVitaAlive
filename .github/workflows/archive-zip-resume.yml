name: Resume pending ZIP VPK publications

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Archive.org owned VPK backups (BATCH)']
    types: [completed]

permissions:
  contents: write

jobs:
  resume:
    if: >-
      github.repository == 'VegettoSan/PSVitaAlive' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'VegettoSan') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'VegettoSan/PSVitaAlive'))
    concurrency:
      group: vitahub-catalog-publisher
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check for pending ZIP checkpoints
        id: pending
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/archive_zip_publication_jobs.json')
          jobs = json.loads(path.read_text())['jobs'] if path.exists() else {}
          pending = any(j.get('status') != 'PUBLISHED_VERIFIED' for j in jobs.values())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('pending=' + str(pending).lower() + '\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.pending.outputs.pending == 'true'
        with:
          python-version: '3.11'
      - name: Install pinned dependencies and test
        if: steps.pending.outputs.pending == 'true'
        run: |
          python -m pip install 'internetarchive==5.13.0' 'requests==2.32.5' 'Pillow==12.1.1'
          python -m unittest discover -s tests -p 'test_archive_zip_publication.py' -v
          python -m unittest discover -s tests -p 'test_discord_notifications.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Reconcile verified pending ZIP files
        if: steps.pending.outputs.pending == 'true'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_EXPECTED_UPLOADER: ${{ secrets.IA_EXPECTED_UPLOADER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSVA_FAST_CATALOG_PUBLICATION: "true"
          DISCORD_NEW_HOMEBREW_WEBHOOK_URL: ${{ secrets.DISCORD_NEW_HOMEBREW_WEBHOOK_URL }}
          DISCORD_HOMEBREW_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_HOMEBREW_UPDATES_WEBHOOK_URL }}
        run: python -m scripts.archive_zip_publication --execute --resume-only
      - name: Save reconciliation report
        if: always() && steps.pending.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zip-resume-report
          path: archive-batch-report/zip-publication.json
          if-no-files-found: ignore
          retention-days: 14
