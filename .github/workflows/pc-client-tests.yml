name: Test PC Catalog Client

on:
  pull_request:
    branches: [main]
    paths:
      - "local_client/**"
      - "tests/test_pc_client.py"
      - "scripts/catalog_schema_v2.py"
      - ".github/workflows/pc-client-tests.yml"
  push:
    branches: [main]
    paths:
      - "local_client/**"
      - "tests/test_pc_client.py"
      - "scripts/catalog_schema_v2.py"
      - ".github/workflows/pc-client-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc-client:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries for headless tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon0
      - name: Install desktop dependencies
        run: python -m pip install -r local_client/requirements.txt
      - name: Compile Python sources
        run: python -m py_compile local_client/*.py
      - name: Run offline desktop client tests
        run: python -m unittest discover -s tests -p "test_pc_client.py" -v
