name: Temporary repair PKG BGDL flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: temporary repair PKG BGDL flow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore safe synchronous PKG BGDL flow with one-frame UI handoff
        shell: python
        run: |
          from pathlib import Path
          import sys

          root = Path('.')
          cpp = root / 'Client PSVitaAlive/source/installer/install_controller.cpp'
          hpp = root / 'Client PSVitaAlive/include/installer/install_controller.hpp'

          c = cpp.read_text(encoding='utf-8')
          h = hpp.read_text(encoding='utf-8')

          old_request = '''    // Licensed Vita PKG path (NoPayStation): system BGDL + RIF.\n    // Completely separate from HomebrewInstaller VPK promote.\n    const bool pkgInstall = BgdlClient::looksLikePkgUrl(url, fileName);\n    // PKG installs: prefer system BGDL (PKGj path). Always (re)try init with full logs.\n    if (pkgInstall &&\n        (settings_.installMethod == InstallMethod::Auto ||\n         settings_.installMethod == InstallMethod::Bgdl ||\n         settings_.installMethod == InstallMethod::Direct)) {\n        diagnostics::log(std::string("[Installer] PKG install method=") +\n                         AppSettings::toString(settings_.installMethod) +\n                         " — probing BGDL");\n        const bool bgdlReady = BgdlClient::instance().init();\n        diagnostics::log(std::string("[Installer] BGDL probe result=") +\n            (bgdlReady ? "available" : "unavailable"));\n    }\n\n    // Prefer BGDL for PKG whenever it is available (even if user selected Direct),\n    // because retail PKG cannot be promoted as a raw file.\n    const bool wantBgdl =\n        pkgInstall && BgdlClient::instance().available() &&\n        (settings_.installMethod == InstallMethod::Bgdl ||\n         settings_.installMethod == InstallMethod::Auto ||\n         settings_.installMethod == InstallMethod::Direct);\n\n    if (wantBgdl && pkgInstall) {\n        // Show progress UI immediately; do heavy work on the install worker so the\n        // main thread keeps rendering (zRIF index + ShellSvc can take seconds).\n        setFileName(niceTitle.c_str());\n        setStage("BGDL");\n        setInstallPath("");\n        setTitleId("");\n        liveAreaOk_.store(false);\n        current_.store(0);\n        total_.store(0);\n        speed_.store(0);\n        setState(InstallStatus::State::Downloading,\n                 "Preparing license and queuing system download...");\n\n        activeBgdlJob_ = true;\n        activeBgdlUrl_ = url;\n        activeBgdlTitle_ = niceTitle;\n        activeBgdlLinkType_ = linkType;\n        activeZrif_ = zrif;\n        activeContentId_ = contentId;\n        activeJobId_.clear();\n        activeZipDestination_.clear();\n        activeFileName_ = niceTitle;\n        workerDone_.store(false);\n\n        workerThread_ = sceKernelCreateThread("PSVitaAliveInstall", &InstallController::workerEntry,\n            0x10000100, 64 * 1024, 0, 0, nullptr);\n        if (workerThread_ < 0) {\n            activeBgdlJob_ = false;\n            setState(InstallStatus::State::Failed, "Could not create worker thread");\n            resultShownAtMs_.store(sceKernelGetSystemTimeWide() / 1000ULL);\n            workerDone_.store(true);\n            return false;\n        }\n\n        InstallController* self = this;\n        const int result = sceKernelStartThread(workerThread_, sizeof(self), &self);\n        if (result < 0) {\n            activeBgdlJob_ = false;\n            sceKernelDeleteThread(workerThread_);\n            workerThread_ = -1;\n            setState(InstallStatus::State::Failed, "Could not start worker thread");\n            resultShownAtMs_.store(sceKernelGetSystemTimeWide() / 1000ULL);\n            workerDone_.store(true);\n            return false;\n        }\n        diagnostics::log(std::string("[Installer] PKG BGDL job started (async) title=") + niceTitle);\n        return true;\n    } else if (settings_.installMethod == InstallMethod::Bgdl) {\n        diagnostics::log("[Installer] BGDL selected but file is not PKG - using direct path");\n    }\n'''

          new_request = '''    // Licensed Vita PKG path (NoPayStation): system BGDL + RIF.\n    // Completely separate from HomebrewInstaller VPK promote.\n    const bool pkgInstall = BgdlClient::looksLikePkgUrl(url, fileName);\n\n    // Give the UI one frame to render the preparation panel before entering the\n    // reverse-engineered SceShellSvc/BGDL path. The actual BGDL work remains on\n    // the main thread, matching the previously working execution context.\n    const bool wantBgdl =\n        pkgInstall &&\n        (settings_.installMethod == InstallMethod::Bgdl ||\n         settings_.installMethod == InstallMethod::Auto ||\n         settings_.installMethod == InstallMethod::Direct);\n\n    if (wantBgdl && pkgInstall) {\n        setFileName(niceTitle.c_str());\n        setStage("BGDL");\n        setInstallPath("");\n        setTitleId("");\n        liveAreaOk_.store(false);\n        current_.store(0);\n        total_.store(0);\n        speed_.store(0);\n        resultShownAtMs_.store(0);\n        setState(InstallStatus::State::Downloading,\n                 "Preparing license and queuing system download...");\n\n        activeBgdlJob_ = true;\n        activeBgdlUrl_ = url;\n        activeBgdlTitle_ = niceTitle;\n        activeBgdlLinkType_ = linkType;\n        activeZrif_ = zrif;\n        activeContentId_ = contentId;\n        activeJobId_.clear();\n        activeZipDestination_.clear();\n        activeFileName_ = niceTitle;\n\n        diagnostics::log(std::string("[Installer] PKG BGDL deferred to next UI cycle title=") + niceTitle);\n        return true;\n    } else if (settings_.installMethod == InstallMethod::Bgdl) {\n        diagnostics::log("[Installer] BGDL selected but file is not PKG - using direct path");\n    }\n'''

          if old_request not in c:
              print('ERROR: async requestInstall block not found', file=sys.stderr)
              sys.exit(1)
          c = c.replace(old_request, new_request, 1)

          old_status = '''InstallStatus InstallController::status() const {\n    // Auto-dismiss long-lived result panels so the UI does not stick forever.\n    const_cast<InstallController*>(this)->maybeAutoAcknowledgeResult();\n'''
          new_status = '''InstallStatus InstallController::status() const {\n    // Process a PKG/BGDL request after the frame that displayed the preparation UI.\n    if (activeBgdlJob_) {\n        const_cast<InstallController*>(this)->processPendingBgdl();\n    }\n\n    // Auto-dismiss long-lived result panels so the UI does not stick forever.\n    const_cast<InstallController*>(this)->maybeAutoAcknowledgeResult();\n'''
          if old_status not in c:
              print('ERROR: status() anchor not found', file=sys.stderr)
              sys.exit(1)
          c = c.replace(old_status, new_status, 1)

          marker = 'void InstallController::maybeAutoAcknowledgeResult() {'
          process_fn = r'''void InstallController::processPendingBgdl() {
    if (!activeBgdlJob_) return;

    activeBgdlJob_ = false;
    const std::string title = activeBgdlTitle_;
    const std::string url = activeBgdlUrl_;
    const std::string linkType = activeBgdlLinkType_;
    const std::string zrif = activeZrif_;
    const std::string contentId = activeContentId_;

    setMessage("Preparing license...");
    if (!BgdlClient::instance().available() && !BgdlClient::instance().init()) {
        setState(InstallStatus::State::Failed,
                 "BGDL unavailable on this device. Try again or check plugins.");
        resultShownAtMs_.store(sceKernelGetSystemTimeWide() / 1000ULL);
        diagnostics::log("[Installer] PKG BGDL failed: BGDL unavailable");
        return;
    }

    setMessage("Queuing system download...");
    PkgBgdlRequest preq;
    preq.title = title;
    preq.url = url;
    preq.zrif = zrif;
    preq.contentId = contentId;
    preq.type = PkgBgdlInstaller::typeFromLinkType(linkType);
    if (preq.zrif.empty() && !preq.contentId.empty() &&
        (preq.type == BgdlTaskType::Game || preq.type == BgdlTaskType::Psp)) {
        if (preq.contentId.find("-NPU") != std::string::npos ||
            preq.contentId.find("-ULES") != std::string::npos ||
            preq.contentId.find("-ULUS") != std::string::npos ||
            preq.contentId.find("-UCUS") != std::string::npos ||
            preq.contentId.find("-NPE") != std::string::npos ||
            preq.contentId.find("-NPJ") != std::string::npos ||
            preq.contentId.find("-NPH") != std::string::npos ||
            linkType.find("PSP") != std::string::npos ||
            linkType.find("PS1") != std::string::npos ||
            linkType.find("PSX") != std::string::npos) {
            preq.type = BgdlTaskType::Psp;
        }
    }

    diagnostics::log(std::string("[Installer] PKG via PkgBgdlInstaller type=") +
                     std::to_string(static_cast<int>(preq.type)) +
                     " zrif=" + (zrif.empty() ? "no" : "yes"));

    const PkgBgdlResult bg = PkgBgdlInstaller::enqueue(preq);
    if (bg.ok) {
        setFileName(title.c_str());
        setStage("BGDL");
        setInstallPath("");
        setTitleId("");
        liveAreaOk_.store(false);
        char msg[384];
        sceClibSnprintf(msg, sizeof(msg),
            "Queued: %s — open LiveArea notifications to watch download/install.",
            title.c_str());
        setState(InstallStatus::State::Completed, msg);
        resultShownAtMs_.store(sceKernelGetSystemTimeWide() / 1000ULL);
        diagnostics::log(std::string("[Installer] PKG BGDL queued id=") + std::to_string(bg.bgdlId) +
                         " title=" + title);
    } else {
        const char* failMsg = bg.message.empty()
            ? "PKG license (zRIF) missing or BGDL queue failed"
            : bg.message.c_str();
        setState(InstallStatus::State::Failed, failMsg);
        resultShownAtMs_.store(sceKernelGetSystemTimeWide() / 1000ULL);
        diagnostics::log(std::string("[Installer] PKG BGDL failed: ") + failMsg);
    }
}

'''
          if marker not in c:
              print('ERROR: maybeAutoAcknowledgeResult marker not found', file=sys.stderr)
              sys.exit(1)
          c = c.replace(marker, process_fn + marker, 1)

          header_anchor = '    std::string activeContentId_;\n'
          header_insert = '''    std::string activeContentId_;\n    // PKG/BGDL request waiting for the next UI/status cycle (runs on main thread).\n'''
          if header_anchor not in h:
              print('ERROR: header field anchor not found', file=sys.stderr)
              sys.exit(1)
          h = h.replace(header_anchor, header_insert, 1)

          hpp_marker = '    void maybeAutoAcknowledgeResult();\n'
          hpp_new = '    void processPendingBgdl();\n    void maybeAutoAcknowledgeResult();\n'
          if hpp_marker not in h:
              print('ERROR: header method anchor not found', file=sys.stderr)
              sys.exit(1)
          h = h.replace(hpp_marker, hpp_new, 1)

          cpp.write_text(c, encoding='utf-8')
          hpp.write_text(h, encoding='utf-8')
          print('Patched installer safely')

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/_temporary_fix_pkg_bgdl.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Client PSVitaAlive/source/installer/install_controller.cpp" "Client PSVitaAlive/include/installer/install_controller.hpp" .github/workflows/_temporary_fix_pkg_bgdl.yml
          git diff --cached --check
          git commit -m "fix(client): restore safe synchronous PKG BGDL flow"
          git push origin main
