name: Generate full Game Files route report (research branch)
on:
  push:
    branches:
      - audit/game-files-zip-roots-20261105
    paths:
      - .github/workflows/audit-game-files-zip-roots.yml
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Game Files paths
        run: python3 scripts/validate_installed_paths_audit.py
      - name: Generate table from canonical apps JSON
        run: python3 scripts/report_game_files_paths.py
      - name: Commit report into research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GAME_FILES_ROUTES_20261105.md
          git diff --cached --quiet || (git commit -m "docs: publish complete Game Files route table [skip ci]" && git push)
