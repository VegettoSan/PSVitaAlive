name: Validate Game Files catalog roots (research branch)
on:
  workflow_dispatch:
  push:
    branches:
      - audit/game-files-zip-roots-20261105
    paths:
      - .github/workflows/audit-game-files-zip-roots.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate audited installed paths, all source JSON and app installation roots
        run: python3 scripts/validate_installed_paths_audit.py
      - name: Validate archived audit JSON format
        run: python3 -m json.tool docs/audits/game_files_zip_roots_20261105.json > /dev/null
