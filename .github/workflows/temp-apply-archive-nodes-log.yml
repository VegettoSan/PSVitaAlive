name: Temporary apply Archive node diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'scripts/temp_fix_archive_runner.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temp_fix_archive_runner.py
          python3 scripts/temp_apply_archive_nodes_log.py
          git diff --check
          grep -q 'archiveNodeLog' 'Client PSVitaAlive/source/network/http_client.cpp'
          grep -q 'archive_nodes.log' 'Client PSVitaAlive/source/diagnostic_logger.cpp'
          git rm -f scripts/temp_fix_archive_runner.py scripts/temp_apply_archive_nodes_log.py .github/workflows/temp-apply-archive-nodes-log.yml
          git config user.name 'VegettoSanDev'
          git config user.email '72358120+VegettoSan@users.noreply.github.com'
          git add 'Client PSVitaAlive/include/diagnostic_logger.hpp' \
                  'Client PSVitaAlive/source/diagnostic_logger.cpp' \
                  'Client PSVitaAlive/source/network/http_client.cpp' \
                  'Client PSVitaAlive/README.md' \
                  'docs/NETWORK_TLS.md'
          git commit -m 'feat: add detailed Internet Archive node diagnostics log'
          git push origin HEAD:main
