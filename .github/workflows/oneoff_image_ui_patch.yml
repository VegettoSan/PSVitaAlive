name: One-off image UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ------------------------------------------------------------------
          # ImageCache public API
          # ------------------------------------------------------------------
          replace_once(
              'Client PSVitaAlive/include/ui/image_cache.hpp',
              '    bool isReady(const std::string& localPath) const;\n    bool isFailed(const std::string& localPath) const;\n\n    // Discard queued requests that have not started yet. Kept as an explicit\n    // API for callers that intentionally want to cancel work.\n    void cancelQueuedRequests();',
              '    bool isReady(const std::string& localPath) const;\n    bool isFailed(const std::string& localPath) const;\n    bool isCached(const std::string& url, const std::string& namespaceName) const;\n\n    struct ProgressSnapshot {\n        bool active = false;\n        uint64_t downloaded = 0;\n        uint64_t total = 0;\n        uint64_t speed = 0;\n        uint64_t completedBytes = 0;\n        uint64_t knownTotalBytes = 0;\n        std::string fileName;\n    };\n\n    ProgressSnapshot progress() const;\n    void resetProgress();\n\n    // Cancel queued and active image work. The active partial file is removed\n    // by the worker after libcurl acknowledges the cancellation.\n    void cancelAll();\n    void cancelQueuedRequests();'
          )

          replace_once(
              'Client PSVitaAlive/include/ui/image_cache.hpp',
              '    volatile bool stopping_ = false;\n    std::vector<Job> queue_;',
              '    volatile bool stopping_ = false;\n    volatile bool cancelRequested_ = false;\n    std::vector<Job> queue_;'
          )
          replace_once(
              'Client PSVitaAlive/include/ui/image_cache.hpp',
              '    std::unordered_map<std::string, uint64_t> retryAfter_;',
              '    std::unordered_map<std::string, uint64_t> retryAfter_;\n    std::string currentFile_;\n    std::string currentPath_;\n    uint64_t currentDownloaded_ = 0;\n    uint64_t currentTotal_ = 0;\n    uint64_t currentSpeed_ = 0;\n    uint64_t completedBytes_ = 0;\n    uint64_t completedTotalBytes_ = 0;'
          )

          # ------------------------------------------------------------------
          # ImageCache implementation: cache detection, progress and cancel
          # ------------------------------------------------------------------
          replace_once(
              'Client PSVitaAlive/source/ui/image_cache.cpp',
              'void ImageCache::shutdown(){stopping_=true;if(workerThread_>=0){sceKernelWaitThreadEnd(workerThread_,nullptr,nullptr);sceKernelDeleteThread(workerThread_);workerThread_=-1;}if(mutex_>=0){sceKernelDeleteMutex(mutex_);mutex_=-1;}queue_.clear();pending_.clear();ready_.clear();failed_.clear();retryAfter_.clear();diagnostics::log("[ImageCache] shutdown");}',
              'void ImageCache::shutdown(){stopping_=true;cancelRequested_=true;if(workerThread_>=0){sceKernelWaitThreadEnd(workerThread_,nullptr,nullptr);sceKernelDeleteThread(workerThread_);workerThread_=-1;}if(mutex_>=0){sceKernelDeleteMutex(mutex_);mutex_=-1;}queue_.clear();pending_.clear();ready_.clear();failed_.clear();retryAfter_.clear();currentFile_.clear();currentPath_.clear();currentDownloaded_=0;currentTotal_=0;currentSpeed_=0;diagnostics::log("[ImageCache] shutdown");}'
          )
          replace_once(
              'Client PSVitaAlive/source/ui/image_cache.cpp',
              'bool ImageCache::isFailed(const std::string&p)const{if(mutex_<0||p.empty())return false;sceKernelLockMutex(mutex_,1,nullptr);bool r=contains(failed_,p);sceKernelUnlockMutex(mutex_,1);return r;}\nvoid ImageCache::cancelQueuedRequests(){',
              'bool ImageCache::isFailed(const std::string&p)const{if(mutex_<0||p.empty())return false;sceKernelLockMutex(mutex_,1,nullptr);bool r=contains(failed_,p);sceKernelUnlockMutex(mutex_,1);return r;}\nbool ImageCache::isCached(const std::string&url,const std::string&ns)const{if(mutex_<0||url.empty())return false;const std::string path=makePath(normalizeUrl(url),ns);SceIoStat st={};return sceIoGetstat(path.c_str(),&st)>=0&&st.st_size>0;}\nImageCache::ProgressSnapshot ImageCache::progress()const{ProgressSnapshot s;if(mutex_<0)return s;sceKernelLockMutex(mutex_,1,nullptr);s.active=!currentPath_.empty();s.downloaded=currentDownloaded_;s.total=currentTotal_;s.speed=currentSpeed_;s.completedBytes=completedBytes_;s.knownTotalBytes=completedTotalBytes_;if(s.active&&s.total>0)s.knownTotalBytes+=s.total;s.fileName=currentFile_;sceKernelUnlockMutex(mutex_,1);return s;}\nvoid ImageCache::resetProgress(){if(mutex_<0)return;sceKernelLockMutex(mutex_,1,nullptr);completedBytes_=0;completedTotalBytes_=0;currentDownloaded_=0;currentTotal_=0;currentSpeed_=0;currentFile_.clear();currentPath_.clear();sceKernelUnlockMutex(mutex_,1);}\nvoid ImageCache::cancelAll(){if(mutex_<0)return;sceKernelLockMutex(mutex_,1,nullptr);const bool active=!currentPath_.empty();const size_t queued=queue_.size();for(const Job&j:queue_)pending_.erase(std::remove(pending_.begin(),pending_.end(),j.path),pending_.end());queue_.clear();cancelRequested_=active;sceKernelUnlockMutex(mutex_,1);if(queued||active)diagnostics::log("[ImageCache] cancel requested for startup image work");}\nvoid ImageCache::cancelQueuedRequests(){'
          )

          replace_once(
              'Client PSVitaAlive/source/ui/image_cache.cpp',
              'int ImageCache::workerMain(){HttpClient http;if(http.init()!=HttpResult::Ok){diagnostics::log("[ImageCache] HTTP initialization failed");return-1;}while(!stopping_){Job job;bool have=false;sceKernelLockMutex(mutex_,1,nullptr);if(!queue_.empty()){job=queue_.front();queue_.erase(queue_.begin());have=true;}sceKernelUnlockMutex(mutex_,1);if(!have){sceKernelDelayThread(50*1000);continue;}HttpResult r=http.downloadToFile(job.url,job.path);bool valid=false;if(r==HttpResult::Ok){SceIoStat st={};valid=sceIoGetstat(job.path.c_str(),&st)>=0&&st.st_size>0;}if(valid)valid=normalizeImageForVita(job.path);if(valid){markReady(job.path);char m[900];sceClibSnprintf(m,sizeof(m),"[ImageCache] ready url=%s path=%s attempt=%d",job.url.c_str(),job.path.c_str(),job.attempt+1);diagnostics::log(m);}else{sceIoRemove(job.path.c_str());char m[1000];sceClibSnprintf(m,sizeof(m),"[ImageCache] failed url=%s path=%s attempt=%d http=%d error=%s",job.url.c_str(),job.path.c_str(),job.attempt+1,http.lastStatusCode(),http.lastError().c_str());diagnostics::log(m);if(job.attempt+1<MAX_RETRIES&&!stopping_){sceKernelDelayThread((job.attempt+1)*250*1000);job.attempt++;sceKernelLockMutex(mutex_,1,nullptr);queue_.push_back(job);sceKernelUnlockMutex(mutex_,1);}else markFailed(job.path);}}http.shutdown();return 0;}',
              'int ImageCache::workerMain(){HttpClient http;if(http.init()!=HttpResult::Ok){diagnostics::log("[ImageCache] HTTP initialization failed");return-1;}while(!stopping_){Job job;bool have=false;sceKernelLockMutex(mutex_,1,nullptr);if(!queue_.empty()){job=queue_.front();queue_.erase(queue_.begin());have=true;currentFile_=job.url.substr(job.url.find_last_of("/")+1);currentPath_=job.path;currentDownloaded_=0;currentTotal_=0;currentSpeed_=0;}sceKernelUnlockMutex(mutex_,1);if(!have){sceKernelDelayThread(50*1000);continue;}HttpProgressFn onProgress=[this](const HttpProgress&p){if(mutex_<0)return;sceKernelLockMutex(mutex_,1,nullptr);currentDownloaded_=p.downloaded;currentTotal_=p.total;currentSpeed_=p.bytesPerSecond;sceKernelUnlockMutex(mutex_,1);};HttpCancelFn shouldCancel=[this](){if(mutex_<0)return true;sceKernelLockMutex(mutex_,1,nullptr);const bool c=cancelRequested_||stopping_;sceKernelUnlockMutex(mutex_,1);return c;};HttpResult r=http.downloadToFile(job.url,job.path,0,onProgress,shouldCancel);sceKernelLockMutex(mutex_,1,nullptr);const bool cancelled=cancelRequested_||r==HttpResult::Cancelled;const uint64_t doneBytes=currentDownloaded_,doneTotal=currentTotal_;if(!cancelled&&r==HttpResult::Ok){completedBytes_+=doneBytes;if(doneTotal>0)completedTotalBytes_+=doneTotal;}currentFile_.clear();currentPath_.clear();currentDownloaded_=0;currentTotal_=0;currentSpeed_=0;cancelRequested_=false;sceKernelUnlockMutex(mutex_,1);if(cancelled){sceIoRemove(job.path.c_str());sceKernelLockMutex(mutex_,1,nullptr);pending_.erase(std::remove(pending_.begin(),pending_.end(),job.path),pending_.end());sceKernelUnlockMutex(mutex_,1);diagnostics::log(std::string("[ImageCache] cancelled url=")+job.url+" path="+job.path);continue;}bool valid=false;if(r==HttpResult::Ok){SceIoStat st={};valid=sceIoGetstat(job.path.c_str(),&st)>=0&&st.st_size>0;}if(valid)valid=normalizeImageForVita(job.path);if(valid){markReady(job.path);char m[900];sceClibSnprintf(m,sizeof(m),"[ImageCache] ready url=%s path=%s attempt=%d",job.url.c_str(),job.path.c_str(),job.attempt+1);diagnostics::log(m);}else{sceIoRemove(job.path.c_str());char m[1000];sceClibSnprintf(m,sizeof(m),"[ImageCache] failed url=%s path=%s attempt=%d http=%d error=%s",job.url.c_str(),job.path.c_str(),job.attempt+1,http.lastStatusCode(),http.lastError().c_str());diagnostics::log(m);if(job.attempt+1<MAX_RETRIES&&!stopping_){sceKernelDelayThread((job.attempt+1)*250*1000);job.attempt++;sceKernelLockMutex(mutex_,1,nullptr);queue_.push_back(job);sceKernelUnlockMutex(mutex_,1);}else markFailed(job.path);}}http.shutdown();return 0;}'
          )

          # ------------------------------------------------------------------
          # Main: only count pending images, custom startup prompt/download UI
          # ------------------------------------------------------------------
          main = Path('Client PSVitaAlive/source/main.cpp')
          text = main.read_text(encoding='utf-8')
          start = text.index('bool promptDownloadAllImages(size_t totalImages){')
          end = text.index('\nstd::string fileNameFromUrl', start)
          replacement = r'''bool promptDownloadAllImages(size_t totalImages){
    vita2d_wait_rendering_done();
    vita2d_pgf* font=vita2d_load_default_pgf();
    if(!font){psvitaalive::diagnostics::log("[Startup] custom image prompt font load failed; defaulting to on-demand mode");return false;}
    bool yes=false,done=false;int selected=0;uint32_t prev=0;
    while(!done){
        SceCtrlData pad={};sceCtrlPeekBufferPositive(0,&pad,1);
        const uint32_t pressed=pad.buttons&~prev;prev=pad.buttons;
        if(pressed&SCE_CTRL_LEFT)selected=0;
        if(pressed&SCE_CTRL_RIGHT)selected=1;
        if(pressed&SCE_CTRL_CROSS){yes=selected==0;done=true;}
        if(pressed&SCE_CTRL_CIRCLE){yes=false;done=true;}
        vita2d_start_drawing();vita2d_clear_screen();
        const unsigned SURFACE=RGBA8(0x37,0x37,0x37,255),BORDER=RGBA8(0x6E,0x6E,0x6E,255),TEXT=RGBA8(0xAA,0xAA,0xAA,255),ACCENT=RGBA8(0x3B,0xFF,0,255),WHITE=RGBA8(255,255,255,255),BLACK=RGBA8(0,0,0,255),PANEL=RGBA8(0x20,0x20,0x20,255);
        const int w=620,h=250,x=(960-w)/2,y=(544-h)/2;
        vita2d_draw_rectangle(x,y,w,h,PANEL);vita2d_draw_rectangle(x,y,w,2,ACCENT);
        vita2d_pgf_draw_text(font,x+28,y+32,ACCENT,.68f,"PSVitaAlive");
        vita2d_pgf_draw_text(font,x+28,y+68,WHITE,1.02f,"Download catalog images?");
        vita2d_pgf_draw_text(font,x+28,y+96,TEXT,.62f,"This can take a very long time and use network data.");
        char count[96]={};sceClibSnprintf(count,sizeof(count),"Pending images: %u",(unsigned)totalImages);
        vita2d_pgf_draw_text(font,x+28,y+120,ACCENT,.68f,count);
        vita2d_pgf_draw_text(font,x+28,y+146,DIM,.56f,"Already cached images are excluded.");
        const int by=y+166,bw=220,bh=42;
        vita2d_draw_rectangle(x+58,by,bw,bh,selected==0?ACCENT:SURFACE);vita2d_draw_rectangle(x+342,by,bw,bh,selected==1?ACCENT:SURFACE);
        vita2d_pgf_draw_text(font,x+146,by+27,selected==0?BLACK:WHITE,.70f,"YES");vita2d_pgf_draw_text(font,x+430,by+27,selected==1?BLACK:WHITE,.70f,"NO");
        vita2d_pgf_draw_text(font,x+28,y+234,TEXT,.52f,"Left/Right: Select    Cross: Confirm    Circle: No");
        vita2d_end_drawing();vita2d_swap_buffers();sceKernelDelayThread(16*1000);
    }
    vita2d_wait_rendering_done();vita2d_free_pgf(font);
    psvitaalive::diagnostics::log(std::string("[Startup] image warmup choice=")+(yes?"ALL":"ON_DEMAND"));return yes;
}
std::string formatBytes(uint64_t b){char o[64];double v=(double)b;if(b>=1024ULL*1024ULL*1024ULL)sceClibSnprintf(o,sizeof(o),"%.2f GB",v/(1024.0*1024.0*1024.0));else if(b>=1024ULL*1024ULL)sceClibSnprintf(o,sizeof(o),"%.2f MB",v/(1024.0*1024.0));else if(b>=1024ULL)sceClibSnprintf(o,sizeof(o),"%.2f KB",v/1024.0);else sceClibSnprintf(o,sizeof(o),"%llu B",(unsigned long long)b);return o;}
std::string twoLineFileName(const std::string&name){if(name.size()<=42)return name;if(name.size()<=84)return name.substr(0,42)+"\n"+name.substr(42);return name.substr(0,42)+"\n..."+name.substr(name.size()-38);}
bool runImageWarmup(std::vector<StartupImageJob>&jobs,psvitaalive::ui::ImageCache&images){
    if(jobs.empty())return true;
    images.cancelAll();
    while(images.progress().active)sceKernelDelayThread(10*1000);
    images.resetProgress();
    queueStartupImages(jobs,images);
    const uint64_t started=sceKernelGetSystemTimeWide();uint64_t lastPoll=0;bool cancelled=false;
    while(true){
        const uint64_t now=sceKernelGetSystemTimeWide();
        uint64_t completed=0;std::string currentFile;bool failedCurrent=false;imageWarmupProgress(jobs,images,completed,currentFile,failedCurrent);
        const auto p=images.progress();
        if(completed>=(uint64_t)jobs.size()&&!p.active)break;
        SceCtrlData pad={};sceCtrlPeekBufferPositive(0,&pad,1);if(pad.buttons&SCE_CTRL_CIRCLE){images.cancelAll();cancelled=true;}
        if(now<lastPoll){sceKernelDelayThread(16*1000);continue;}lastPoll=now+100000;
        vita2d_start_drawing();vita2d_clear_screen();
        const unsigned SURFACE=RGBA8(0x37,0x37,0x37,255),BORDER=RGBA8(0x6E,0x6E,0x6E,255),TEXT=RGBA8(0xAA,0xAA,0xAA,255),ACCENT=RGBA8(0x3B,0xFF,0,255),WHITE=RGBA8(255,255,255,255),BLACK=RGBA8(0,0,0,255),PANEL=RGBA8(0x20,0x20,0x20,255);
        const int w=620,h=320,x=(960-w)/2,y=(544-h)/2;
        vita2d_draw_rectangle(x,y,w,h,PANEL);vita2d_draw_rectangle(x,y,w,2,ACCENT);
        vita2d_pgf_draw_text(font_?nullptr:nullptr,0,0,0,0," ");
        vita2d_pgf_draw_text(nullptr,0,0,0,0," ");
        // The application UI font is owned by FullCatalogScreen, so load a local font for this modal.
        static vita2d_pgf* modalFont=nullptr;if(!modalFont)modalFont=vita2d_load_default_pgf();
        if(!modalFont){vita2d_end_drawing();vita2d_swap_buffers();return false;}
        vita2d_pgf_draw_text(modalFont,x+28,y+32,ACCENT,.68f,"PSVitaAlive");
        vita2d_pgf_draw_text(modalFont,x+28,y+68,WHITE,1.02f,"Downloading Images");
        std::string fn=twoLineFileName(p.fileName.empty()?currentFile:p.fileName);size_t nl=fn.find('\\n');if(nl==std::string::npos){vita2d_pgf_draw_text(modalFont,x+28,y+98,TEXT,.62f,fn.c_str());}else{vita2d_pgf_draw_text(modalFont,x+28,y+98,TEXT,.62f,fn.substr(0,nl).c_str());vita2d_pgf_draw_text(modalFont,x+28,y+120,TEXT,.62f,fn.substr(nl+1).c_str());}
        const uint64_t current=p.downloaded,total=p.total;const uint32_t pct=total?std::min<uint64_t>(100,(current*100)/total):0;
        int bx=x+28,by=y+140,bw=w-56,bh=12;vita2d_draw_rectangle(bx,by,bw,bh,BORDER);vita2d_draw_rectangle(bx,by,bw*(int)pct/100,bh,ACCENT);
        char stats[220]={};sceClibSnprintf(stats,sizeof(stats),"%u%%  %s / %s  •  %s/s",pct,formatBytes(current).c_str(),total?formatBytes(total).c_str():"?",formatBytes(p.speed).c_str());vita2d_pgf_draw_text(modalFont,x+28,y+168,TEXT,.58f,stats);
        char count[180]={};sceClibSnprintf(count,sizeof(count),"Files: %llu / %u",(unsigned long long)completed,(unsigned)jobs.size());vita2d_pgf_draw_text(modalFont,x+28,y+194,ACCENT,.62f,count);
        char known[220]={};sceClibSnprintf(known,sizeof(known),"Known size: %s",formatBytes(p.knownTotalBytes).c_str());vita2d_pgf_draw_text(modalFont,x+28,y+218,TEXT,.56f,known);
        uint64_t eta=0;if(completed>0&&jobs.size()>completed&&now>started){uint64_t elapsed=now-started;eta=(elapsed/1000000ULL)*(jobs.size()-completed)/completed;if(eta==0)eta=1;}char et[96]={};if(eta<60)sceClibSnprintf(et,sizeof(et),"ETA ~%llus",(unsigned long long)eta);else sceClibSnprintf(et,sizeof(et),"ETA ~%llum",(unsigned long long)(eta/60));vita2d_pgf_draw_text(modalFont,x+28,y+242,DIM,.54f,et);
        vita2d_draw_rectangle(x+w-170,y+h-50,130,34,cancelled?ACCENT:SURFACE);vita2d_pgf_draw_text(modalFont,x+w-148,y+h-27,cancelled?BLACK:WHITE,.60f,"CIRCLE: CANCEL");
        vita2d_end_drawing();vita2d_swap_buffers();sceKernelDelayThread(16*1000);
        if(cancelled&&!images.progress().active)break;
    }
    if(!images.progress().active){vita2d_wait_rendering_done();vita2d_pgf* f=vita2d_load_default_pgf();if(f){vita2d_free_pgf(f);}}
    return !cancelled;
}
'''
          text = text[:start] + replacement + text[end:]
          main.write_text(text, encoding='utf-8')

          # Pending-only startup list.
          replace_once(
              'Client PSVitaAlive/source/main.cpp',
              'void addStartupImage(std::vector<StartupImageJob>&jobs,std::unordered_set<std::string>&seen,psvitaalive::ui::ImageCache&images,const std::string&url,const std::string&namespaceName,bool queueNow){if(url.empty())return;const std::string key=namespaceName+"\\n"+url;if(!seen.insert(key).second)return;std::string path;if(queueNow)path=images.request(url,namespaceName);jobs.push_back({url,path,namespaceName,fileNameFromUrl(url,namespaceName+"_image")});}',
              'void addStartupImage(std::vector<StartupImageJob>&jobs,std::unordered_set<std::string>&seen,psvitaalive::ui::ImageCache&images,const std::string&url,const std::string&namespaceName,bool queueNow){if(url.empty()||images.isCached(url,namespaceName))return;const std::string key=namespaceName+"\\n"+url;if(!seen.insert(key).second)return;std::string path;if(queueNow)path=images.request(url,namespaceName);jobs.push_back({url,path,namespaceName,fileNameFromUrl(url,namespaceName+"_image")});}'
          )

          # Remove obsolete startup image state.
          replace_once(
              'Client PSVitaAlive/source/main.cpp',
              'int preloadIndex=0;bool startupCatalogs=true;bool startupImages=false;bool homebrewReady=false;bool startupImageChoicePending=false;',
              'int preloadIndex=0;bool startupCatalogs=true;bool homebrewReady=false;bool startupImageChoicePending=false;'
          )
          replace_once(
              'Client PSVitaAlive/source/main.cpp',
              'uint64_t lastImageProgressPoll=0,lastImageCompleted=0,startupImageStartTime=0;std::string lastImageFile;',
              ''
          )

          # Replace startup image choice block.
          start = text = main.read_text(encoding='utf-8')
          marker = '        if(startupImageChoicePending){'
          s = text.index(marker)
          e = text.index('\n        const psvitaalive::InstallStatus cur=', s)
          block = '''        if(startupImageChoicePending){
            startupImageChoicePending=false;
            if(startupImagesJobs.empty()){
                screen.setCatalogLoading(false,"",0,0,"All catalog images are already cached");
                psvitaalive::diagnostics::log("[Startup] no pending catalog images");
                if(homebrewReady){screen.setCatalogItems(startupCatalogItems[(int)psvitaalive::ui::CatalogType::Homebrew]);screen.setActiveCatalog(psvitaalive::ui::CatalogType::Homebrew);}
            }else if(promptDownloadAllImages(startupImagesJobs.size())){
                const bool completed=runImageWarmup(startupImagesJobs,images);
                screen.setCatalogLoading(false,"",completed?startupImagesJobs.size():0,(uint64_t)startupImagesJobs.size(),completed?"Image cache ready":"Image download cancelled");
                psvitaalive::diagnostics::log(std::string("[Startup] full image warmup finished result=")+(completed?"COMPLETE":"CANCELLED"));
                if(homebrewReady){screen.setCatalogItems(startupCatalogItems[(int)psvitaalive::ui::CatalogType::Homebrew]);screen.setActiveCatalog(psvitaalive::ui::CatalogType::Homebrew);}
            }else{
                screen.setCatalogLoading(false,"",0,0,"Images will download while browsing");
                startupImagesJobs.clear();startupImageSeen.clear();
                psvitaalive::diagnostics::log("[Startup] user selected on-demand image loading");
                if(homebrewReady){screen.setCatalogItems(startupCatalogItems[(int)psvitaalive::ui::CatalogType::Homebrew]);screen.setActiveCatalog(psvitaalive::ui::CatalogType::Homebrew);}
            }
        }
'''
          text = text[:s] + block + text[e:]
          main.write_text(text, encoding='utf-8')

          # The temporary workflow is deleted in the same commit it creates.
          Path('.github/workflows/oneoff_image_ui_patch.yml').unlink()
          PY

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: improve image startup download controls"
          git push origin HEAD:main
