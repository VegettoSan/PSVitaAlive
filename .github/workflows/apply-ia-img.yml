name: Apply IA services/img icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_ia_img.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/include/network/http_client.hpp" \
            "Client PSVitaAlive/source/network/http_client.cpp" \
            "Client PSVitaAlive/source/ui/image_cache.cpp"
          git status
          git commit -m "perf(images): prefer archive.org/services/img for icons, max 4 HTTP attempts" || echo nochange
          git push
