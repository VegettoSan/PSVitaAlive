name: Apply News Markdown-lite

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix re.sub lambda + apply Markdown-lite
        run: |
          set -euo pipefail
          test -f "Client PSVitaAlive/include/ui/news_markdown.hpp"
          test -f scripts/apply_news_md.py
          python3 scripts/fix_apply_news_md_lambda.py
          python3 scripts/apply_news_md.py
          grep -q news_md::drawInlineMarkdown "Client PSVitaAlive/source/ui/full_catalog_screen.cpp"
          grep -q NewsDrawLine "Client PSVitaAlive/include/ui/full_catalog_screen.hpp"
          python3 - <<'PY'
          from pathlib import Path
          t = Path("Client PSVitaAlive/source/ui/full_catalog_screen.cpp").read_text(encoding="utf-8")
          i = t.find("endLine = b.find")
          assert i > 0, "endLine not found"
          assert t[i+18] == "\\", f"expected backslash, got {t[i+17:i+25]!r}"
          assert t.count("{") == t.count("}")
          assert len(t) > 100000
          print("cpp sanity OK", len(t))
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/include/ui/full_catalog_screen.hpp" \
            "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" \
            scripts/apply_news_md.py \
            scripts/fix_apply_news_md_lambda.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "news: Markdown-lite in News modal (headings, bold, lists, HR, code)"
          git push origin HEAD:main
