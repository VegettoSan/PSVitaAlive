name: Preserve RetroBoy VPK in existing Archive.org item (STAGING)

on:
  push:
    branches:
      - integration/retroboy-ace-attorney-121
    paths:
      - .github/workflows/retroboy-staging-backup.yml

permissions:
  contents: write

concurrency:
  group: retroboy-ace-attorney-staging-backup
  cancel-in-progress: false

jobs:
  preserve-before-publication:
    if: >-
      github.repository == 'VegettoSan/PSVitaAlive' &&
      github.ref == 'refs/heads/integration/retroboy-ace-attorney-121' &&
      github.actor == 'VegettoSan'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITAHUB_SKIP_REMOTE_CHECKS: "true"
      VITAHUB_SKIP_REMOTE_MEDIA: "true"
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      IA_EXPECTED_UPLOADER: ${{ secrets.IA_EXPECTED_UPLOADER }}
    steps:
      - name: Checkout isolated unpublished integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/retroboy-ace-attorney-121
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Archive.org client
        run: python -m pip install 'internetarchive==5.13.0' 'requests==2.32.5' 'Pillow==12.1.1'
      - name: Validate full canonical app and registry before backup
        run: |
          python scripts/validate_catalog_ci.py
          python scripts/validate_installed_paths_audit.py
      - name: Preserve exactly the PR VPK to an existing owned item
        run: python -m scripts.archive_republish_pw_ace_attorney
      - name: Verify canonical mirror was committed to staging
        run: |
          git fetch origin integration/retroboy-ace-attorney-121
          git checkout -B integration/retroboy-ace-attorney-121 origin/integration/retroboy-ace-attorney-121
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.catalog_schema_v2 import to_v1
          state = json.loads(Path("data/archive_republish_pw_ace_attorney.json").read_text())
          app = to_v1(json.loads(Path("apps/phoenix-wright-ace-attorney-trilogy.json").read_text()))
          links = app["links"]
          assert state["status"] == "PUBLISHED_VERIFIED"
          assert app["title_id"] == "OBJECTION" and app["version"] == "1.0.0"
          assert any(link["type"] == "Download" and link["url"] == "https://archive.org/download/media_20261127/pwaatvita.vpk" for link in links)
          assert sum(link["type"] == "Mirror" and link["url"].startswith("https://archive.org/download/pwace-attorney-ps-vita/") for link in links) == 1
          print("PASS: original PR VPK preserved, verified versioned Archive.org mirror published to staging")
          PY

# Reconciliation-only rerun: TRANSFER_PREPARED cannot send a second VPK PUT.
