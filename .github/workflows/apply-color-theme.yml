name: Apply color theme palettes
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 scripts/fix_color_theme.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/include/installer/app_settings.hpp" \
            "Client PSVitaAlive/source/installer/app_settings.cpp" \
            "Client PSVitaAlive/source/ui/full_catalog_screen.cpp"
          git status
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "ui: color theme palettes in Settings (Neon/Cyan/Rose/Amber/Violet/Mono/OLED)"
            git push origin HEAD:main
          fi
