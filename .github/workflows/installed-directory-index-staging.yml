name: Validate installed directory index on VitaSDK (compact ELF)
on:
  push:
    branches: [work/installed-directory-index-20261105]
    paths: [.github/workflows/installed-directory-index-staging.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checked UI integration
        run: |
          python3 scripts/apply_directory_index_ui_patch.py
          git diff --check
          grep -q 'installed-directory index' 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp'
      - name: Test installed directory cache codec and path safety
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_installed_directory_cache.cpp \
            "Client PSVitaAlive/source/storage/installed_directory_codec.cpp" \
            -o /tmp/psva-dirindex-tests
          /tmp/psva-dirindex-tests
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_installed_data_policy.cpp -o /tmp/psva-data-path-tests
          /tmp/psva-data-path-tests
      - name: Test translations in eight languages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ids=("en","es","fr","de","it","pt-BR","pt-PT","ru")
          keys=("ID_MEASURE_SIZE","ID_MEASURING","ID_SIZE_PENDING",
                "ID_TOTAL_PARTIAL","ID_LAST_MEASURED","ID_CACHE_HINT",
                "ID_MEASURE_COMPLETE","ID_MEASURE_PARTIAL")
          for lang in ids:
              file=Path(f"Client PSVitaAlive/assets/lang/{lang}.lang")
              have={line.split("=",1)[0] for line in file.read_text(encoding="utf-8").splitlines() if "=" in line}
              assert not set(keys)-have, (lang,sorted(set(keys)-have))
          print("Directory cache translations passed")
          PY
      - name: Compile Vita client
        run: |
          docker pull vitasdk/vitasdk:2026.08
          docker run --rm -v "$PWD:/workspace" \
            -w "/workspace/Client PSVitaAlive" vitasdk/vitasdk:2026.08 \
            bash -lc 'set -e; cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release; cmake --build build-ci --parallel 2; test -s build-ci/PSVitaAlive.vpk'
      - name: Upload Vita test build
        uses: actions/upload-artifact@v4
        with:
          name: PSVitaAlive-directory-index-staging
          path: Client PSVitaAlive/build-ci/PSVitaAlive.vpk
          if-no-files-found: error
      - name: Commit UI patch and remove staging-only helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply_directory_index_ui_patch.py .github/workflows/installed-directory-index-staging.yml
          git add -A
          git commit -m "Integrate verified directory index into full catalog UI"
          git push origin HEAD:work/installed-directory-index-20261105
