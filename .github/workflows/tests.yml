name: Fast Tests

on:
  push:
    branches:
      - fix/version-date-imports
  pull_request:
    branches:
      - main

concurrency:
  group: fast-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fast tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
