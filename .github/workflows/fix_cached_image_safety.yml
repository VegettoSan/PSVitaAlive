name: Fix cached image safety
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Fix cached image safety')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch image cache validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('Client PSVitaAlive/source/ui/image_cache.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''SceIoStat st={};if(sceIoGetstat(path.c_str(),&st)>=0&&st.st_size>0){sceKernelLockMutex(mutex_,1,nullptr);if(!contains(ready_,path))ready_.push_back(path);retryAfter_.erase(path);sceKernelUnlockMutex(mutex_,1);return path;}'''
          new = '''SceIoStat st={};if(sceIoGetstat(path.c_str(),&st)>=0&&st.st_size>0){bool validCached=normalizeImageForVita(path);if(validCached){sceKernelLockMutex(mutex_,1,nullptr);if(!contains(ready_,path))ready_.push_back(path);retryAfter_.erase(path);sceKernelUnlockMutex(mutex_,1);return path;}sceIoRemove(path.c_str());}'''
          if old not in s:
              raise SystemExit('cached image branch not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix_cached_image_safety.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/image_cache.cpp' .github/workflows/fix_cached_image_safety.yml
          git commit -m 'Normalize cached images before Vita2D loading'
          git push
