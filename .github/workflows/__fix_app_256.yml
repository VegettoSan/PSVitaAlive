name: Fix app image normalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fix worker normalization
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Client PSVitaAlive/source/ui/image_cache.cpp')
          s=p.read_text()
          old='normalizeImageForVita(job.path,job.path.find("/app_")!=std::string::npos?512u:2048u)'
          new='normalizeImageForVita(job.path,job.path.find("/app_")!=std::string::npos?256u:2048u)'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/image_cache.cpp'
          git commit -m 'Normalize downloaded app images to 256px'
          git push origin main
      - name: Remove temporary workflow
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/__fix_app_256.yml
          git add -u .github/workflows/__fix_app_256.yml
          git commit -m 'Remove temporary app image workflow'
          git push origin main
