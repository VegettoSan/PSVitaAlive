name: Archive.org batch engine safety tests (NO UPLOAD)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/archive_backup_batch.py'
      - 'scripts/archive_backup_batch_preview.py'
      - 'tests/test_archive_backup_batch.py'
      - 'tests/test_archive_backup_batch_preview.py'
      - 'config/archive_backup_approved_apps.json'
      - '.github/workflows/archive-backup-batch.yml'
      - '.github/workflows/archive-backup-batch-tests.yml'
  push:
    branches: [feature/archive-verified-batch-automation]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install 'requests==2.32.5'
      - name: Python syntax
        run: python -m compileall -q scripts/archive_backup_batch.py
      - name: Offline batch regression suite
        run: python -m unittest discover -s tests -p 'test_archive_backup_batch.py' -v
      - name: Existing dry-run / owner / pilot tests
        run: |
          python -m unittest discover -s tests -p 'test_archive_backup_batch_preview.py' -v
          python -m unittest discover -s tests -p 'test_archive_owner_preflight.py' -v
          python -m unittest discover -s tests -p 'test_archive_upload_one_pilot.py' -v
