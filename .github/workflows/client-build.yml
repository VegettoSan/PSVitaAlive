name: Build PS Vita Client

on:
  push:
    branches: [main, diagnostics/catalog-startup-trace-20261012, fix/catalog-startup-nonblocking-20261012, fix/image-download-throughput-20261012, fix/async-image-buckets-20261012, fix/async-ux0-space-20261012, fix/event-driven-ux0-space-20261012]
    paths:
      - "Client PSVitaAlive/**"
      - ".github/workflows/client-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "Client PSVitaAlive/**"
      - ".github/workflows/client-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psvitaalive-client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check web handoff URL helper
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_web_page_link.cpp "Client PSVitaAlive/source/ui/web_page_link.cpp" \
            -o /tmp/psvitaalive-web-url-test
          /tmp/psvitaalive-web-url-test

      - name: Test dynamic QR installation instructions
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_web_qr_guide.cpp "Client PSVitaAlive/source/ui/web_qr_guide.cpp" \
            -o /tmp/psvitaalive-qr-guide-test
          /tmp/psvitaalive-qr-guide-test

      - name: Test Game/Data ZIP dispatch policy
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_install_archive_policy.cpp \
            -o /tmp/psvitaalive-install-archive-policy-test
          /tmp/psvitaalive-install-archive-policy-test

      - name: Test segmented ZIP 2/4-range layout and ZIP64 offsets
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_segmented_zip_layout.cpp \
            -o /tmp/psvitaalive-segmented-zip-test
          /tmp/psvitaalive-segmented-zip-test

      - name: Test saved ZIP .001/.002 binary range naming
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_saved_zip_parts.cpp \
            -o /tmp/psvitaalive-saved-zip-parts
          /tmp/psvitaalive-saved-zip-parts

      - name: Test bounded ZIP extraction directory cache
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_extraction_directory_cache.cpp \
            -o /tmp/psvitaalive-extraction-cache-test
          /tmp/psvitaalive-extraction-cache-test

      - name: Test unreachable source and HTTP response policy
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_download_failure_policy.cpp \
            -o /tmp/psvitaalive-download-failure-policy-test
          /tmp/psvitaalive-download-failure-policy-test

      - name: Verify ownership restrictions for storage cleanup
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_storage_cleanup_policy.cpp \
            -o /tmp/psvitaalive-storage-policy-test
          /tmp/psvitaalive-storage-policy-test

      - name: Test orphaned download startup cleanup policy
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_startup_cleanup_policy.cpp \
            -o /tmp/psvitaalive-startup-cleanup-policy-test
          /tmp/psvitaalive-startup-cleanup-policy-test

      - name: Test installer retry policy
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_install_retry_policy.cpp \
            -o /tmp/psvitaalive-install-retry-test
          /tmp/psvitaalive-install-retry-test

      - name: Test installer space preflight
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_install_space_policy.cpp \
            -o /tmp/psvitaalive-install-space-test
          /tmp/psvitaalive-install-space-test

      - name: Test friendly install error classification
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" \
            tests/test_install_failure_presentation.cpp \
            -o /tmp/psvitaalive-friendly-error-policy-test
          /tmp/psvitaalive-friendly-error-policy-test

      - name: Verify friendly error translations for all languages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          archive_keys = (
              "ARCHIVE_DOWNLOAD_FRIENDLY_TITLE", "ARCHIVE_DOWNLOAD_FRIENDLY_REASON",
              "ARCHIVE_DOWNLOAD_FRIENDLY_EXPLAIN", "ARCHIVE_DOWNLOAD_FRIENDLY_ACTION",
              "DOWNLOAD_VERIFYING_SEGMENTS", "DOWNLOAD_VERIFYING_HINT",
              "ZIP_SAVED_ACTION_TITLE", "ZIP_SAVED_ACTION_QUESTION",
              "ZIP_SAVED_ACTION_RETRY", "ZIP_SAVED_ACTION_DELETE",
              "ZIP_SAVED_ACTION_CANCEL", "ZIP_SAVED_CONFIRM_DELETE",
              "ZIP_SAVED_CONFIRM_BUTTON", "ZIP_SAVED_COMPLETE_META",
              "ZIP_SAVED_PARTS_META", "ZIP_SAVED_DELETE_FAILED", "ZIP_SAVED_DELETED",
              "ALL_SPACE_TITLE", "ALL_SPACE_EXPLANATION", "ALL_SPACE_READ_FAILED",
              "ALL_SPACE_REQUIRED", "ALL_SPACE_AVAILABLE", "ALL_SPACE_MISSING",
              "ALL_SPACE_CLOSE", "STORAGE_OPEN_HINT",
              "STORAGE_CLEAR_SECTION", "STORAGE_EMPTY", "STORAGE_PROTECTED",
              "STORAGE_CLEAN_ALL", "STORAGE_CONFIRM_ALL",
              "STORAGE_SELECT_HINT", "STORAGE_CONTROLS",
              "ALL_REPORT_ACTION_REPORT", "ALL_REPORT_SENDING",
              "ALL_REPORT_SENT", "ALL_REPORT_SELECT_REPORT_HINT",
          )
          categories = ("NETWORK", "HTTP_MISSING", "HTTP_DENIED", "HTTP_BUSY",
                        "HTTP_SERVER", "TLS", "MEDIAFIRE", "SPACE", "STORAGE",
                        "ARCHIVE", "UNSAFE", "FORMAT", "INSTALLER", "OTHER")
          keys = set(archive_keys)
          keys.update(f"INSTALL_ERR_TITLE_{s}" for s in ("DOWNLOAD", "ARCHIVE", "GENERAL"))
          for cat in categories:
              keys.add(f"INSTALL_ERR_{cat}_WHY")
              keys.add(f"INSTALL_ERR_{cat}_ACTION")
          for code in ("en", "es", "fr", "de", "it", "pt-BR", "pt-PT", "ru"):
              lines = (Path("Client PSVitaAlive/assets/lang") / (code + ".lang")).read_text(encoding="utf-8").splitlines()
              for key in keys:
                  values = [line[len(key) + 1:] for line in lines if line.startswith(key + "=")]
                  if len(values) != 1 or not values[0].strip():
                      raise SystemExit(f"{code}: key {key} must occur exactly once with nonempty text")
          print(f"Verified {len(keys)} error keys in all 8 language packs")
          PY

      - name: Build with official VitaSDK image
        shell: bash
        run: |
          set -euo pipefail
          docker pull vitasdk/vitasdk:2026.08
          docker run --rm \
            -v "$PWD:/workspace" \
            -w "/workspace/Client PSVitaAlive" \
            vitasdk/vitasdk:2026.08 \
            bash -lc '
              set -euo pipefail
              echo "VITASDK=$VITASDK"
              VDPM="$VITASDK/bin/vdpm"
              test -x "$VDPM"

              # The 2026.08 image currently contains openssl-1.1.1 while the
              # official curl/libzip packages declare the legacy `openssl`
              # (Vita OpenSSL 1.0.2) dependency. Use vdpm by absolute VitaSDK path
              # so CI does not depend on login-shell PATH rewriting.
              "$VDPM" pacman -- -Rdd --noconfirm openssl-1.1.1 || true
              VDPM_NONINTERACTIVE=1 "$VDPM" install openssl

              echo "Installed network package metadata:"
              "$VDPM" info openssl || true
              "$VDPM" info curl || true
              "$VDPM" info libzip || true

              # CMake already links pthread explicitly. Injecting an additional
              # -pthread through CMAKE_EXE_LINKER_FLAGS duplicates libpthread with
              # the current GCC 15 VitaSDK image and causes multiple definitions.
              cmake -S . -B build-ci \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build build-ci --parallel 2
              test -s build-ci/PSVitaAlive.vpk || {
                echo "Expected build-ci/PSVitaAlive.vpk was not produced" >&2
                find build-ci -maxdepth 2 -type f -printf "%p %s bytes\n" | sort
                exit 1
              }
              ls -lh build-ci/PSVitaAlive.vpk
            '

      - name: Upload VPK smoke-build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PSVitaAlive-image-throughput-${{ github.sha }}
          path: Client PSVitaAlive/build-ci/PSVitaAlive.vpk
          if-no-files-found: error
          retention-days: 14
