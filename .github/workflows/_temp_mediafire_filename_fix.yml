name: Temporary MediaFire filename fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch source files through GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            async function getText(path) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              const item = Array.isArray(r.data) ? r.data[0] : r.data;
              return {
                text: Buffer.from(item.content, 'base64').toString('utf8'),
                sha: item.sha
              };
            }

            async function putText(path, text, sha, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha, message,
                content: Buffer.from(text, 'utf8').toString('base64')
              });
            }

            const mainPath = 'Client PSVitaAlive/source/main.cpp';
            let mainFile = await getText(mainPath);
            const oldFileName = 'std::string fileNameFromUrl(const std::string&url,const std::string&id){std::string clean=url;const size_t q=clean.find(\'?\');if(q!=std::string::npos)clean.erase(q);const size_t f=clean.find(\'#\');if(f!=std::string::npos)clean.erase(f);const size_t slash=clean.find_last_of(\'/\');std::string name=slash==std::string::npos?clean:clean.substr(slash+1);return name.empty()?id+".bin":name;}';
            const newFileName = `int hexValue(char c){if(c>='0'&&c<='9')return c-'0';if(c>='a'&&c<='f')return c-'a'+10;if(c>='A'&&c<='F')return c-'A'+10;return -1;}\nstd::string urlDecodePath(std::string value){for(int pass=0;pass<2;++pass){std::string out;out.reserve(value.size());bool changed=false;for(size_t i=0;i<value.size();++i){if(value[i]=='%'&&i+2<value.size()){const int h=hexValue(value[i+1]);const int l=hexValue(value[i+2]);if(h>=0&&l>=0){out.push_back(static_cast<char>((h<<4)|l));i+=2;changed=true;continue;}}out.push_back(value[i]);}value.swap(out);if(!changed)break;}return value;}\nstd::string fileNameFromUrl(const std::string&url,const std::string&id){\n    std::string clean=url;const size_t q=clean.find('?');if(q!=std::string::npos)clean.erase(q);const size_t f=clean.find('#');if(f!=std::string::npos)clean.erase(f);\n    std::string name;const size_t media=clean.find("mediafire.com");const size_t marker=clean.find("/file/",media==std::string::npos?0:media);\n    if(media!=std::string::npos&&marker!=std::string::npos){const size_t idEnd=clean.find('/',marker+6);if(idEnd!=std::string::npos){const size_t nameEnd=clean.find('/',idEnd+1);name=clean.substr(idEnd+1,nameEnd==std::string::npos?std::string::npos:nameEnd-(idEnd+1));}}\n    if(name.empty()){const size_t slash=clean.find_last_of('/');name=slash==std::string::npos?clean:clean.substr(slash+1);if(name=="file"&&slash!=std::string::npos){const size_t prev=clean.find_last_of('/',slash-1);if(prev!=std::string::npos)name=clean.substr(prev+1,slash-prev-1);}}\n    name=urlDecodePath(name);return name.empty()||name=="file"?id+".bin":name;\n}`;
            if (!mainFile.text.includes(oldFileName)) core.setFailed('main.cpp fileNameFromUrl pattern not found');
            mainFile.text = mainFile.text.replace(oldFileName, newFileName);

            const oldZip = 'bool isZipName(const std::string&name){return name.size()>=4&&name.substr(name.size()-4)==".zip";}';
            const newZip = 'bool isZipName(const std::string&name){if(name.size()<4)return false;std::string ext=name.substr(name.size()-4);for(char&c:ext){if(c>='A'&&c<='Z')c=static_cast<char>(c-'A'+'a');}return ext==".zip";}';
            if (!mainFile.text.includes(oldZip)) core.setFailed('main.cpp isZipName pattern not found');
            mainFile.text = mainFile.text.replace(oldZip, newZip);
            await putText(mainPath, mainFile.text, mainFile.sha, 'fix(client): preserve MediaFire file formats (1/2)');

            const dmPath = 'Client PSVitaAlive/source/network/download_manager.cpp';
            let dmFile = await getText(dmPath);
            const oldHelper = `namespace {\nstd::string sanitizePayloadFileName(const std::string& name, const std::string& url) {\n    std::string n = name;\n    auto lower = [](std::string s) {\n        for (char& c : s) c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));\n        return s;\n    };\n    const std::string low = lower(n);\n    const bool bad =\n        n.empty() ||\n        low.find("get_hb_url") != std::string::npos ||\n        (low.size() >= 4 && (\n            low.rfind(".php") == low.size() - 4 ||\n            low.rfind(".html") == low.size() - 5 ||\n            low.rfind(".htm") == low.size() - 4 ||\n            low.rfind(".asp") == low.size() - 4));\n    if (!bad) return n;\n    std::string base = "download";\n    const std::size_t q = url.find("id=");\n    if (q != std::string::npos) {\n        std::string id;\n        for (std::size_t i = q + 3; i < url.size(); ++i) {\n            const char c = url[i];\n            if (c == '&' || c == '#') break;\n            if ((c >= '0' && c <= '9') || (c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || c == '_' || c == '-')\n                id.push_back(c);\n            else break;\n        }\n        if (!id.empty()) base = "vitadb_" + id;\n    }\n    return base + ".vpk";\n}\n} // namespace`;
            const newHelper = `namespace {\nint hexValue(char c){if(c>='0'&&c<='9')return c-'0';if(c>='a'&&c<='f')return c-'a'+10;if(c>='A'&&c<='F')return c-'A'+10;return -1;}\nstd::string urlDecodePath(std::string value){for(int pass=0;pass<2;++pass){std::string out;out.reserve(value.size());bool changed=false;for(size_t i=0;i<value.size();++i){if(value[i]=='%'&&i+2<value.size()){const int h=hexValue(value[i+1]);const int l=hexValue(value[i+2]);if(h>=0&&l>=0){out.push_back(static_cast<char>((h<<4)|l));i+=2;changed=true;continue;}}out.push_back(value[i]);}value.swap(out);if(!changed)break;}return value;}\nstd::string inferFileNameFromUrl(const std::string&url){std::string clean=url;const size_t q=clean.find('?');if(q!=std::string::npos)clean.erase(q);const size_t f=clean.find('#');if(f!=std::string::npos)clean.erase(f);std::string name;const size_t media=clean.find("mediafire.com");const size_t marker=clean.find("/file/",media==std::string::npos?0:media);if(media!=std::string::npos&&marker!=std::string::npos){const size_t idEnd=clean.find('/',marker+6);if(idEnd!=std::string::npos){const size_t nameEnd=clean.find('/',idEnd+1);name=clean.substr(idEnd+1,nameEnd==std::string::npos?std::string::npos:nameEnd-(idEnd+1));}}if(name.empty()){const size_t slash=clean.find_last_of('/');name=slash==std::string::npos?clean:clean.substr(slash+1);if(name=="file"&&slash!=std::string::npos){const size_t prev=clean.find_last_of('/',slash-1);if(prev!=std::string::npos)name=clean.substr(prev+1,slash-prev-1);}}return urlDecodePath(name);}\nstd::string sanitizePayloadFileName(const std::string&name,const std::string&url){std::string n=name;auto lower=[](std::string s){for(char&c:s)c=static_cast<char>(std::tolower(static_cast<unsigned char>(c)));return s;};const std::string low=lower(n);const bool placeholder=n.empty()||low=="file"||low=="download"||low=="payload"||low=="payload.bin"||low.find("get_hb_url")!=std::string::npos;if(placeholder){const std::string inferred=inferFileNameFromUrl(url);if(!inferred.empty()&&inferred!="file")n=inferred;}if(!n.empty()&&lower(n)!="file"&&lower(n)!="download")return n;return "payload.bin";}\n} // namespace`;
            if (!dmFile.text.includes(oldHelper)) core.setFailed('download_manager helper pattern not found');
            dmFile.text = dmFile.text.replace(oldHelper, newHelper);
            await putText(dmPath, dmFile.text, dmFile.sha, 'fix(client): preserve MediaFire file formats (2/2)');

            const wfPath = '.github/workflows/_temp_mediafire_filename_fix.yml';
            const wf = await github.rest.repos.getContent({ owner, repo, path: wfPath, ref: branch });
            const wfSha = Array.isArray(wf.data) ? wf.data[0].sha : wf.data.sha;
            await github.rest.repos.deleteFile({ owner, repo, path: wfPath, message: 'chore: remove temporary MediaFire patch workflow', sha: wfSha, branch });
