name: Apply UI polish
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish v2
        run: |
          set -euo pipefail
          python3 -c '
          import base64, pathlib
          parts = [pathlib.Path(f"scripts/px{i}.b64").read_text().strip() for i in range(4)]
          pathlib.Path("p2.py").write_bytes(base64.b64decode("".join(parts)))
          print("script", pathlib.Path("p2.py").stat().st_size)
          '
          python3 p2.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" "Client PSVitaAlive/source/main.cpp" "Client PSVitaAlive/source/catalog/catalog_manager.cpp" || true
          git status
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "ui: clip overflow, larger text, link marquee, loading messages, Recommended text-only"
            git push origin HEAD:main
          fi
