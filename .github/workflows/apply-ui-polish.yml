name: Apply UI polish
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and run polish
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, pathlib
          b64 = """"""
          pathlib.Path("scripts").mkdir(exist_ok=True)
          pathlib.Path("scripts/apply_ui_polish.py").write_bytes(base64.b64decode(b64))
          print("wrote script", len(base64.b64decode(b64)))
          PY
          python3 scripts/apply_ui_polish.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add scripts/apply_ui_polish.py \
            "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" \
            "Client PSVitaAlive/source/main.cpp" \
            "Client PSVitaAlive/source/catalog/catalog_manager.cpp" || true
          git status
          git commit -m "ui: data-request button, detail focus, clearer loading, larger small text, title marquee"
          git push origin HEAD:main
