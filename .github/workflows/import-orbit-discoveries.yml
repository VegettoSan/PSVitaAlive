name: Import reviewed Orbit discoveries
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/import_orbit_discoveries.py
      - scripts/orbit_auto_selection.py
      - tests/test_orbit_auto_selection.py
      - scripts/vpk_display_name.py
      - tests/test_vpk_display_name.py
      - config/orbit_publication_approved.json
      - tests/test_import_orbit_discoveries.py
      - .github/workflows/import-orbit-discoveries.yml
      - scripts/archive_new_items_batch.py
      - .github/workflows/validate.yml
      - .github/workflows/archive-backup-batch.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: >-
      github.repository == 'VegettoSan/PSVitaAlive' &&
      (github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('orbit-import-preview-{0}', github.event.pull_request.number) || 'vitahub-catalog-publisher' }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync official main before import
        if: github.ref == 'refs/heads/main'
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing preservation dependencies
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install 'internetarchive==5.13.0' 'requests==2.32.5' 'Pillow==12.1.1'
      - name: Test import safeguards
        run: python -m unittest discover -s tests -p 'test_import_orbit_discoveries.py' -v
      - name: Test automatic candidate policy
        run: python -m unittest discover -s tests -p 'test_orbit_auto_selection.py' -v
      - name: Test native display titles
        run: python -m unittest discover -s tests -p 'test_vpk_display_name.py' -v
      - name: Audit real pilot native title (read only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from scripts.import_orbit_discoveries import full_package
          from scripts.archive_backup_batch import download_source, official_asset_metadata
          from scripts.vpk_display_name import vpk_display_name
          url='https://github.com/Electric1447/MinFWVer/releases/download/v2.1/minfwver.vpk'
          size,sha=official_asset_metadata({'source_url':url})
          with tempfile.TemporaryDirectory() as d:
              path=Path(d)/'pilot.vpk'
              _, measured=download_source({'source_url':url,'size_bytes':size,'source_sha256':sha},path,max_file=64*1024*1024)
              full_package(path,'MINFW0000')
              print('Pilot native display title:', repr(vpk_display_name(path)), 'SHA256:',measured)
          PY
      - name: Test existing preservation safeguards
        run: python -m unittest discover -s tests -p 'test_archive_new_items_batch.py' -v
      - name: Stage eligible discoveries (real package and identity validation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.import_orbit_discoveries --stage
      - name: Validate full canonical source catalog
        env:
          VITAHUB_SKIP_REMOTE_CHECKS: 'true'
        run: python scripts/validate_catalog_ci.py
      - name: Save proposed sources for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-canonical-preview
          path: |
            apps/*.json
            data/orbit_imports/
            data/orbit_import_cursor.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit only canonical sources and trigger normal publication
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- apps authors
          if [ -d data/orbit_imports ]; then git add -- data/orbit_imports; fi
          if [ -f data/orbit_import_cursor.json ]; then git add -- data/orbit_import_cursor.json; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import reviewed Orbit discoveries into canonical sources'
            git push origin HEAD:main
          fi
          # A failed dispatch must be retryable even after the source commit.
          if python - <<'PY'
          import json
          from pathlib import Path
          from scripts.catalog_schema_v2 import to_v1
          catalog=to_v1(json.loads(Path('catalog.json').read_text()))
          ids={a.get('id') for a in catalog}
          pending=any(a.get('source_name')=='Orbit' and a.get('id') not in ids
                      for a in (to_v1(json.loads(p.read_text())) for p in Path('apps').glob('*.json')))
          raise SystemExit(0 if pending else 1)
          PY
          then
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=orbit_catalog_imported
          fi
