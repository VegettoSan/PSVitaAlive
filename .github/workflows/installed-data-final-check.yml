name: Final installed data manager checks
on:
  push:
    branches: [work/installed-data-manager-20261105]
    paths:
      - .github/workflows/installed-data-final-check.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check web editor and installed paths
        env:
          VITAHUB_SKIP_REMOTE_CHECKS: "true"
          VITAHUB_SKIP_REMOTE_MEDIA: "true"
        run: |
          node --test web/tools/app-generator/generator.test.cjs
          # Full catalog validation runs in its official workflow on main.
          # Use the existing offline installed-path audit in staging.
          python3 scripts/validate_installed_paths_audit.py
          python3 -m py_compile scripts/validate_catalog.py
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" tests/test_installed_data_policy.cpp -o /tmp/idpolicy
          /tmp/idpolicy
          python3 - <<'PY'
          from pathlib import Path
          keys = ("ID_TITLE", "ID_SECTION", "ID_UNINSTALL_BUTTON", "ID_WARNING1",
                  "ID_WARNING2", "ID_WARNING3", "ID_ONLY_APP", "ID_ONLY_DATA",
                  "ID_APP_DATA", "ID_CONFIRM_CONTROLS")
          for p in Path("Client PSVitaAlive/assets/lang").glob("*.lang"):
              text=p.read_text(encoding="utf-8")
              found={line.split("=",1)[0] for line in text.splitlines() if "=" in line}
              missing=set(keys)-found
              assert not missing, (p,sorted(missing))
          print("Installed data locale coverage: PASS")
          PY
      - name: Compile final translated Vita client
        run: |
          docker pull vitasdk/vitasdk:2026.08
          docker run --rm -v "$PWD:/workspace" -w "/workspace/Client PSVitaAlive" vitasdk/vitasdk:2026.08 bash -lc 'set -e; cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release; cmake --build build-ci --parallel 2; test -s build-ci/PSVitaAlive.vpk'
      - name: Upload final VPK
        uses: actions/upload-artifact@v4
        with:
          name: PSVitaAlive-installed-data-final
          path: Client PSVitaAlive/build-ci/PSVitaAlive.vpk
          if-no-files-found: error
      - name: Remove temporary validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/installed-data-final-check.yml
          git add .github/workflows/installed-data-final-check.yml
          git commit -m "Remove temporary installed data final validation workflow"
          git push origin HEAD:work/installed-data-manager-20261105
