name: Check App JSON Generator

on:
  pull_request:
    branches: [main]
    paths:
      - "web/tools/app-generator/**"
      - ".github/workflows/app-generator-check.yml"
  push:
    branches: [main]
    paths:
      - "web/tools/app-generator/**"
      - ".github/workflows/app-generator-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax
        run: node --check web/tools/app-generator/app-generator.js
      - name: Run offline generator regression tests
        run: node --test web/tools/app-generator/generator.test.cjs
