name: Apply download UI improvements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch client
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('Client PSVitaAlive')

          def fn(text,sig,repl):
              a=text.find(sig)
              if a<0: raise RuntimeError('missing '+sig)
              b=text.find('{',a); depth=0; i=b; quote=None; esc=False
              while i<len(text):
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in ('"',"'"): quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:return text[:a]+repl+text[i+1:]
                  i+=1
              raise RuntimeError('unclosed '+sig)

          # Delete partial payloads when a download is explicitly cancelled.
          p=root/'source/network/download_manager.cpp';s=p.read_text()
          cancel='''void DownloadManager::cancel(const std::string& jobId){if(auto*j=findJob(jobId)){j->cancelRequested=true;StorageManager st;if(j->state==DownloadState::Queued){st.removeFile(j->temporaryPath);j->state=DownloadState::Cancelled;j->lastError="cancelled";saveMetadata(*j);}}}'''
          if 'StorageManager st;if(j->state==DownloadState::Queued)' not in s:
              s=fn(s,'void DownloadManager::cancel(const std::string& jobId)',cancel)
          s,n=re.subn(r'if\s*\(hr == HttpResult::Cancelled \|\| job\.cancelRequested\)\s*\{.*?return false;\s*\}', '''if(hr==HttpResult::Cancelled||job.cancelRequested){st.removeFile(job.temporaryPath);job.downloadedSize=0;job.state=DownloadState::Cancelled;job.lastError="cancelled";saveMetadata(job);return false;}''',s,count=1,flags=re.S)
          if n!=1: raise RuntimeError('download cancellation branch not found')
          p.write_text(s)

          # Expose cancellation from InstallController and keep the UI responsive while it unwinds.
          p=root/'source/installer/install_controller.cpp';s=p.read_text()
          if 'void InstallController::cancel()' not in s:
              s=s.replace('bool InstallController::busy() const {','''void InstallController::cancel(){const auto currentState=static_cast<InstallStatus::State>(state_.load());if(currentState!=InstallStatus::State::Downloading||activeJobId_.empty())return;downloads_.cancel(activeJobId_);setStage("Cancelling");setState(InstallStatus::State::Downloading,"Cancelling download...");diagnostics::log(std::string("[Installer] cancel requested job=")+activeJobId_);}\n\nbool InstallController::busy() const {''',1)
          s,n=re.subn(r'if\s*\(!downloaded \|\| !job \|\| job->state != DownloadState::Completed\)\s*\{.*?return 0;\s*\}', '''if(!downloaded||!job||job->state!=DownloadState::Completed){const bool cancelled=job&&job->state==DownloadState::Cancelled;const std::string error=cancelled?"Download cancelled":(job&&!job->lastError.empty()?job->lastError:"Download failed");setStage(cancelled?"Cancelled":"Error");setState(InstallStatus::State::Failed,error.c_str());diagnostics::log(std::string("[Installer] ")+(cancelled?"download cancelled":"download failed")+": "+error);if(!activeJobId_.empty())downloads_.cleanupCompletedJob(activeJobId_);activeJobId_.clear();sceKernelDelayThread(cancelled?700*1000:2500*1000);setState(InstallStatus::State::Idle,"Ready");workerDone_.store(true);return 0;}''',s,count=1,flags=re.S)
          if n!=1: raise RuntimeError('install cancellation branch not found')
          p.write_text(s)

          # App download overlay: same panel aesthetic as image dialogs, filename, speed and ETA, plus Circle cancel.
          p=root/'source/ui/full_catalog_screen.cpp';s=p.read_text()
          if 'std::string formatEta(uint64_t seconds)' not in s:
              marker='FullCatalogScreen::FullCatalogScreen()=default;'
              helper='std::string formatEta(uint64_t seconds){if(seconds==0)return "--";uint64_t h=seconds/3600,m=(seconds%3600)/60,sec=seconds%60;char o[64];if(h)sceClibSnprintf(o,sizeof(o),"%llu:%02llu:%02llu",(unsigned long long)h,(unsigned long long)m,(unsigned long long)sec);else sceClibSnprintf(o,sizeof(o),"%02llu:%02llu",(unsigned long long)m,(unsigned long long)sec);return o;}\n'
              s=s.replace(marker,helper+marker,1)
          if 'setInstallCancelCallback(InstallCancelFn' not in s:
              s=s.replace('void FullCatalogScreen::setCatalogChangeCallback', 'void FullCatalogScreen::setInstallCancelCallback(InstallCancelFn c){installCancel_=std::move(c);}void FullCatalogScreen::setCatalogChangeCallback',1)
          overlay='''void FullCatalogScreen::drawLoadingOverlay(){const int w=620,h=350,x=(SCREEN_W-w)/2,y=(SCREEN_H-h)/2;vita2d_draw_rectangle(0,0,SCREEN_W,SCREEN_H,RGBA8(0,0,0,110));vita2d_draw_rectangle(x,y,w,h,PANEL);vita2d_draw_rectangle(x,y,w,2,ACCENT);vita2d_draw_rectangle(x,y+2,2,h-4,ACCENT);vita2d_draw_rectangle(x+w-2,y+2,2,h-4,BORDER);vita2d_draw_rectangle(x,y+h-2,w,2,BORDER);if(catalogLoading_){vita2d_pgf_draw_text(font_,x+28,y+36,ACCENT,.68f,"PSVitaAlive");vita2d_pgf_draw_text(font_,x+28,y+76,WHITE,1.00f,catalogLoadingLabel_.empty()?"Loading catalog":catalogLoadingLabel_.c_str());vita2d_pgf_draw_text(font_,x+28,y+108,TEXT,.60f,catalogLoadingMessage_.empty()?"Preparing...":catalogLoadingMessage_.c_str());uint64_t pct=catalogLoadingTotal_?std::min<uint64_t>(100,(catalogLoadingCurrent_*100)/catalogLoadingTotal_):0;int bx=x+28,by=y+140,bw=w-56,bh=12;vita2d_draw_rectangle(bx,by,bw,bh,BORDER);vita2d_draw_rectangle(bx,by,bw*(int)pct/100,bh,ACCENT);char st[160];sceClibSnprintf(st,sizeof(st),"%llu%%  %llu / %llu",(unsigned long long)pct,(unsigned long long)catalogLoadingCurrent_,(unsigned long long)catalogLoadingTotal_);vita2d_pgf_draw_text(font_,x+28,y+168,TEXT,.58f,st);return;}vita2d_pgf_draw_text(font_,x+28,y+36,ACCENT,.68f,"PSVitaAlive");const bool downloading=installProgressStage_=="Downloading"||installProgressStage_=="Cancelling"||installProgressStage_.empty();vita2d_pgf_draw_text(font_,x+28,y+76,WHITE,1.00f,downloading?"Downloading":"Installing");std::string file=installProgressFile_.empty()?"Preparing...":ellipsize(installProgressFile_,72);vita2d_pgf_draw_text(font_,x+28,y+108,TEXT,.62f,file.c_str());const uint64_t total=installProgressTotal_,current=std::min<uint64_t>(installProgressCurrent_,total?total:installProgressCurrent_);const uint64_t pct=total?std::min<uint64_t>(100,(current*100)/total):0;int bx=x+28,by=y+140,bw=w-56,bh=12;vita2d_draw_rectangle(bx,by,bw,bh,BORDER);vita2d_draw_rectangle(bx,by,bw*(int)pct/100,bh,ACCENT);char stats[220];sceClibSnprintf(stats,sizeof(stats),"%llu%%  %s / %s  •  %s/s",(unsigned long long)pct,formatBytes(current).c_str(),total?formatBytes(total).c_str():"?",formatBytes(installProgressSpeed_).c_str());vita2d_pgf_draw_text(font_,x+28,y+168,TEXT,.58f,stats);uint64_t eta=0;if(installProgressSpeed_>0&&total>current)eta=(total-current)/installProgressSpeed_;char info[180];sceClibSnprintf(info,sizeof(info),"File: 1 / 1   ETA: %s",formatEta(eta).c_str());vita2d_pgf_draw_text(font_,x+28,y+194,ACCENT,.62f,info);if(!installProgressMessage_.empty())vita2d_pgf_draw_text(font_,x+28,y+222,DIM,.54f,ellipsize(installProgressMessage_,82).c_str());const int by2=y+268,bw2=330,bh2=40;vita2d_draw_rectangle(x+28,by2,bw2,bh2,SURFACE2);vita2d_draw_rectangle(x+28,by2,bw2,1,BORDER);vita2d_pgf_draw_text(font_,x+92,by2+26,WHITE,.62f,"CIRCLE  CANCEL DOWNLOAD");vita2d_pgf_draw_text(font_,x+28,y+h-14,DIM,.50f,"Circle: Cancel download and remove incomplete file");}'''
          s=fn(s,'void FullCatalogScreen::drawLoadingOverlay()',overlay)
          marker='if(catalogLoading_||installProgressActive_)return;'
          if 'installCancel_)installCancel_()' not in s:
              s=s.replace(marker,'if(installProgressActive_&&(pressed&SCE_CTRL_CIRCLE)){if(installCancel_)installCancel_();return;}'+marker,1)
          p.write_text(s)

          # Image decision dialog: avoid overlap and match the dark-gray download panel aesthetic.
          p=root/'source/main.cpp';s=p.read_text()
          s=s.replace('const int w=620,h=320,x=(960-w)/2,y=(544-h)/2;','const int w=620,h=360,x=(960-w)/2,y=(544-h)/2;',1)
          for a,b in [('y+120','y+160'),('y+166','y+190'),('y+188','y+212'),('y+208','y+234'),('by=y+236','by=y+266')]:s=s.replace(a,b,1)
          s=s.replace('vita2d_draw_rectangle(0,0,960,544,RGBA8(0,0,0,185));','vita2d_draw_rectangle(0,0,960,544,RGBA8(0x18,0x18,0x18,255));vita2d_draw_rectangle(0,0,960,544,RGBA8(0,0,0,70));',1)

          # Show a real preparing/cancelling state and use overall file progress for image downloads.
          s=s.replace('images.resetProgress();\n    queueStartupImages(jobs,images);','''images.resetProgress();
    vita2d_pgf* prepFont=vita2d_load_default_pgf();
    if(prepFont){vita2d_start_drawing();vita2d_clear_screen();vita2d_draw_rectangle(0,0,960,544,RGBA8(0x18,0x18,0x18,255));vita2d_draw_rectangle(0,0,960,544,RGBA8(0,0,0,70));const int pw=620,ph=300,px=(960-pw)/2,py=(544-ph)/2;vita2d_draw_rectangle(px,py,pw,ph,PANEL);vita2d_draw_rectangle(px,py,pw,2,ACCENT);vita2d_pgf_draw_text(prepFont,px+28,py+40,ACCENT,.68f,"PSVitaAlive");vita2d_pgf_draw_text(prepFont,px+28,py+82,WHITE,1.0f,"Preparing image downloads");vita2d_pgf_draw_text(prepFont,px+28,py+116,TEXT,.58f,"Building the download queue...");vita2d_pgf_draw_text(prepFont,px+28,py+150,ACCENT,.62f,"Please wait");vita2d_end_drawing();vita2d_swap_buffers();sceKernelDelayThread(16*1000);}
    queueStartupImages(jobs,images);
    if(prepFont){vita2d_wait_rendering_done();vita2d_free_pgf(prepFont);}''',1)
          s=s.replace('if(pad.buttons&SCE_CTRL_CIRCLE){images.cancelAll();cancelled=true;}','''if(pad.buttons&SCE_CTRL_CIRCLE&&!cancelled){images.cancelAll();cancelled=true;}
        if(cancelled){
            vita2d_start_drawing();vita2d_clear_screen();vita2d_draw_rectangle(0,0,960,544,RGBA8(0x18,0x18,0x18,255));vita2d_draw_rectangle(0,0,960,544,RGBA8(0,0,0,70));const int cw=620,ch=260,cx=(960-cw)/2,cy=(544-ch)/2;vita2d_draw_rectangle(cx,cy,cw,ch,PANEL);vita2d_draw_rectangle(cx,cy,cw,2,ACCENT);vita2d_pgf_draw_text(font,cx+28,cy+42,ACCENT,.68f,"PSVitaAlive");vita2d_pgf_draw_text(font,cx+28,cy+84,WHITE,1.0f,"Cancelling image downloads");vita2d_pgf_draw_text(font,cx+28,cy+120,TEXT,.58f,"Stopping active transfer and removing incomplete file...");vita2d_pgf_draw_text(font,cx+28,cy+158,ACCENT,.62f,"Please wait");vita2d_end_drawing();vita2d_swap_buffers();if(!images.progress().active)break;sceKernelDelayThread(16*1000);continue;}''',1)
          old='const uint64_t current=p.downloaded,total=p.total;const uint32_t pct=total?std::min<uint64_t>(100,(current*100)/total):0;int bx=x+28,by=y+140,bw=w-56,bh=12;vita2d_draw_rectangle(bx,by,bw,bh,BORDER);vita2d_draw_rectangle(bx,by,bw*(int)pct/100,bh,ACCENT);char stats[220]={};sceClibSnprintf(stats,sizeof(stats),"%u%%  %s / %s  •  %s/s",pct,formatBytes(current).c_str(),total?formatBytes(total).c_str():"?",formatBytes(p.speed).c_str());vita2d_pgf_draw_text(font,x+28,y+168,TEXT,.58f,stats);'
          new='const uint64_t current=p.downloaded,total=p.total;const uint64_t filePct=total?std::min<uint64_t>(100,(current*100)/total):0;const uint64_t overallPct=jobs.empty()?100:std::min<uint64_t>(100,((completed*10000)+(filePct*100))/jobs.size()/100);int bx=x+28,by=y+140,bw=w-56,bh=12;vita2d_draw_rectangle(bx,by,bw,bh,BORDER);vita2d_draw_rectangle(bx,by,bw*(int)overallPct/100,bh,ACCENT);char stats[220]={};sceClibSnprintf(stats,sizeof(stats),"%llu%%  Files: %llu / %u  •  %s/s",(unsigned long long)overallPct,(unsigned long long)completed,(unsigned)jobs.size(),formatBytes(p.speed).c_str());vita2d_pgf_draw_text(font,x+28,y+168,TEXT,.58f,stats);'
          if old not in s: raise RuntimeError('image progress draw block not found')
          s=s.replace(old,new,1)
          s=s.replace('vita2d_pgf_draw_text(font,x+28,y+194,ACCENT,.62f,count);','vita2d_pgf_draw_text(font,x+28,y+194,ACCENT,.62f,count);',1)
          # Add ETA after image speed/count using an average completed-file size estimate.
          marker='vita2d_pgf_draw_text(font,x+28,y+194,ACCENT,.62f,count);'
          eta='''uint64_t eta=0;if(p.speed>0){uint64_t avg=completed>0?p.completedBytes/completed:(p.total?p.total:0);uint64_t future=jobs.size()>completed+(p.active?1:0)?jobs.size()-completed-(p.active?1:0):0;uint64_t remaining=(p.total>p.downloaded?p.total-p.downloaded:0)+avg*future;eta=remaining/p.speed;}char etaText[96];sceClibSnprintf(etaText,sizeof(etaText),"ETA: %s",formatEta(eta).c_str());vita2d_pgf_draw_text(font,x+28,y+218,ACCENT,.62f,etaText);'''
          if 'uint64_t eta=0;if(p.speed>0)' not in s:s=s.replace(marker,marker+eta,1)
          p.write_text(s)

          # Wire the current screen/controller objects to the new cancellation callback.
          if 'setInstallCancelCallback' not in s:
              m=re.search(r'(\b[A-Za-z_]\w*)\.setInstallCallbacks\((.*?)\);',s,re.S)
              if not m: raise RuntimeError('setInstallCallbacks call not found')
              ctrls=re.findall(r'InstallController\s+([A-Za-z_]\w*)',s)
              if not ctrls: raise RuntimeError('InstallController variable not found')
              s=s[:m.end()]+f'\n    {m.group(1)}.setInstallCancelCallback([&{ctrls[0]}](){{ {ctrls[0]}.cancel(); }});'+s[m.end():]
          p.write_text(s)
          print('patch ok')
          PY
          git config user.name "PSVitaAlive Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Client PSVitaAlive/source/network/download_manager.cpp" "Client PSVitaAlive/source/installer/install_controller.cpp" "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" "Client PSVitaAlive/source/main.cpp"
          git commit -m "Improve download dialogs, ETA and cancellation"
          git push origin main
          git rm .github/workflows/apply_download_ui_improvements.yml
          git commit -m "Remove temporary download UI patch workflow"
          git push origin main
