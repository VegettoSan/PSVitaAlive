name: Apply download UI improvements
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_download_ui.py
      - name: Commit and clean up
        run: |
          git config user.name "PSVitaAlive Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Client PSVitaAlive/source/network/download_manager.cpp" "Client PSVitaAlive/source/installer/install_controller.cpp" "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" "Client PSVitaAlive/source/main.cpp"
          git commit -m "Improve download dialogs, ETA and cancellation"
          git push origin main
          git rm .github/patch_download_ui.py .github/workflows/apply_download_ui_improvements.yml
          git commit -m "Remove temporary download UI patch files"
          git push origin main
