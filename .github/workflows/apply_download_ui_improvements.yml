name: Apply download UI improvements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('Client PSVitaAlive')

          def replace_function(text, signature, replacement):
              start = text.find(signature)
              if start < 0:
                  raise RuntimeError(f'function not found: {signature}')
              brace = text.find('{', start)
              if brace < 0:
                  raise RuntimeError(f'opening brace not found: {signature}')
              depth = 0
              i = brace
              in_str = False
              esc = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i+1 < len(text) else ''
                  if in_line_comment:
                      if c == '\n': in_line_comment = False
                  elif in_block_comment:
                      if c == '*' and n == '/':
                          in_block_comment = False; i += 1
                  elif in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == '"': in_str = False
                  elif in_char:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == "'": in_char = False
                  else:
                      if c == '/' and n == '/': in_line_comment = True; i += 1
                      elif c == '/' and n == '*': in_block_comment = True; i += 1
                      elif c == '"': in_str = True
                      elif c == "'": in_char = True
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return text[:start] + replacement + text[i+1:]
                  i += 1
              raise RuntimeError(f'unclosed function: {signature}')

          def add_once(text, marker, addition):
              if addition in text:
                  return text
              p = text.find(marker)
              if p < 0:
                  raise RuntimeError(f'marker not found: {marker}')
              return text[:p] + addition + text[p:]

          p = root / 'source/network/download_manager.cpp'
          s = p.read_text()
          old = '''void DownloadManager::cancel(const std::string& jobId) {
              if (auto* j = findJob(jobId)) {
                  j->cancelRequested = true;
                  if (j->state == DownloadState::Queued) {
                      j->state = DownloadState::Cancelled;
                      saveMetadata(*j);
                  }
              }
          }'''
          new = '''void DownloadManager::cancel(const std::string& jobId) {
              if (auto* j = findJob(jobId)) {
                  j->cancelRequested = true;
                  StorageManager st;
                  if (j->state == DownloadState::Queued) {
                      st.removeFile(j->temporaryPath);
                      j->state = DownloadState::Cancelled;
                      j->lastError = "cancelled";
                      saveMetadata(*j);
                  }
              }
          }'''
          if old not in s: raise RuntimeError('DownloadManager::cancel block mismatch')
          s = s.replace(old, new, 1)
          old = '''    if (hr == HttpResult::Cancelled || job.cancelRequested) {
              job.state = DownloadState::Cancelled;
              job.lastError = "cancelled";
              saveMetadata(job);
              return false;
          }'''
          new = '''    if (hr == HttpResult::Cancelled || job.cancelRequested) {
              st.removeFile(job.temporaryPath);
              job.downloadedSize = 0;
              job.state = DownloadState::Cancelled;
              job.lastError = "cancelled";
              saveMetadata(job);
              return false;
          }'''
          if old not in s: raise RuntimeError('DownloadManager cancellation block mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = root / 'source/installer/install_controller.cpp'
          s = p.read_text()
          marker = 'bool InstallController::busy() const {'
          addition = '''void InstallController::cancel() {
              const auto currentState = static_cast<InstallStatus::State>(state_.load());
              if (currentState != InstallStatus::State::Downloading || activeJobId_.empty()) return;
              downloads_.cancel(activeJobId_);
              setStage("Cancelling");
              setState(InstallStatus::State::Downloading, "Cancelling download...");
              diagnostics::log(std::string("[Installer] cancel requested job=") + activeJobId_);
          }

          '''
          s = add_once(s, marker, addition)
          old = '''    if (!downloaded || !job || job->state != DownloadState::Completed) {
              const std::string error = job && !job->lastError.empty() ? job->lastError : "Download failed";
              setStage("Error");
              setState(InstallStatus::State::Failed, error.c_str());
              diagnostics::log(std::string("[Installer] download failed: ") + error);
              if (!activeJobId_.empty()) downloads_.cleanupCompletedJob(activeJobId_);
              activeJobId_.clear();
              sceKernelDelayThread(2500 * 1000);
              setState(InstallStatus::State::Idle, "Ready");
              workerDone_.store(true);
              return 0;
          }'''
          new = '''    if (!downloaded || !job || job->state != DownloadState::Completed) {
              const bool cancelled = job && job->state == DownloadState::Cancelled;
              const std::string error = cancelled ? "Download cancelled" : (job && !job->lastError.empty() ? job->lastError : "Download failed");
              setStage(cancelled ? "Cancelled" : "Error");
              setState(InstallStatus::State::Failed, error.c_str());
              diagnostics::log(std::string("[Installer] ") + (cancelled ? "download cancelled" : "download failed") + ": " + error);
              if (!activeJobId_.empty()) downloads_.cleanupCompletedJob(activeJobId_);
              activeJobId_.clear();
              sceKernelDelayThread(cancelled ? 700 * 1000 : 2500 * 1000);
              setState(InstallStatus::State::Idle, "Ready");
              workerDone_.store(true);
              return 0;
          }'''
          if old not in s: raise RuntimeError('InstallController worker cancellation block mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = root / 'source/ui/full_catalog_screen.cpp'
          s = p.read_text()
          marker = 'FullCatalogScreen::FullCatalogScreen()=default;'
          helper = 'std::string formatEta(uint64_t seconds){if(seconds==0)return "--";uint64_t h=seconds/3600,m=(seconds%3600)/60,sec=seconds%60;char o[64];if(h)sceClibSnprintf(o,sizeof(o),"%llu:%02llu:%02llu",(unsigned long long)h,(unsigned long long)m,(unsigned long long)sec);else sceClibSnprintf(o,sizeof(o),"%02llu:%02llu",(unsigned long long)m,(unsigned long long)sec);return o;}\n'
          if 'std::string formatEta(uint64_t seconds)' not in s:
              pos = s.find(marker)
              if pos < 0: raise RuntimeError('FullCatalogScreen constructor marker not found')
              s = s[:pos] + helper + s[pos:]
          setter = 'void FullCatalogScreen::setInstallCancelCallback(InstallCancelFn c){installCancel_=std::move(c);}'
          if setter not in s:
              s = s.replace('void FullCatalogScreen::setCatalogChangeCallback', setter + 'void FullCatalogScreen::setCatalogChangeCallback', 1)

          overlay = '''void FullCatalogScreen::drawLoadingOverlay(){
              const int w=620,h=350,x=(SCREEN_W-w)/2,y=(SCREEN_H-h)/2;
              vita2d_draw_rectangle(0,0,SCREEN_W,SCREEN_H,RGBA8(0,0,0,110));
              vita2d_draw_rectangle(x,y,w,h,PANEL);
              vita2d_draw_rectangle(x,y,w,2,ACCENT);
              vita2d_draw_rectangle(x,y+2,2,h-4,ACCENT);
              vita2d_draw_rectangle(x+w-2,y+2,2,h-4,BORDER);
              vita2d_draw_rectangle(x,y+h-2,w,2,BORDER);
              if(catalogLoading_){
                  vita2d_pgf_draw_text(font_,x+28,y+36,ACCENT,.68f,"PSVitaAlive");
                  vita2d_pgf_draw_text(font_,x+28,y+76,WHITE,1.00f,catalogLoadingLabel_.empty()?"Loading catalog":catalogLoadingLabel_.c_str());
                  vita2d_pgf_draw_text(font_,x+28,y+108,TEXT,.60f,catalogLoadingMessage_.empty()?"Preparing...":catalogLoadingMessage_.c_str());
                  uint64_t pct=catalogLoadingTotal_?std::min<uint64_t>(100,(catalogLoadingCurrent_*100)/catalogLoadingTotal_):0;
                  int bx=x+28,by=y+140,bw=w-56,bh=12;
                  vita2d_draw_rectangle(bx,by,bw,bh,BORDER);vita2d_draw_rectangle(bx,by,bw*(int)pct/100,bh,ACCENT);
                  char st[160];sceClibSnprintf(st,sizeof(st),"%llu%%  %llu / %llu",(unsigned long long)pct,(unsigned long long)catalogLoadingCurrent_,(unsigned long long)catalogLoadingTotal_);
                  vita2d_pgf_draw_text(font_,x+28,y+168,TEXT,.58f,st);
                  return;
              }
              vita2d_pgf_draw_text(font_,x+28,y+36,ACCENT,.68f,"PSVitaAlive");
              const bool downloading=installProgressStage_=="Downloading"||installProgressStage_=="Cancelling"||installProgressStage_.empty();
              vita2d_pgf_draw_text(font_,x+28,y+76,WHITE,1.00f,downloading?"Downloading":"Installing");
              std::string file=installProgressFile_.empty()?"Preparing...":ellipsize(installProgressFile_,72);
              vita2d_pgf_draw_text(font_,x+28,y+108,TEXT,.62f,file.c_str());
              const uint64_t total=installProgressTotal_,current=std::min<uint64_t>(installProgressCurrent_,total?total:installProgressCurrent_);
              const uint64_t pct=total?std::min<uint64_t>(100,(current*100)/total):0;
              int bx=x+28,by=y+140,bw=w-56,bh=12;
              vita2d_draw_rectangle(bx,by,bw,bh,BORDER);vita2d_draw_rectangle(bx,by,bw*(int)pct/100,bh,ACCENT);
              char stats[220];sceClibSnprintf(stats,sizeof(stats),"%llu%%  %s / %s  •  %s/s",(unsigned long long)pct,formatBytes(current).c_str(),total?formatBytes(total).c_str():"?",formatBytes(installProgressSpeed_).c_str());
              vita2d_pgf_draw_text(font_,x+28,y+168,TEXT,.58f,stats);
              uint64_t eta=0;if(installProgressSpeed_>0&&total>current)eta=(total-current)/installProgressSpeed_;
              char info[180];sceClibSnprintf(info,sizeof(info),"File: 1 / 1   ETA: %s",formatEta(eta).c_str());
              vita2d_pgf_draw_text(font_,x+28,y+194,ACCENT,.62f,info);
              if(!installProgressMessage_.empty())vita2d_pgf_draw_text(font_,x+28,y+222,DIM,.54f,ellipsize(installProgressMessage_,82).c_str());
              const int by2=y+268,bw2=330,bh2=40;
              vita2d_draw_rectangle(x+28,by2,bw2,bh2,SURFACE2);vita2d_draw_rectangle(x+28,by2,bw2,1,BORDER);
              vita2d_pgf_draw_text(font_,x+92,by2+26,WHITE,.62f,"CIRCLE  CANCEL DOWNLOAD");
              vita2d_pgf_draw_text(font_,x+28,y+h-14,DIM,.50f,"Circle: Cancel download and remove incomplete file");
          }'''
          s = replace_function(s, 'void FullCatalogScreen::drawLoadingOverlay()', overlay)
          marker = 'if(catalogLoading_||installProgressActive_)return;'
          insertion = 'if(installProgressActive_ && (pressed&SCE_CTRL_CIRCLE)){if(installCancel_)installCancel_();return;}\n    '
          if insertion.strip() not in s:
              if marker not in s: raise RuntimeError('input cancellation marker not found')
              s = s.replace(marker, insertion + marker, 1)
          p.write_text(s)

          p = root / 'source/main.cpp'
          s = p.read_text()
          prompt = '''bool promptDownloadAllImages(size_t totalImages){
              vita2d_wait_rendering_done();
              vita2d_pgf* font=vita2d_load_default_pgf();
              if(!font){psvitaalive::diagnostics::log("[Startup] custom image prompt font load failed; defaulting to on-demand mode");return false;}
              bool yes=false,done=false;int selected=0;uint32_t prev=0;
              while(!done){
                  SceCtrlData pad={};sceCtrlPeekBufferPositive(0,&pad,1);
                  const uint32_t pressed=pad.buttons&~prev;prev=pad.buttons;
                  if(pressed&SCE_CTRL_LEFT)selected=0;
                  if(pressed&SCE_CTRL_RIGHT)selected=1;
                  if(pressed&SCE_CTRL_CROSS){yes=selected==0;done=true;}
                  if(pressed&SCE_CTRL_CIRCLE){yes=false;done=true;}
                  vita2d_start_drawing();vita2d_clear_screen();
                  const unsigned SURFACE=RGBA8(0x37,0x37,0x37,255),BORDER=RGBA8(0x6E,0x6E,0x6E,255),TEXT=RGBA8(0xAA,0xAA,0xAA,255),DIM=RGBA8(0x6E,0x6E,0x6E,255),ACCENT=RGBA8(0x3B,0xFF,0,255),WHITE=RGBA8(255,255,255,255),BLACK=RGBA8(0,0,0,255),PANEL=RGBA8(0x20,0x20,0x20,255);
                  const int w=620,h=360,x=(960-w)/2,y=(544-h)/2;
                  vita2d_draw_rectangle(0,0,960,544,RGBA8(0x18,0x18,0x18,255));vita2d_draw_rectangle(0,0,960,544,RGBA8(0,0,0,70));
                  vita2d_draw_rectangle(x,y,w,h,PANEL);vita2d_draw_rectangle(x,y,w,2,ACCENT);vita2d_draw_rectangle(x,y+2,2,h-4,ACCENT);vita2d_draw_rectangle(x+w-2,y+2,2,h-4,BORDER);vita2d_draw_rectangle(x,y+h-2,w,2,BORDER);
                  vita2d_pgf_draw_text(font,x+28,y+36,ACCENT,.68f,"PSVitaAlive");
                  vita2d_pgf_draw_text(font,x+28,y+78,WHITE,1.02f,"Download catalog images?");
                  vita2d_pgf_draw_text(font,x+28,y+108,TEXT,.58f,"Images are downloaded once and kept in the local cache.");
                  vita2d_pgf_draw_text(font,x+28,y+130,DIM,.54f,"This can take a very long time and use network data.");
                  char count[96]={};sceClibSnprintf(count,sizeof(count),"Pending images: %u",(unsigned)totalImages);
                  vita2d_pgf_draw_text(font,x+28,y+160,ACCENT,.68f,count);
                  vita2d_pgf_draw_text(font,x+28,y+190,TEXT,.54f,"Already cached images are excluded from this count.");
                  vita2d_pgf_draw_text(font,x+28,y+212,TEXT,.54f,"Total size is calculated while downloading.");
                  vita2d_pgf_draw_text(font,x+28,y+234,TEXT,.54f,"Speed, ETA and overall progress appear in the next panel.");
                  const int by=y+266,bw=220,bh=38;
                  vita2d_draw_rectangle(x+58,by,bw,bh,selected==0?ACCENT:SURFACE);vita2d_draw_rectangle(x+58,by,bw,1,selected==0?ACCENT:BORDER);vita2d_draw_rectangle(x+342,by,bw,bh,selected==1?ACCENT:SURFACE);vita2d_draw_rectangle(x+342,by,bw,1,selected==1?ACCENT:BORDER);
                  vita2d_pgf_draw_text(font,x+125,by+25,selected==0?BLACK:WHITE,.62f,"DOWNLOAD ALL");vita2d_pgf_draw_text(font,x+425,by+25,selected==1?BLACK:WHITE,.62f,"LATER");
                  vita2d_pgf_draw_text(font,x+28,y+h-14,DIM,.52f,"Left/Right: Select    Cross: Confirm    Circle: Later");
                  vita2d_end_drawing();vita2d_swap_buffers();sceKernelDelayThread(16*1000);
              }
              vita2d_wait_rendering_done();vita2d_free_pgf(font);
              psvitaalive::diagnostics::log(std::string("[Startup] image warmup choice=")+(yes?"ALL":"ON_DEMAND"));return yes;
          }'''
          s = replace_function(s, 'bool promptDownloadAllImages(size_t totalImages)', prompt)

          warmup = '''bool runImageWarmup(std::vector<StartupImageJob>&jobs,psvitaalive::ui::ImageCache&images){
              if(jobs.empty())return true;
              images.cancelAll();while(images.progress().active)sceKernelDelayThread(10*1000);images.resetProgress();
              vita2d_pgf* font=vita2d_load_default_pgf();if(!font){images.cancelAll();return false;}
              const unsigned BORDER=RGBA8(0x6E,0x6E,0x6E,255),TEXT=RGBA8(0xAA,0xAA,0xAA,255),DIM=RGBA8(0x6E,0x6E,0x6E,255),ACCENT=RGBA8(0x3B,0xFF,0,255),WHITE=RGBA8(255,255,255,255),PANEL=RGBA8(0x20,0x20,0x20,255),SURFACE2=RGBA8(0x2A,0x2A,0x2A,255);
              const int w=620,h=350,x=(960-w)/2,y=(544-h)/2;
              auto drawPanel=[&](const char*title,const std::string&file,uint64_t completed,uint64_t totalFiles,uint64_t currentPct,uint64_t speed,uint64_t eta,const std::string&message,bool cancelling){
                  vita2d_start_drawing();vita2d_clear_screen();
                  vita2d_draw_rectangle(0,0,960,544,RGBA8(0x18,0x18,0x18,255));vita2d_draw_rectangle(0,0,960,544,RGBA8(0,0,0,70));
                  vita2d_draw_rectangle(x,y,w,h,PANEL);vita2d_draw_rectangle(x,y,w,2,ACCENT);vita2d_draw_rectangle(x,y+2,2,h-4,ACCENT);vita2d_draw_rectangle(x+w-2,y+2,2,h-4,BORDER);vita2d_draw_rectangle(x,y+h-2,w,2,BORDER);
                  vita2d_pgf_draw_text(font,x+28,y+36,ACCENT,.68f,"PSVitaAlive");vita2d_pgf_draw_text(font,x+28,y+76,WHITE,1.00f,title);
                  if(!file.empty())vita2d_pgf_draw_text(font,x+28,y+108,TEXT,.62f,twoLineFileName(file).c_str());
                  uint64_t pct=0;if(totalFiles>0){uint64_t base=std::min<uint64_t>(100,completed*100/totalFiles);uint64_t slice=std::min<uint64_t>(100,currentPct)/totalFiles;pct=std::min<uint64_t>(100,base+slice);if(completed>=totalFiles)pct=100;}
                  int bx=x+28,by=y+140,bw=w-56,bh=12;vita2d_draw_rectangle(bx,by,bw,bh,BORDER);vita2d_draw_rectangle(bx,by,bw*(int)pct/100,bh,ACCENT);
                  char stats[220];sceClibSnprintf(stats,sizeof(stats),"%llu%%   Files: %llu / %llu   •   %s/s",(unsigned long long)pct,(unsigned long long)completed,(unsigned long long)totalFiles,formatBytes(speed).c_str());vita2d_pgf_draw_text(font,x+28,y+168,TEXT,.56f,stats);
                  char etaText[100];sceClibSnprintf(etaText,sizeof(etaText),"ETA: %s",formatEta(eta).c_str());vita2d_pgf_draw_text(font,x+28,y+194,ACCENT,.62f,etaText);
                  if(!message.empty())vita2d_pgf_draw_text(font,x+28,y+220,DIM,.54f,ellipsize(message,82).c_str());
                  const int by2=y+268,bw2=390,bh2=40;vita2d_draw_rectangle(x+28,by2,bw2,bh2,SURFACE2);vita2d_draw_rectangle(x+28,by2,bw2,1,BORDER);vita2d_pgf_draw_text(font,x+98,by2+26,WHITE,.62f,cancelling?"CIRCLE  CANCELLING":"CIRCLE  CANCEL DOWNLOAD");
                  vita2d_pgf_draw_text(font,x+28,y+h-14,DIM,.50f,cancelling?"Stopping active download and removing incomplete file...":"Circle: Cancel download and remove incomplete files");
                  vita2d_end_drawing();vita2d_swap_buffers();
              };
              for(size_t i=0;i<jobs.size();++i){
                  jobs[i].path=images.request(jobs[i].url,jobs[i].namespaceName);
                  if((i%8)==0||i+1==jobs.size()){drawPanel("Preparing image downloads",jobs[i].fileName,0,jobs.size(),0,0,0,"Preparing download queue...",false);sceKernelDelayThread(16*1000);}
              }
              bool cancelling=false;
              while(true){
                  uint64_t completed=0;std::string currentFile;bool failedCurrent=false;imageWarmupProgress(jobs,images,completed,currentFile,failedCurrent);
                  const auto p=images.progress();
                  if(completed>=jobs.size()&&!p.active)break;
                  SceCtrlData pad={};sceCtrlPeekBufferPositive(0,&pad,1);
                  if((pad.buttons&SCE_CTRL_CIRCLE)&&!cancelling){cancelling=true;images.cancelAll();}
                  if(cancelling){drawPanel("Cancelling image downloads",p.fileName.empty()?currentFile:p.fileName,completed,jobs.size(),0,p.speed,0,"Cancelling...",true);if(!images.progress().active)break;sceKernelDelayThread(16*1000);continue;}
                  uint64_t currentPct=p.total?std::min<uint64_t>(100,(p.downloaded*100)/p.total):0;uint64_t speed=p.speed;uint64_t eta=0;
                  if(speed>0){uint64_t completedBytes=p.completedBytes;uint64_t avg=completed?completedBytes/completed:(p.total?p.total:0);uint64_t futureFiles=jobs.size()>completed+(p.active?1:0)?jobs.size()-completed-(p.active?1:0):0;uint64_t remaining=(p.total>p.downloaded?p.total-p.downloaded:0)+avg*futureFiles;eta=remaining/speed;}
                  drawPanel("Downloading Images",p.fileName.empty()?currentFile:p.fileName,completed,jobs.size(),currentPct,speed,eta,"Downloading image cache...",false);sceKernelDelayThread(16*1000);
              }
              vita2d_wait_rendering_done();vita2d_free_pgf(font);if(cancelling){psvitaalive::diagnostics::log("[Startup] image warmup cancelled");return false;}psvitaalive::diagnostics::log("[Startup] image warmup completed");return true;
          }'''
          s = replace_function(s, 'bool runImageWarmup(std::vector<StartupImageJob>&jobs,psvitaalive::ui::ImageCache&images)', warmup)

          if 'setInstallCancelCallback' not in s:
              m = re.search(r'(\b[A-Za-z_][A-Za-z0-9_]*)\.setInstallCallbacks\((.*?)\);', s, re.S)
              if not m: raise RuntimeError('Could not find setInstallCallbacks call in main.cpp')
              screen_obj = m.group(1)
              ctrls = re.findall(r'InstallController\s+([A-Za-z_][A-Za-z0-9_]*)', s)
              if not ctrls: raise RuntimeError('Could not find InstallController variable in main.cpp')
              controller = ctrls[0]
              insertion = f'\n    {screen_obj}.setInstallCancelCallback([&{controller}](){{ {controller}.cancel(); }});'
              s = s[:m.end()] + insertion + s[m.end():]
          p.write_text(s)
          print('Patch completed successfully')
          PY

          git config user.name "PSVitaAlive Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Client PSVitaAlive/include/installer/install_controller.hpp" "Client PSVitaAlive/include/ui/full_catalog_screen.hpp" "Client PSVitaAlive/source/network/download_manager.cpp" "Client PSVitaAlive/source/installer/install_controller.cpp" "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" "Client PSVitaAlive/source/main.cpp"
          git commit -m "Improve download dialogs, ETA and cancellation"
          git push origin main
          git rm .github/workflows/apply_download_ui_improvements.yml
          git commit -m "Remove temporary download UI patch workflow"
          git push origin main
