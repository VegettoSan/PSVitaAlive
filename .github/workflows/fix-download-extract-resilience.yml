name: Fix download extract resilience
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # --- http_client: archive.org timeouts + more attempts + Referer ---
          hc = Path('Client PSVitaAlive/source/network/http_client.cpp')
          t = hc.read_text(encoding='utf-8')
          if 'CONNECT_TIMEOUT_ARCHIVE_SECONDS' not in t:
              t = t.replace(
                  'constexpr long CONNECT_TIMEOUT_SECONDS = 45;\nconstexpr long LOW_SPEED_LIMIT = 1;\nconstexpr long LOW_SPEED_TIME_SECONDS = 120;',
                  'constexpr long CONNECT_TIMEOUT_SECONDS = 45;\nconstexpr long CONNECT_TIMEOUT_ARCHIVE_SECONDS = 90;\nconstexpr long LOW_SPEED_LIMIT = 1;\nconstexpr long LOW_SPEED_TIME_SECONDS = 120;\nconstexpr long LOW_SPEED_TIME_ARCHIVE_SECONDS = 180;',
                  1)
              t = t.replace(
                  '    headers = curl_slist_append(headers, "Connection: close");\n    curl_easy_setopt(curl, CURLOPT_HTTPHEADER, headers);',
                  '    headers = curl_slist_append(headers, "Connection: close");\n    if (url.find("archive.org") != std::string::npos) {\n        headers = curl_slist_append(headers, "Referer: https://archive.org/");\n    }\n    curl_easy_setopt(curl, CURLOPT_HTTPHEADER, headers);',
                  1)
              t = t.replace(
                  '    constexpr int kMaxAttempts = 4;\n    for (int attempt = 0; attempt < kMaxAttempts; ++attempt) {\n        curl_easy_setopt(curl, CURLOPT_SSLVERSION, sslAttempts[attempt]);',
                  '    if (isArchive) {\n        curl_easy_setopt(curl, CURLOPT_CONNECTTIMEOUT, CONNECT_TIMEOUT_ARCHIVE_SECONDS);\n        curl_easy_setopt(curl, CURLOPT_LOW_SPEED_TIME, LOW_SPEED_TIME_ARCHIVE_SECONDS);\n    }\n    const int kMaxAttempts = isArchive ? 6 : 4;\n    for (int attempt = 0; attempt < kMaxAttempts; ++attempt) {\n        const int sslIdx = attempt < 4 ? attempt : (attempt % 4);\n        curl_easy_setopt(curl, CURLOPT_SSLVERSION, sslAttempts[sslIdx]);',
                  1)
              t = t.replace(
                  '            // Brief pause before retry (network / TLS recovery)\n            sceKernelDelayThread(400 * 1000);',
                  '            int delayMs = isArchive ? (1000 * (attempt <= 5 ? attempt : 5)) : 400;\n            if (delayMs < 400) delayMs = 400;\n            sceKernelDelayThread(delayMs * 1000);',
                  1)
              t = t.replace(
                  '        if (ctx.cancelled) break;\n        if (result == CURLE_OK) break;\n\n        const bool retryable =',
                  '        if (ctx.cancelled) break;\n        if (result == CURLE_OK) {\n            long rc = 0;\n            curl_easy_getinfo(curl, CURLINFO_RESPONSE_CODE, &rc);\n            const bool transientHttp = (rc==429||rc==502||rc==503||rc==504||rc==520||rc==522||rc==524);\n            if (!transientHttp) break;\n            httpDiagnostic("transient HTTP status — retry");\n            if (resumeOffset == 0 && ctx.fd >= 0 && ctx.downloaded > 0) {\n                sceIoClose(ctx.fd);\n                ctx.fd = sceIoOpen(destinationPath.c_str(), SCE_O_WRONLY | SCE_O_CREAT | SCE_O_TRUNC, 0777);\n                ctx.downloaded = 0;\n            }\n            continue;\n        }\n\n        const bool retryable =',
                  1)
              hc.write_text(t, encoding='utf-8')
              print('http_client: patched')
          else:
              print('http_client: skip')

          # --- download_manager: longer archive retry delay + extra outer try ---
          dm = Path('Client PSVitaAlive/source/network/download_manager.cpp')
          t = dm.read_text(encoding='utf-8')
          if 'archive.org second outer retry' not in t:
              t = t.replace(
                  'sceKernelDelayThread(800 * 1000);',
                  'const bool isArchiveUrl = job.url.find("archive.org") != std::string::npos || effectiveUrl.find("archive.org") != std::string::npos;\n        sceKernelDelayThread((isArchiveUrl ? 2500 : 800) * 1000);',
                  1)
              marker = '        hr = http_.downloadToFile(effectiveUrl, job.temporaryPath, offset, progress, cancelFn);\n    }\n    job.lastHttpStatus = http_.lastStatusCode();'
              extra = '''        hr = http_.downloadToFile(effectiveUrl, job.temporaryPath, offset, progress, cancelFn);
        if (hr != HttpResult::Ok && hr != HttpResult::Cancelled && !job.cancelRequested && !sizeLimitHit) {
            const bool isArchiveUrl2 = job.url.find("archive.org") != std::string::npos || effectiveUrl.find("archive.org") != std::string::npos;
            if (isArchiveUrl2) {
                diagnostics::log("[DownloadManager] archive.org second outer retry");
                sceKernelDelayThread(4000 * 1000);
                if (job.downloadedSize == 0) { st.removeFile(job.temporaryPath); offset = 0; }
                else { const int64_t sz = st.fileSize(job.temporaryPath); offset = sz > 0 ? static_cast<uint64_t>(sz) : 0; job.downloadedSize = offset; }
                sizeLimitHit = false; job.cancelRequested = false;
                hr = http_.downloadToFile(effectiveUrl, job.temporaryPath, offset, progress, cancelFn);
            }
        }
    }
    job.lastHttpStatus = http_.lastStatusCode();'''
              if marker not in t:
                  raise SystemExit('dm marker missing')
              t = t.replace(marker, extra, 1)
              dm.write_text(t, encoding='utf-8')
              print('download_manager: patched')
          else:
              print('download_manager: skip')

          # --- homebrew_installer: one extract retry ---
          hi = Path('Client PSVitaAlive/source/installer/homebrew_installer.cpp')
          t = hi.read_text(encoding='utf-8')
          if 'extractAttempt' not in t:
              old = '''    ZipExtractor zip;
    const ZipResult zr = zip.extract(
        vpkPath,
        tmpDir,
        [&](const ZipProgress& zp) {
            if (!onProgress) return;
            InstallProgress p;
            p.stage = InstallProgress::Extracting;
            p.entriesDone = zp.entriesDone;
            p.entriesTotal = zp.entriesTotal;
            p.bytesWritten = zp.bytesWritten;
            p.bytesTotal = zp.bytesTotal;
            p.message = zp.currentEntry;
            onProgress(p);
        },
        shouldCancel
    );

    logLine(std::string("ZipExtractor result=") + std::to_string(static_cast<int>(zr)) + " error=" + zip.lastError());
    if (zr == ZipResult::Cancelled) {
        removeTree(tmpDir);
        setError("extract cancelled");
        return InstallResult::Cancelled;
    }
    if (zr != ZipResult::Ok) {
        removeTree(tmpDir);
        setError(std::string("extract failed: ") + zip.lastError());
        return InstallResult::ExtractFailed;
    }'''
              new = '''    ZipResult zr = ZipResult::IoError;
    std::string zipErr;
    for (int extractAttempt = 0; extractAttempt < 2; ++extractAttempt) {
        if (extractAttempt > 0) {
            logLine(std::string("ZipExtractor retry after: ") + zipErr);
            removeTree(tmpDir);
            if (!st.createDirectories(tmpDir)) {
                setError("cannot recreate VPK promote directory for extract retry");
                return InstallResult::IoError;
            }
            sceKernelDelayThread(500 * 1000);
            if (onProgress) {
                InstallProgress p;
                p.stage = InstallProgress::Extracting;
                p.message = "retrying extract";
                onProgress(p);
            }
        }
        ZipExtractor zip;
        zr = zip.extract(
            vpkPath,
            tmpDir,
            [&](const ZipProgress& zp) {
                if (!onProgress) return;
                InstallProgress p;
                p.stage = InstallProgress::Extracting;
                p.entriesDone = zp.entriesDone;
                p.entriesTotal = zp.entriesTotal;
                p.bytesWritten = zp.bytesWritten;
                p.bytesTotal = zp.bytesTotal;
                p.message = zp.currentEntry;
                onProgress(p);
            },
            shouldCancel
        );
        zipErr = zip.lastError();
        logLine(std::string("ZipExtractor result=") + std::to_string(static_cast<int>(zr)) +
                " attempt=" + std::to_string(extractAttempt + 1) + " error=" + zipErr);
        if (zr == ZipResult::Ok || zr == ZipResult::Cancelled || zr == ZipResult::UnsafePath)
            break;
    }
    if (zr == ZipResult::Cancelled) {
        removeTree(tmpDir);
        setError("extract cancelled");
        return InstallResult::Cancelled;
    }
    if (zr != ZipResult::Ok) {
        removeTree(tmpDir);
        setError(std::string("extract failed: ") + zipErr);
        return InstallResult::ExtractFailed;
    }'''
              if old not in t:
                  raise SystemExit('hi block missing')
              hi.write_text(t.replace(old, new, 1), encoding='utf-8')
              print('homebrew_installer: patched')
          else:
              print('homebrew_installer: skip')
          print('OK')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/source/network/http_client.cpp" \
            "Client PSVitaAlive/source/network/download_manager.cpp" \
            "Client PSVitaAlive/source/installer/homebrew_installer.cpp"
          git status
          git commit -m "fix: Archive.org download retries + extract RAM retry" || echo nochange
          git push
