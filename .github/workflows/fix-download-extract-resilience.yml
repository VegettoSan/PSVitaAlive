name: Fix download extract resilience
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Restore good sources
        run: |
          set -euo pipefail
          GOOD=$(git rev-parse b48a94523862a0c75ea7f2cc990fbeb4c555810d^)
          echo "Restoring from $GOOD"
          git checkout "$GOOD" -- \
            "Client PSVitaAlive/source/network/http_client.cpp" \
            "Client PSVitaAlive/source/network/download_manager.cpp" \
            "Client PSVitaAlive/source/installer/homebrew_installer.cpp"
          for f in \
            "Client PSVitaAlive/source/network/http_client.cpp" \
            "Client PSVitaAlive/source/network/download_manager.cpp" \
            "Client PSVitaAlive/source/installer/homebrew_installer.cpp"; do
            if grep -qE 'PLACEHOLDER|\{\{FILE:' "$f"; then echo "bad $f"; exit 1; fi
            wc -c "$f"
            head -2 "$f"
          done
      - name: Commit and push restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/source/network/http_client.cpp" \
            "Client PSVitaAlive/source/network/download_manager.cpp" \
            "Client PSVitaAlive/source/installer/homebrew_installer.cpp"
          git status
          git commit -m "fix: restore http_client/download_manager/homebrew_installer after bad push" || echo nochange
          git push
