name: Fix download extract resilience
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply resilience patches
        run: python3 scripts/apply_download_resilience.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/source/network/http_client.cpp" \
            "Client PSVitaAlive/source/network/download_manager.cpp" \
            "Client PSVitaAlive/source/installer/homebrew_installer.cpp"
          git status
          git commit -m "fix: Archive.org download retries + extract RAM retry" || echo nochange
          git push
