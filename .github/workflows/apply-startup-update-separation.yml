name: Apply startup update separation

on:
  push:
    branches: [main]
    paths:
      - '.tmp/apply-startup-update-separation'
      - 'scripts/_tmp_apply_startup_update.py'
      - '.github/workflows/apply-startup-update-separation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply transformation and publish to main
        run: |
          set -euo pipefail
          test -f .tmp/apply-startup-update-separation
          python scripts/_tmp_apply_startup_update.py
          rm -f .tmp/apply-startup-update-separation
          rm -f scripts/_tmp_apply_startup_update.py
          rm -f .github/workflows/apply-startup-update-separation.yml
          rm -f .github/workflows/_tmp_vita_install_probe_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/main.cpp' 'Client PSVitaAlive/source/catalog/catalog_manager.cpp' 'Client PSVitaAlive/include/catalog/catalog_manager.hpp' 'Client PSVitaAlive/include/update/startup_update_manager.hpp' 'Client PSVitaAlive/source/update/startup_update_manager.cpp' 'Client PSVitaAlive/CMakeLists.txt' .tmp/apply-startup-update-separation scripts/_tmp_apply_startup_update.py .github/workflows/apply-startup-update-separation.yml .github/workflows/_tmp_vita_install_probe_fix.yml
          git commit -m 'client: separate startup update from catalog manager'
          git push origin HEAD:main
