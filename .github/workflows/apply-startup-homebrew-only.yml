name: Apply Homebrew-only startup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_startup_homebrew_only.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/source/catalog/catalog_manager.cpp" \
            "Client PSVitaAlive/source/network/http_client.cpp" \
            "Client PSVitaAlive/source/main.cpp"
          git commit -m "fix(startup): Homebrew only; cache-first catalogs; GitHub 60s timeout" || echo nochange
          git push
