name: Apply Archive fastest-node patch

on:
  push:
    branches: [feature/archive-fastest-node]
    paths:
      - ".github/workflows/apply-archive-fastest-node.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/archive-fastest-node
          fetch-depth: 0

      - name: Apply implementation and documentation
        run: python3 scripts/apply_archive_fastest_node.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q "rankArchiveAlternateUrls" "Client PSVitaAlive/source/network/http_client.cpp"
          grep -q "archive selector start" "Client PSVitaAlive/source/network/http_client.cpp"
          grep -q "Proactive node selection for fresh payloads" docs/NETWORK_TLS.md
          grep -q "256 KiB probe per candidate" docs/DOWNLOAD_RESILIENCE.md

      - name: Remove one-shot migration files
        run: |
          rm -f scripts/apply_archive_fastest_node.py
          rm -f .github/workflows/apply-archive-fastest-node.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: select fastest Internet Archive storage node"
          git push origin HEAD:feature/archive-fastest-node
