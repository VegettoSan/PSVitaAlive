name: Apply mono theme art
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy -q
      - run: python3 scripts/apply_mono_theme_art.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "VegettoSanDev"
          git config user.email "72358120+VegettoSan@users.noreply.github.com"
          git add \
            "Client PSVitaAlive/assets/ui/PSVitaAlive_Store_logo_text_mono.png" \
            "Client PSVitaAlive/assets/ui/catalog_loading_mono.png" \
            "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" \
            "Client PSVitaAlive/include/ui/full_catalog_screen.hpp"
          if git diff --staged --quiet; then echo "No changes"; exit 1; fi
          git commit -m "ui: mono logo/splash art tinted by non-brand color themes"
          git push origin HEAD:main
