name: Temporary image memory fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch image normalization for app covers
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Client PSVitaAlive/source/ui/image_cache.cpp')
          s = p.read_text()
          old = 'bool normalizePngForVita(const std::string&path){png_image image{};image.version=PNG_IMAGE_VERSION;if(!png_image_begin_read_from_file(&image,path.c_str()))return false;if(image.width==0||image.height==0||image.width>2048||image.height>2048){png_image_free(&image);return false;}image.format=PNG_FORMAT_RGBA;size_t bytes=PNG_IMAGE_SIZE(image);if(bytes==0){png_image_free(&image);return false;}std::vector<unsigned char>pixels(bytes);if(!png_image_finish_read(&image,nullptr,pixels.data(),0,nullptr)){png_image_free(&image);return false;}std::string temp=path+".normalized";png_image output{};output.version=PNG_IMAGE_VERSION;output.width=image.width;output.height=image.height;output.format=PNG_FORMAT_RGBA;if(!png_image_write_to_file(&output,temp.c_str(),0,pixels.data(),0,nullptr)){png_image_free(&image);png_image_free(&output);sceIoRemove(temp.c_str());return false;}png_image_free(&image);png_image_free(&output);sceIoRemove(path.c_str());if(sceIoRename(temp.c_str(),path.c_str())<0){sceIoRemove(temp.c_str());return false;}return true;}'
          new = '''bool normalizePngForVita(const std::string&path,unsigned maxDim){png_image image{};image.version=PNG_IMAGE_VERSION;if(!png_image_begin_read_from_file(&image,path.c_str()))return false;if(image.width==0||image.height==0||image.width>2048||image.height>2048){png_image_free(&image);return false;}image.format=PNG_FORMAT_RGBA;size_t bytes=PNG_IMAGE_SIZE(image);if(bytes==0){png_image_free(&image);return false;}std::vector<unsigned char>pixels(bytes);if(!png_image_finish_read(&image,nullptr,pixels.data(),0,nullptr)){png_image_free(&image);return false;}unsigned srcW=image.width,srcH=image.height,dstW=srcW,dstH=srcH;if(maxDim>0&&(srcW>maxDim||srcH>maxDim)){double scale=std::min((double)maxDim/(double)srcW,(double)maxDim/(double)srcH);dstW=std::max(1u,(unsigned)(srcW*scale+0.5));dstH=std::max(1u,(unsigned)(srcH*scale+0.5));}std::vector<unsigned char>outPixels((size_t)dstW*dstH*4);for(unsigned y=0;y<dstH;++y){unsigned sy=(unsigned)((uint64_t)y*srcH/dstH);for(unsigned x=0;x<dstW;++x){unsigned sx=(unsigned)((uint64_t)x*srcW/dstW);const unsigned char*src=&pixels[((size_t)sy*srcW+sx)*4];unsigned char*dst=&outPixels[((size_t)y*dstW+x)*4];dst[0]=src[0];dst[1]=src[1];dst[2]=src[2];dst[3]=src[3];}}std::string temp=path+".normalized";png_image output{};output.version=PNG_IMAGE_VERSION;output.width=dstW;output.height=dstH;output.format=PNG_FORMAT_RGBA;if(!png_image_write_to_file(&output,temp.c_str(),0,outPixels.data(),0,nullptr)){png_image_free(&image);png_image_free(&output);sceIoRemove(temp.c_str());return false;}png_image_free(&image);png_image_free(&output);sceIoRemove(path.c_str());if(sceIoRename(temp.c_str(),path.c_str())<0){sceIoRemove(temp.c_str());return false;}return true;}'''
          if old not in s: raise SystemExit('PNG normalization pattern not found')
          s = s.replace(old, new, 1)
          old = 'bool normalizeJpegForVita(const std::string&path){'
          if old not in s: raise SystemExit('JPEG signature pattern not found')
          s = s.replace(old, 'bool normalizeJpegForVita(const std::string&path,unsigned maxDim){', 1)
          old = 'unsigned w=cinfo.output_width,h=cinfo.output_height;jpeg_finish_decompress(&cinfo);jpeg_destroy_decompress(&cinfo);std::fclose(in);std::string temp=path+".normalized";png_image out{};out.version=PNG_IMAGE_VERSION;out.width=w;out.height=h;out.format=PNG_FORMAT_RGB;if(!png_image_write_to_file(&out,temp.c_str(),0,pixels.data(),0,nullptr)){sceIoRemove(temp.c_str());return false;}'
          new = '''unsigned w=cinfo.output_width,h=cinfo.output_height;jpeg_finish_decompress(&cinfo);jpeg_destroy_decompress(&cinfo);std::fclose(in);unsigned dw=w,dh=h;if(maxDim>0&&(w>maxDim||h>maxDim)){double scale=std::min((double)maxDim/(double)w,(double)maxDim/(double)h);dw=std::max(1u,(unsigned)(w*scale+0.5));dh=std::max(1u,(unsigned)(h*scale+0.5));}std::vector<unsigned char>outPixels((size_t)dw*dh*3);for(unsigned y=0;y<dh;++y){unsigned sy=(unsigned)((uint64_t)y*h/dh);for(unsigned x=0;x<dw;++x){unsigned sx=(unsigned)((uint64_t)x*w/dw);const unsigned char*src=&pixels[((size_t)sy*w+sx)*3];unsigned char*dst=&outPixels[((size_t)y*dw+x)*3];dst[0]=src[0];dst[1]=src[1];dst[2]=src[2];}}std::string temp=path+".normalized";png_image out{};out.version=PNG_IMAGE_VERSION;out.width=dw;out.height=dh;out.format=PNG_FORMAT_RGB;if(!png_image_write_to_file(&out,temp.c_str(),0,outPixels.data(),0,nullptr)){sceIoRemove(temp.c_str());return false;}'''
          if old not in s: raise SystemExit('JPEG body pattern not found')
          s = s.replace(old, new, 1)
          old = 'bool normalizeImageForVita(const std::string&path){unsigned char magic[12]={};if(!readMagic(path,magic,sizeof(magic)))return false;bool png=magic[0]==0x89&&magic[1]==0x50&&magic[2]==0x4E&&magic[3]==0x47&&magic[4]==0x0D&&magic[5]==0x0A&&magic[6]==0x1A&&magic[7]==0x0A;bool jpg=magic[0]==0xFF&&magic[1]==0xD8&&magic[2]==0xFF;if(png)return normalizePngForVita(path);if(jpg)return normalizeJpegForVita(path);return false;}'
          new = 'bool normalizeImageForVita(const std::string&path,unsigned maxDim){unsigned char magic[12]={};if(!readMagic(path,magic,sizeof(magic)))return false;bool png=magic[0]==0x89&&magic[1]==0x50&&magic[2]==0x4E&&magic[3]==0x47&&magic[4]==0x0D&&magic[5]==0x0A&&magic[6]==0x1A&&magic[7]==0x0A;bool jpg=magic[0]==0xFF&&magic[1]==0xD8&&magic[2]==0xFF;if(png)return normalizePngForVita(path,maxDim);if(jpg)return normalizeJpegForVita(path,maxDim);return false;}'
          if old not in s: raise SystemExit('normalize dispatcher pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('bool validCached=normalizeImageForVita(path);', 'bool validCached=normalizeImageForVita(path,ns=="app"?512u:2048u);', 1)
          s = s.replace('valid=normalizeImageForVita(job.path);', 'valid=normalizeImageForVita(job.path,job.path.find("/app_")!=std::string::npos?512u:2048u);', 1)
          p.write_text(s)
          PY
      - name: Commit patched image pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Client PSVitaAlive/source/ui/image_cache.cpp'
          git diff --cached --quiet && exit 0
          git commit -m "fix: downsample large app cover images [skip ci]"
          git push origin HEAD:main
