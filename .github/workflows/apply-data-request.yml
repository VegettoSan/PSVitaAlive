name: Apply data request feature
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress patch and apply
        run: |
          set -e
          python3 - <<'PY'
          import base64, zlib, pathlib
          b64 = pathlib.Path('scripts/patch_data_request.zlib.b64').read_text().strip()
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('scripts/patch_data_request.py').write_bytes(data)
          print('wrote patch', len(data))
          PY
          python3 scripts/patch_data_request.py
          grep -q 'Request data' "Client PSVitaAlive/source/ui/full_catalog_screen.cpp"
          grep -q 'pollDataRequestWorker();' "Client PSVitaAlive/source/ui/full_catalog_screen.cpp"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Client PSVitaAlive/include/ui/full_catalog_screen.hpp" "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" scripts/patch_data_request.py
          git commit -m "feat(ui): Request Data/Game Files button + Discord webhook" || echo nochange
          git push
