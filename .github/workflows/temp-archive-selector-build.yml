name: Temporary Archive selector compile check

on:
  push:
    branches: [feature/archive-fastest-node]
    paths:
      - ".github/workflows/temp-archive-selector-build.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with matching VitaSDK network ABI
        shell: bash
        run: |
          set -euo pipefail
          docker pull vitasdk/vitasdk:2026.08
          docker run --rm \
            -v "$PWD:/workspace" \
            -w "/workspace/Client PSVitaAlive" \
            vitasdk/vitasdk:2026.08 \
            bash -lc '
              set -euo pipefail
              echo "VITASDK=$VITASDK"
              VDPM="$VITASDK/bin/vdpm"
              test -x "$VDPM"

              # curl/libzip in this image target the legacy Vita OpenSSL ABI.
              "$VDPM" pacman -- -Rdd --noconfirm openssl-1.1.1 || true
              VDPM_NONINTERACTIVE=1 "$VDPM" install openssl
              "$VDPM" info openssl || true
              "$VDPM" info curl || true
              "$VDPM" info libzip || true

              # The project already links pthread explicitly; do not inject it a
              # second time through CMAKE_EXE_LINKER_FLAGS in this validation run.
              cmake -S . -B build-selector-ci -DCMAKE_BUILD_TYPE=Release
              cmake --build build-selector-ci --parallel 2
              test -s build-selector-ci/PSVitaAlive.vpk
              ls -lh build-selector-ci/PSVitaAlive.vpk
            '
