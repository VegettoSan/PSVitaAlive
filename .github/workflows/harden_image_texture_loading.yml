name: Harden image texture loading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'VegettoSan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch image safety and texture loading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          s = ui.read_text()
          s = s.replace('#include <cstring>\n#include <utility>', '#include <cstring>\n#include <set>\n#include <utility>')
          s = s.replace('constexpr size_t MAX_APP_TEXTURES=9,MAX_SCREENSHOT_TEXTURES=5;', 'constexpr size_t MAX_APP_TEXTURES=6,MAX_SCREENSHOT_TEXTURES=3;')
          s = s.replace('void FullCatalogScreen::prepareImageTexture(const std::string&url,const std::string&ns){\n    if(!imageCache_||url.empty())return;', 'void FullCatalogScreen::prepareImageTexture(const std::string&url,const std::string&ns){\n    static std::set<std::string> failedTextureLoads;\n    if(!imageCache_||url.empty())return;')
          s = s.replace('    if(imageCache_->isFailed(path)||!imageCache_->isReady(path))return;\n    auto it=textures_.find(path);', '    if(imageCache_->isFailed(path)||!imageCache_->isReady(path))return;\n    if(failedTextureLoads.find(path)!=failedTextureLoads.end())return;\n    auto it=textures_.find(path);')
          s = s.replace('    if(!t){SceIoStat st={};long long sz=-1;', '    if(!t){failedTextureLoads.insert(path);SceIoStat st={};long long sz=-1;')
          old = '''void FullCatalogScreen::prepareVisibleTextures(){
    if(!imageCache_)return;
    auto prepareItem=[&](const CatalogItem&it,bool detail){
        prepareImageTexture(!it.icon.empty()?it.icon:it.cover,"app");
        if(detail){const size_t sc=std::min<size_t>(5,it.screenshots.size());for(size_t i=0;i<sc;++i)prepareImageTexture(it.screenshots[i],"shot");}
    };'''
          new = '''void FullCatalogScreen::prepareVisibleTextures(){
    if(!imageCache_)return;
    static size_t loadsThisFrame=0;
    loadsThisFrame=0;
    auto prepare=[&](const std::string&url,const std::string&ns){
        if(loadsThisFrame>=2)return;
        if(url.empty())return;
        std::string path=imageCache_->request(url,ns);
        if(imageCache_->isFailed(path)||!imageCache_->isReady(path))return;
        static std::set<std::string> countedLoads;
        if(countedLoads.find(path)!=countedLoads.end())return;
        auto it=textures_.find(path);
        if(it!=textures_.end())return;
        prepareImageTexture(url,ns);
        if(textures_.find(path)!=textures_.end()){countedLoads.insert(path);++loadsThisFrame;}
    };
    auto prepareItem=[&](const CatalogItem&it,bool detail){
        prepare(!it.icon.empty()?it.icon:it.cover,"app");
        if(detail){const size_t sc=std::min<size_t>(5,it.screenshots.size());for(size_t i=0;i<sc;++i)prepare(it.screenshots[i],"shot");}
    };'''
          if old not in s:
              raise SystemExit('prepareVisibleTextures block not found')
          s = s.replace(old, new)
          ui.write_text(s)

          ic = Path('Client PSVitaAlive/source/ui/image_cache.cpp')
          s = ic.read_text()
          s = s.replace('if(!png_image_begin_read_from_file(&image,path.c_str()))return false;image.format=PNG_FORMAT_RGBA;size_t bytes=PNG_IMAGE_SIZE(image);', 'if(!png_image_begin_read_from_file(&image,path.c_str()))return false;if(image.width==0||image.height==0||image.width>2048||image.height>2048){png_image_free(&image);return false;}image.format=PNG_FORMAT_RGBA;size_t bytes=PNG_IMAGE_SIZE(image);')
          s = s.replace('jpeg_start_decompress(&cinfo);size_t rowBytes=', 'jpeg_start_decompress(&cinfo);if(cinfo.output_width==0||cinfo.output_height==0||cinfo.output_width>2048||cinfo.output_height>2048){jpeg_abort_decompress(&cinfo);jpeg_destroy_decompress(&cinfo);std::fclose(in);return false;}size_t rowBytes=')
          ic.write_text(s)
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Client PSVitaAlive/source/ui/full_catalog_screen.cpp" "Client PSVitaAlive/source/ui/image_cache.cpp"
          git commit -m "Harden cached image texture loading" || true
          git rm .github/workflows/harden_image_texture_loading.yml
          git commit -m "Remove temporary image loading workflow"
          git push
