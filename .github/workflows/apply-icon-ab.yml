name: Apply icon A+B
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_icon_ab.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Client PSVitaAlive/source/ui/image_cache.cpp"
          git commit -m "fix(images): drop services/img; 8 attempts for real icon URLs" || echo nochange
          git push
