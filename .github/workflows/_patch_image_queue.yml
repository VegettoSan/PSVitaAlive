name: Temporary image queue patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch.py
          python3 /tmp/patch.py
          rm -f .github/workflows/_patch_image_queue.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Client PSVitaAlive/include/ui/image_cache.hpp' 'Client PSVitaAlive/source/ui/image_cache.cpp' '.github/workflows/_patch_image_queue.yml'
          git commit -m 'Prevent interactive image queue growth'
          git push origin main
