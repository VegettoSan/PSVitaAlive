name: Temporary image queue patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          header = Path('Client PSVitaAlive/include/ui/image_cache.hpp')
          s = header.read_text()
          old = '    void cancelQueuedRequests();\n'
          new = '    void cancelQueuedRequests();\n    void cancelQueuedRequestsExcept(const std::vector<std::string>& paths);\n'
          if old not in s:
              raise SystemExit('header anchor not found')
          header.write_text(s.replace(old, new, 1))

          cache = Path('Client PSVitaAlive/source/ui/image_cache.cpp')
          s = cache.read_text()
          old = 'void ImageCache::cancelQueuedRequests(){if(mutex_<0)return;sceKernelLockMutex(mutex_,1,nullptr);std::vector<std::string>cancelled;cancelled.reserve(queue_.size());for(const Job&j:queue_)cancelled.push_back(j.path);const size_t count=queue_.size();queue_.clear();for(const auto&p:cancelled)pending_.erase(std::remove(pending_.begin(),pending_.end(),p),pending_.end());sceKernelUnlockMutex(mutex_,1);if(count){char m[160];sceClibSnprintf(m,sizeof(m),"[ImageCache] cancelled queued requests=%u",(unsigned)count);diagnostics::log(m);}}'
          new = old + '\nvoid ImageCache::cancelQueuedRequestsExcept(const std::vector<std::string>&paths){if(mutex_<0)return;sceKernelLockMutex(mutex_,1,nullptr);size_t removed=0;std::vector<Job>kept;kept.reserve(queue_.size());for(const Job&j:queue_){if(std::find(paths.begin(),paths.end(),j.path)!=paths.end())kept.push_back(j);else{pending_.erase(std::remove(pending_.begin(),pending_.end(),j.path),pending_.end());++removed;}}queue_.swap(kept);sceKernelUnlockMutex(mutex_,1);if(removed){char m[180];sceClibSnprintf(m,sizeof(m),"[ImageCache] pruned stale queued requests=%u",(unsigned)removed);diagnostics::log(m);}}'
          if old not in s:
              raise SystemExit('cache anchor not found')
          cache.write_text(s.replace(old, new, 1))

          ui = Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          s = ui.read_text()
          start = s.index('void FullCatalogScreen::prepareVisibleTextures(){')
          end = s.index('\nvoid FullCatalogScreen::drawImage(', start)
          new = '''void FullCatalogScreen::prepareVisibleTextures(){
    if(!imageCache_||catalogLoading_||installProgressActive_)return;
    std::vector<std::string>keepPaths;
    auto queueOne=[&](const std::string&url,const char*ns){
        if(url.empty())return;
        std::string path=imageCache_->request(url,ns);
        if(!path.empty())keepPaths.push_back(path);
    };
    auto prepareOne=[&](const std::string&url,const char*ns,bool&loadedThisFrame){
        if(loadedThisFrame||url.empty())return;
        const size_t before=textures_.size();
        prepareImageTexture(url,ns);
        loadedThisFrame=textures_.size()>before;
    };
    if(state_.mode==UiMode::FULL_CATALOG){
        const int first=std::max(0,state_.catalogScrollRow*3);
        const int last=std::min((int)items_.size(),first+9);
        for(int i=first;i<last;++i)queueOne(!items_[i].icon.empty()?items_[i].icon:items_[i].cover,"app");
        imageCache_->cancelQueuedRequestsExcept(keepPaths);
        bool loadedThisFrame=false;
        for(int i=first;i<last&&!loadedThisFrame;++i)prepareOne(!items_[i].icon.empty()?items_[i].icon:items_[i].cover,"app",loadedThisFrame);
        return;
    }
    if(state_.mode==UiMode::OPENING_DETAIL||state_.mode==UiMode::SPLIT_DETAIL||state_.mode==UiMode::CLOSING_DETAIL){
        const int first=std::max(0,state_.catalogScrollRow);
        const int last=std::min((int)items_.size(),first+visibleRowsSplit()+1);
        for(int i=first;i<last;++i)queueOne(!items_[i].icon.empty()?items_[i].icon:items_[i].cover,"app");
        const int selected=selectedIndex();
        if(selected>=0){
            const CatalogItem&it=items_[selected];
            const int panelX=SCREEN_W/2,panelY=HEADER_H+TABS_H,panelW=SCREEN_W-panelX,panelH=SCREEN_H-HEADER_H-TABS_H-FOOTER_H;
            const int cx=panelX+18,cw=panelW-36,top=panelY+DETAIL_HEADER_H+10,bottom=panelY+panelH-10,scroll=std::max(0,state_.detailScroll);
            int mc=std::max(18,cw/7);std::vector<std::string>pre;auto add=[&](const std::string&v){if(v.empty())return;pre.push_back("");std::vector<std::string>q;wrapText(v,mc,q);pre.insert(pre.end(),q.begin(),q.end());pre.push_back("");};add(it.description);add(it.longDescription);
            const int links=it.linkDetails.empty()?0:10+(int)it.linkDetails.size()*(LINK_ROW_H+LINK_GAP);
            const int shotTop=top+links+(int)pre.size()*LINE_H-scroll,shotH=SCREENSHOT_ROW_H-18,sc=std::min(5,(int)it.screenshots.size());
            for(int k=0;k<sc;++k){const int sy=shotTop+k*SCREENSHOT_ROW_H;if(sy+shotH>top&&sy<bottom)queueOne(it.screenshots[k],"shot");}
        }
        imageCache_->cancelQueuedRequestsExcept(keepPaths);
        bool loadedThisFrame=false;
        for(int i=first;i<last&&!loadedThisFrame;++i)prepareOne(!items_[i].icon.empty()?items_[i].icon:items_[i].cover,"app",loadedThisFrame);
        if(selected>=0&&!loadedThisFrame){
            const CatalogItem&it=items_[selected];
            const int panelX=SCREEN_W/2,panelY=HEADER_H+TABS_H,panelW=SCREEN_W-panelX,panelH=SCREEN_H-HEADER_H-TABS_H-FOOTER_H;
            const int cx=panelX+18,cw=panelW-36,top=panelY+DETAIL_HEADER_H+10,bottom=panelY+panelH-10,scroll=std::max(0,state_.detailScroll);
            int mc=std::max(18,cw/7);std::vector<std::string>pre;auto add=[&](const std::string&v){if(v.empty())return;pre.push_back("");std::vector<std::string>q;wrapText(v,mc,q);pre.insert(pre.end(),q.begin(),q.end());pre.push_back("");};add(it.description);add(it.longDescription);
            const int links=it.linkDetails.empty()?0:10+(int)it.linkDetails.size()*(LINK_ROW_H+LINK_GAP);
            const int shotTop=top+links+(int)pre.size()*LINE_H-scroll,shotH=SCREENSHOT_ROW_H-18,sc=std::min(5,(int)it.screenshots.size());
            for(int k=0;k<sc&&!loadedThisFrame;++k){const int sy=shotTop+k*SCREENSHOT_ROW_H;if(sy+shotH>top&&sy<bottom)prepareOne(it.screenshots[k],"shot",loadedThisFrame);}
        }
    }
}'''
          ui.write_text(s[:start] + new + s[end:])

          wf = Path('.github/workflows/_patch_image_queue.yml')
          wf.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','Client PSVitaAlive/include/ui/image_cache.hpp','Client PSVitaAlive/source/ui/image_cache.cpp','Client PSVitaAlive/source/ui/full_catalog_screen.cpp','.github/workflows/_patch_image_queue.yml'],check=True)
          subprocess.run(['git','commit','-m','Prevent stale image download queue growth'],check=True)
          subprocess.run(['git','push','origin','main'],check=True)
          PY
