name: Validate Game Files directory traversal and route collision fix
on:
  push:
    branches: [work/fix-false-shared-routes-20261106]
    paths: [.github/workflows/shared-data-roots-staging.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safety and cache regression tests
        run: |
          set -e
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" tests/test_installed_data_policy.cpp -o /tmp/psva-safe-paths
          /tmp/psva-safe-paths
          c++ -std=c++17 -Wall -Wextra -Werror -I"Client PSVitaAlive/include" tests/test_installed_directory_cache.cpp "Client PSVitaAlive/source/storage/installed_directory_codec.cpp" -o /tmp/psva-index
          /tmp/psva-index
          git diff --check
      - name: Build with VitaSDK
        run: |
          docker pull vitasdk/vitasdk:2026.08
          docker run --rm -v "$PWD:/workspace" \
            -w "/workspace/Client PSVitaAlive" vitasdk/vitasdk:2026.08 \
            bash -lc 'set -euo pipefail; cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release; cmake --build build-ci --parallel 2; test -s build-ci/PSVitaAlive.vpk'
      - name: Upload PSVitaAlive test VPK
        uses: actions/upload-artifact@v4
        with:
          name: PSVitaAlive-no-false-shared-routes
          path: Client PSVitaAlive/build-ci/PSVitaAlive.vpk
          if-no-files-found: error
      - name: Remove staging-only workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/shared-data-roots-staging.yml
          git add -A
          git commit -m "Finalize installed data route conflict fix"
          git push origin HEAD:work/fix-false-shared-routes-20261106
