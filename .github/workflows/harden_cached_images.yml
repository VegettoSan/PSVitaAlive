name: Harden cached images
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Harden cached images')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch image safety
        shell: python
        run: |
          from pathlib import Path
          ui=Path('Client PSVitaAlive/source/ui/full_catalog_screen.cpp')
          s=ui.read_text(encoding='utf-8')
          s=s.replace('#include <cstring>\n#include <utility>','#include <cstring>\n#include <set>\n#include <utility>',1)
          s=s.replace('constexpr size_t MAX_APP_TEXTURES=9,MAX_SCREENSHOT_TEXTURES=5;','constexpr size_t MAX_APP_TEXTURES=6,MAX_SCREENSHOT_TEXTURES=3;',1)
          s=s.replace('void FullCatalogScreen::prepareImageTexture(const std::string&url,const std::string&ns){\n    if(!imageCache_||url.empty())return;','void FullCatalogScreen::prepareImageTexture(const std::string&url,const std::string&ns){\n    static std::set<std::string> failedTextureLoads;\n    if(!imageCache_||url.empty())return;',1)
          s=s.replace('    if(imageCache_->isFailed(path)||!imageCache_->isReady(path))return;\n    auto it=textures_.find(path);','    if(imageCache_->isFailed(path)||!imageCache_->isReady(path))return;\n    if(failedTextureLoads.find(path)!=failedTextureLoads.end())return;\n    auto it=textures_.find(path);',1)
          s=s.replace('    if(!t){SceIoStat st={};long long sz=-1;','    if(!t){failedTextureLoads.insert(path);SceIoStat st={};long long sz=-1;',1)
          s=s.replace('    auto prepareItem=[&](const CatalogItem&it,bool detail){\n        prepareImageTexture(!it.icon.empty()?it.icon:it.cover,"app");','    auto prepareItem=[&](const CatalogItem&it,bool detail){\n        prepareImageTexture(!it.icon.empty()?it.icon:it.cover,"app");',1)
          ui.write_text(s,encoding='utf-8')
          ic=Path('Client PSVitaAlive/source/ui/image_cache.cpp')
          s=ic.read_text(encoding='utf-8')
          s=s.replace('if(!png_image_begin_read_from_file(&image,path.c_str()))return false;image.format=PNG_FORMAT_RGBA;size_t bytes=PNG_IMAGE_SIZE(image);','if(!png_image_begin_read_from_file(&image,path.c_str()))return false;if(image.width==0||image.height==0||image.width>2048||image.height>2048){png_image_free(&image);return false;}image.format=PNG_FORMAT_RGBA;size_t bytes=PNG_IMAGE_SIZE(image);',1)
          s=s.replace('jpeg_start_decompress(&cinfo);size_t rowBytes=','jpeg_start_decompress(&cinfo);if(cinfo.output_width==0||cinfo.output_height==0||cinfo.output_width>2048||cinfo.output_height>2048){jpeg_abort_decompress(&cinfo);jpeg_destroy_decompress(&cinfo);std::fclose(in);return false;}size_t rowBytes=',1)
          ic.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/harden_cached_images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Client PSVitaAlive/source/ui/full_catalog_screen.cpp' 'Client PSVitaAlive/source/ui/image_cache.cpp' .github/workflows/harden_cached_images.yml
          git commit -m 'Harden cached image texture loading'
          git push
