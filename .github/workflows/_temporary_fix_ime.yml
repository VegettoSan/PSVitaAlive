name: Temporary IME Lifecycle Repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary_fix_ime.yml'

permissions:
  contents: write

jobs:
  fix-ime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch promptText IME lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Client PSVitaAlive/source/main.cpp')
          text = path.read_text(encoding='utf-8')

          old_cleanup = '''    // If a previous dialog was aborted mid-way, clean it up (prevents ALREADY_OPENED crashes).\n    {\n        const SceCommonDialogStatus st = sceImeDialogGetStatus();\n        if (st != SCE_COMMON_DIALOG_STATUS_NONE) {\n            sceClibPrintf("[UI] IME leftover status=%d — terminating\\n", (int)st);\n            sceImeDialogTerm();\n        }\n    }\n\n'''
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'Expected exactly one pre-init IME cleanup block, found {text.count(old_cleanup)}')
          text = text.replace(old_cleanup, '', 1)

          old_loop = '''    // Cap wait so a stuck dialog cannot hang the process forever.\n    int spin = 0;\n    while (sceImeDialogGetStatus() != SCE_COMMON_DIALOG_STATUS_FINISHED) {\n        vita2d_start_drawing();\n        vita2d_clear_screen();\n        vita2d_draw_rectangle(0, 0, 960, 544, RGBA8(0, 0, 0, 180));\n        vita2d_end_drawing();\n        vita2d_common_dialog_update();\n        vita2d_swap_buffers();\n        sceKernelDelayThread(16 * 1000); // ~60 FPS pacing (more stable than 1ms busy loop)\n        if (++spin > 60 * 120) { // ~2 minutes safety\n            sceClibPrintf("[UI] IME wait timeout — aborting dialog\\n");\n            sceImeDialogAbort();\n            break;\n        }\n    }\n\n    SceImeDialogResult result;\n    sceClibMemset(&result, 0, sizeof(result));\n    const int gr = sceImeDialogGetResult(&result);\n    if (gr < 0) {\n        sceClibPrintf("[UI] sceImeDialogGetResult failed: 0x%08X\\n", gr);\n    }\n    const bool ok = (result.button == SCE_IME_DIALOG_BUTTON_ENTER);\n    if (ok) {\n        out = wideToAscii(inputBuf);\n    }\n    sceImeDialogTerm();\n    imeBusy = false;\n    return ok;\n'''

          new_loop = '''    // Cap wait so a stuck dialog cannot hang the process forever.\n    int spin = 0;\n    bool aborted = false;\n    SceCommonDialogStatus status = SCE_COMMON_DIALOG_STATUS_NONE;\n    while ((status = sceImeDialogGetStatus()) != SCE_COMMON_DIALOG_STATUS_FINISHED) {\n        vita2d_start_drawing();\n        vita2d_clear_screen();\n        vita2d_draw_rectangle(0, 0, 960, 544, RGBA8(0, 0, 0, 180));\n        vita2d_end_drawing();\n        vita2d_common_dialog_update();\n        vita2d_swap_buffers();\n        sceKernelDelayThread(16 * 1000); // ~60 FPS pacing\n        if (++spin > 60 * 120) {\n            sceClibPrintf("[UI] IME wait timeout — aborting dialog\\n");\n            sceImeDialogAbort();\n            aborted = true;\n            break;\n        }\n    }\n\n    // Abort is asynchronous: let the common dialog reach FINISHED before reading\n    // the result or terminating it. This avoids tearing down an active IME state.\n    if (aborted) {\n        for (int cleanupSpin = 0; cleanupSpin < 120; ++cleanupSpin) {\n            status = sceImeDialogGetStatus();\n            if (status == SCE_COMMON_DIALOG_STATUS_FINISHED) break;\n            vita2d_common_dialog_update();\n            sceKernelDelayThread(16 * 1000);\n        }\n    }\n\n    SceImeDialogResult result{};\n    const int gr = sceImeDialogGetResult(&result);\n    if (gr < 0) {\n        sceClibPrintf("[UI] sceImeDialogGetResult failed: 0x%08X\\n", gr);\n    }\n    const bool ok = (gr >= 0 && result.button == SCE_IME_DIALOG_BUTTON_ENTER);\n    if (ok) {\n        out = wideToAscii(inputBuf);\n    }\n\n    sceImeDialogTerm();\n    imeBusy = false;\n    return ok;\n'''

          if text.count(old_loop) != 1:
              raise SystemExit(f'Expected exactly one IME wait/result block, found {text.count(old_loop)}')
          text = text.replace(old_loop, new_loop, 1)

          path.write_text(text, encoding='utf-8')
          print('IME lifecycle patch applied successfully')
          PY

      - name: Verify exact change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Client PSVitaAlive/source/main.cpp').read_text(encoding='utf-8')

          bad = 'const SceCommonDialogStatus st = sceImeDialogGetStatus();\n        if (st != SCE_COMMON_DIALOG_STATUS_NONE) {'
          if bad in text:
              raise SystemExit('ERROR: pre-init IME cleanup block still exists')

          required = [
              'bool aborted = false;',
              'SceCommonDialogStatus status = SCE_COMMON_DIALOG_STATUS_NONE;',
              'if (aborted) {',
              'const int gr = sceImeDialogGetResult(&result);',
              'const bool ok = (gr >= 0 && result.button == SCE_IME_DIALOG_BUTTON_ENTER);',
              'sceImeDialogTerm();',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'ERROR: expected IME fix fragment missing: {item}')
          print('Verification passed')
          PY

          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_temporary_fix_ime.yml
          git add 'Client PSVitaAlive/source/main.cpp' '.github/workflows/_temporary_fix_ime.yml'
          git diff --cached --check
          git commit -m 'fix(client): harden IME dialog lifecycle'
          git push origin HEAD:main
