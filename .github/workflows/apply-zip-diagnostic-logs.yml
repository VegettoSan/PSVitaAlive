name: Apply ZIP diagnostic logging

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ZIP diagnostic patches
        run: python3 scripts/apply_zip_diagnostic_logs.py
      - name: Commit patched sources and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status
          git commit -m "fix: improve ZIP extraction diagnostics and report log isolation" || echo nochange
          git push
